<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvestVerdict — DCF Valuation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{ --navy:#f6f3ec; --navy2:#ffffff; --gold:#c9982a; --gold-soft:#8a6a15; --mut:#6d675a;
    --sh-bg:#ffffff; --sh-text:#1d1d1d; --sh-head:#3c7d3f; --sh-banner:#5a9550; --sh-accent:#2f6b32; --sh-muted:#8a8a8a;
    --amber:#b08400; --amber-bg:#fff6df; --good:#1f7a3d; --bad:#b3261e; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;}
  header{display:flex;align-items:baseline;gap:14px;padding:18px 26px;border-bottom:1px solid #e3dcc9;background:var(--navy2);}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1.4px;color:#8a6a15;}
  header .sub{color:var(--mut);font-size:13px;} header a{margin-left:auto;color:var(--gold-soft);text-decoration:none;font-size:13px;border:1px solid #e3dcc9;padding:7px 14px;border-radius:8px;}
  main{max-width:1240px;margin:0 auto;padding:24px;}
  h2{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;font-size:26px;margin:0 0 6px;color:#20272f;}
  h2 .meta{font-family:'DM Sans';font-weight:400;color:var(--mut);font-size:13px;letter-spacing:0;}
  h3{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--gold-soft);font-size:16px;margin:20px 0 8px;}
  .empty{color:var(--mut);padding:50px;text-align:center;}
  .d-scroll{overflow-x:auto;}

  /* every content block is a white Excel sheet, like the Analysis screen */
  .hero,.d-inputs,.d-out,.d-ig,.d-tvmethod,.d-limits,.chartbox{
    background:var(--sh-bg); color:var(--sh-text); border:1px solid #d6dce4; border-radius:8px;
    box-shadow:0 10px 28px -20px rgba(31,28,20,.22); font-family:'DM Sans',Arial,sans-serif;}

  /* hero result banner (Excel green title-bar style) */
  .hero{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between;
    padding:0;overflow:hidden;margin:8px 0 18px;border-left:0;}
  .hero::before{content:"Discounted Cash Flow — Fair Value";display:block;width:100%;background:var(--sh-head);color:#fff;
    font-weight:700;font-size:13px;text-align:center;padding:7px 10px;}
  .hero-main,.hero-verdict{padding:18px 26px;}
  .hero-k{color:var(--sh-muted);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;}
  .hero-val{font-family:'Bebas Neue',sans-serif;font-size:56px;line-height:1;letter-spacing:1px;color:var(--sh-head);}
  .hero-per{font-size:20px;color:var(--sh-muted);}
  .hero-sub{color:var(--sh-muted);font-size:12.5px;margin-top:6px;}
  .hero-verdict{text-align:center;min-width:220px;border-left:1px solid #e3e7ea;}
  .hv-word{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;}
  .hero-verdict.good .hv-word{color:var(--good);} .hero-verdict.bad .hv-word{color:var(--bad);}
  .hv-gap{font-size:19px;font-weight:700;} .hero-verdict.good .hv-gap{color:var(--good);} .hero-verdict.bad .hv-gap{color:var(--bad);}
  .gauge{display:block;margin:8px auto 4px;} .hv-foot{color:var(--sh-muted);font-size:11px;}

  /* layout */
  .d-grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start;}
  @media(max-width:900px){.d-grid{grid-template-columns:1fr;}}
  .d-ig{padding:12px 14px;margin-bottom:12px;}
  .d-igh{background:var(--sh-banner);color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;
    margin:-12px -14px 10px;padding:6px 12px;}
  .d-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0;}
  .d-row label{color:#555;font-size:12.5px;display:flex;gap:5px;align-items:center;}
  .ⓘ{color:var(--sh-head);cursor:help;font-size:11px;opacity:.8;}
  .d-inwrap{display:flex;align-items:center;gap:3px;}
  .d-row input{width:86px;background:#fbfdfb;border:1px solid #c9d3c9;color:var(--sh-text);border-radius:6px;padding:5px 7px;text-align:right;font-size:13px;}
  .d-row input:focus{outline:none;border-color:var(--sh-head);}
  .d-u{color:var(--sh-muted);font-size:11px;}
  .d-tvmethod{padding:12px 14px;color:#444;font-size:12.5px;display:flex;flex-direction:column;gap:6px;}
  .d-tvmethod label{display:flex;gap:6px;align-items:center;}
  .d-exitm{width:54px;background:#fbfdfb;border:1px solid #c9d3c9;color:var(--sh-text);border-radius:6px;padding:3px 5px;text-align:right;}

  .d-warnbox{background:var(--amber-bg);border:1px solid #7a5c10;border-radius:8px;padding:10px 14px;margin-top:12px;color:var(--amber);font-size:12.5px;display:flex;flex-direction:column;gap:6px;}

  /* WACC build-up as an Excel row band */
  .wacc-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--sh-bg);border:1px solid #d6dce4;border-radius:8px;overflow:hidden;box-shadow:0 10px 28px -20px rgba(31,28,20,.22);}
  @media(max-width:760px){.wacc-cards{grid-template-columns:1fr 1fr;}}
  .wc{padding:14px;border-right:1px solid #eef1ec;border-bottom:1px solid #eef1ec;}
  .wc span{color:var(--sh-muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  .wc b{display:block;font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--sh-text);margin:2px 0;}
  .wc i{color:var(--sh-muted);font-size:11px;font-style:normal;}
  .wc.accent{background:#f3f8f3;} .wc.accent b{color:var(--sh-head);}

  /* Excel-style calc tables */
  table.dt,table.sens{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--sh-bg);border:1px solid #d6dce4;border-radius:8px;box-shadow:0 10px 28px -20px rgba(31,28,20,.22);}
  table.dt th,table.dt td,table.sens th,table.sens td{padding:7px 11px;border-bottom:1px solid #eef1ec;text-align:right;white-space:nowrap;color:var(--sh-text);}
  table.dt th:first-child,table.dt td:first-child,table.sens th:first-child{text-align:left;}
  table.dt thead th,table.sens thead th{background:#f3f6f3;color:#555;font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--sh-head);}
  table.dt tr.sub td{color:var(--sh-head);} table.dt tr.tot td{font-weight:700;border-top:2px solid var(--sh-accent);border-bottom:2px solid var(--sh-accent);}
  table.sens td{text-align:center;font-variant-numeric:tabular-nums;}
  table.sens td.base{outline:2px solid var(--gold);outline-offset:-2px;font-weight:700;}

  .d-note{color:var(--mut);font-size:12px;max-width:820px;margin:6px 0;} .d-note b{color:var(--gold-soft);}
  .d-limits{padding:14px 18px;margin-top:18px;}
  .d-limits h3{color:var(--sh-head);margin-top:0;}
  .d-limits ul{margin:6px 0 0;padding-left:18px;color:#444;font-size:13px;line-height:1.55;}
  .d-limits b{color:var(--sh-head);}
  .chartbox{padding:14px;margin-top:12px;}
</style>
</head>
<body>
<header>
  <span class="brand">InvestVerdict</span>
  <span class="sub">DCF Valuation — what is it worth?</span>
  <a href="/valuation.html">← Choose model</a>
</header>
<main id="app"><div class="empty" id="empty">No forecast found. Go to the <a href="/" style="color:var(--gold-soft)">extractor</a> → confirm → Analyse → Forecast (build the model), then come here.</div></main>

<script type="module">
  import { renderDcfApp } from "./dcf/dcf-ui.mjs";
  import { normaliseHistoricals } from "./model/normalise.mjs";
  import { seedAssumptions, buildModel } from "./model/engine.mjs";
  let model = null;
  const fc = sessionStorage.getItem("iv_forecast");
  if (fc) { try { model = JSON.parse(fc); } catch (e) {} }
  if (!model) { const cf = sessionStorage.getItem("iv_confirmed"); if (cf) { const c = JSON.parse(cf); const h = normaliseHistoricals(c); model = buildModel(h, { ...seedAssumptions(h) }, 3); } }
  if (model && model.forecastPeriods && model.forecastPeriods.length) { document.getElementById("empty").remove(); renderDcfApp(document.getElementById("app"), model); }
</script>
</body>
</html>
