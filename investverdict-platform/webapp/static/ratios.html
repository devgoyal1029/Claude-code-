<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvestVerdict — Ratio Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#f6f3ec; --navy2:#ffffff; --panel:#fbf9f3; --line:#e3dcc9;
    --gold:#c9982a; --gold-soft:#8a6a15; --txt:#20272f; --mut:#6d675a; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;}
  header{display:flex;align-items:baseline;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line);background:var(--navy2);}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1.4px;color:#8a6a15;}
  header .sub{color:var(--mut);font-size:13px;} header a{margin-left:auto;color:var(--gold-soft);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:7px 14px;border-radius:8px;}
  header a + a{margin-left:10px;}
  main{max-width:1340px;margin:0 auto;padding:24px;}
  h2{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;font-size:26px;margin:0;}
  h2 .meta{font-family:'DM Sans';font-weight:400;color:var(--mut);font-size:13px;letter-spacing:0;}
  .r-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
  .r-market{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:12.5px;}
  .r-market input{width:120px;background:var(--navy);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px 8px;margin-left:5px;}
  .r-market .hint{font-style:italic;}
  .r-intro{color:var(--mut);font-size:13.5px;line-height:1.55;max-width:900px;margin:10px 0 4px;} .r-intro b{color:var(--gold-soft);}
  .disclaimer{color:var(--mut);font-size:11.5px;font-style:italic;margin-top:12px;}
  .empty{color:var(--mut);padding:50px;text-align:center;}

  /* white sheet */
  .sheet{background:#fff;color:#1d1d1d;border:1px solid #d6dce4;border-radius:8px;padding:8px;margin-top:14px;box-shadow:0 18px 44px -30px rgba(31,28,20,.25);}
  .xl-scroll{overflow-x:auto;}
  table.xl{width:100%;border-collapse:collapse;font-size:12.5px;color:#1d1d1d;background:#fff;}
  table.xl th{background:#fff;color:#333;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:right;padding:7px 12px;border-bottom:2px solid #3c7d3f;}
  table.xl th.lbl{text-align:left;min-width:230px;}
  table.xl th.fcol{background:#fbf3df;color:#8a6d12;}
  table.xl td{padding:5px 12px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;border-bottom:1px solid #eef1f5;}
  table.xl td.lbl{text-align:left;}
  table.xl td.fcol{background:#fdf8ec;}
  /* category header rows */
  tr.cat-row td{background:#eef4ee;color:#1f7a3d;font-weight:700;font-size:12px;cursor:pointer;padding:8px 12px;border-bottom:1px solid #d7e3d7;}
  tr.cat-row .caret{display:inline-block;width:14px;color:#3c7d3f;}
  tr.cat-row .needs{color:#b08400;font-weight:500;font-style:italic;}
  /* ratio rows (clickable) */
  tr.ratio-row{cursor:pointer;} tr.ratio-row:hover td{background:#f7faf7;}
  tr.ratio-row td.fcol:hover{background:#f6efdc;}
  .rname{border-bottom:1px dotted #9bbf9b;}
  .spark{vertical-align:middle;margin-left:8px;}
  /* expanded detail */
  tr.ratio-exp td{background:#f3f7f3;border-bottom:1px solid #d7e3d7;padding:10px 16px;white-space:normal;text-align:left;}
  .exp-formula{font-family:ui-monospace,monospace;font-size:12px;color:#1f5e2c;margin-bottom:6px;}
  .exp-calc{display:flex;flex-wrap:wrap;gap:4px 22px;margin-bottom:6px;}
  .exp-line{font-size:12px;color:#333;} .exp-yr{color:#8a6d12;font-weight:700;margin-right:4px;}
  .exp-meaning{font-size:12.5px;color:#555;font-style:italic;}
</style>
</head>
<body>
<header>
  <span class="brand">InvestVerdict</span>
  <span class="sub">Ratio Analysis</span>
  <a href="/forecast.html">← Forecast</a>
  <a href="/valuation.html">Valuation →</a>
</header>
<main id="app"><div class="empty" id="empty">No data found. Go to the <a href="/" style="color:var(--gold-soft)">extractor</a> → confirm → Analyse → Forecast, then come here.</div></main>

<script type="module">
  import { renderRatiosApp } from "./ratios/ratios-ui.mjs";
  import { normaliseHistoricals } from "./model/normalise.mjs";
  import { seedAssumptions, buildModel } from "./model/engine.mjs";

  let model = null;
  const fc = sessionStorage.getItem("iv_forecast");
  if (fc) { try { model = JSON.parse(fc); } catch (e) {} }
  if (!model) {                                   // fallback: build from confirmed historicals
    const cf = sessionStorage.getItem("iv_confirmed");
    if (cf) { const c = JSON.parse(cf); const h = normaliseHistoricals(c); model = buildModel(h, { ...seedAssumptions(h) }, 3); }
  }
  if (model) { document.getElementById("empty").remove(); renderRatiosApp(document.getElementById("app"), model); }
</script>
</body>
</html>
