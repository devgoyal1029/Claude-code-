<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvestVerdict — Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{ --navy:#f6f3ec; --navy2:#ffffff; --panel:#fbf9f3; --line:#e3dcc9;
    --gold:#c9982a; --gold-soft:#8a6a15; --txt:#20272f; --mut:#6d675a;
    --amber:#9a6d00; --amber-bg:#fdf3d9; --good:#157a4c; --good-bg:#eaf5ee;
    --bad:#c23a2e; --bad-bg:#fdeeec; --fc:#e4f2e8; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--navy);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;}
  header{display:flex;align-items:baseline;gap:14px;padding:18px 26px;border-bottom:1px solid var(--line);background:var(--navy2);}
  .brand{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1.4px;color:#8a6a15;}
  header .sub{color:var(--mut);font-size:13px;}
  header a{margin-left:auto;color:var(--gold-soft);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:7px 14px;border-radius:8px;}
  main{max-width:1340px;margin:0 auto;padding:24px;}
  h2{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;font-size:26px;margin:0;}
  h2 .meta{font-family:'DM Sans';font-weight:400;color:var(--mut);font-size:13px;letter-spacing:0;}
  h3{font-family:'Bebas Neue',sans-serif;letter-spacing:1px;color:var(--gold);font-size:19px;margin:22px 0 8px;}
  .fc-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .fc-years{color:var(--mut);font-size:13px;display:flex;gap:8px;align-items:center;}
  .fc-years select{background:var(--navy);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 8px;}
  .fc-intro{color:var(--mut);font-size:13.5px;line-height:1.55;max-width:900px;margin:8px 0 4px;}
  .fc-intro b{color:var(--gold-soft);} .fc-conv{display:block;margin-top:5px;font-size:12.5px;}
  .empty{color:var(--mut);padding:50px;text-align:center;}

  /* assumptions table */
  .fc-asm-wrap{overflow-x:auto;}
  table.asm{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13px;}
  table.asm th,table.asm td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
  table.asm th:first-child,table.asm td:first-child{text-align:left;}
  table.asm thead th{background:var(--navy2);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  table.asm thead th.fc{background:var(--fc);color:var(--gold-soft);}
  .asm-lbl{font-weight:600;}
  .teachbtn{border:0;background:none;color:var(--gold-soft);cursor:pointer;font-size:12px;opacity:.7;}
  .teachbtn:hover{opacity:1;}
  td.hist{color:var(--mut);font-style:italic;}
  .asm-in{width:74px;background:var(--navy);border:1px solid var(--line);color:var(--txt);border-radius:6px;
    padding:5px 6px;text-align:right;font-size:13px;font-family:'DM Sans';}
  .asm-in:focus{outline:none;border-color:var(--gold);}
  .asm-in.warn{border-color:var(--amber);background:#241d08;}
  .asm-u{color:var(--mut);font-size:11px;margin-left:3px;}

  /* warnings */
  .fc-warnbox{background:var(--amber-bg);border:1px solid #e8d49c;border-radius:10px;padding:12px 16px;margin-top:14px;color:var(--amber);}
  .fc-warnbox ul{margin:8px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px;}
  .fc-warnbox li{font-size:12.5px;} .fc-warnbox .tag{color:var(--gold-soft);font-weight:700;margin-right:6px;}
  .fc-warnbox .disclaimer{color:var(--mut);font-size:11px;margin-top:8px;font-style:italic;}

  /* balance badge */
  .vbar{border-radius:10px;padding:12px 16px;font-weight:700;margin-top:14px;}
  .vbar.good{background:var(--good-bg);color:var(--good);border:1px solid #bfdccb;}
  .vbar.bad{background:var(--bad-bg);color:var(--bad);border:1px solid #f0cfc9;}
  .vlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;}
  .vlist li.fail{color:var(--bad);background:var(--bad-bg);border:1px solid #f0cfc9;border-radius:7px;padding:6px 10px;font-size:12.5px;}
  .vlist .tag{font-weight:700;margin-right:6px;}

  /* forecast tables */
  .fc-scroll{overflow-x:auto;}
  table.fct{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
  table.fct th,table.fct td{padding:7px 11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
  table.fct th:first-child,table.fct td:first-child{text-align:left;}
  table.fct thead th{background:var(--navy2);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}
  table.fct thead th.fc{background:var(--fc);color:var(--gold-soft);}
  table.fct td.fc{background:rgba(201,152,42,.05);}
  table.fct tr.sub td{font-weight:700;background:var(--navy2);}
  table.fct td.neg{color:var(--bad);}
  .fc-charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:820px){.fc-charts{grid-template-columns:1fr;}}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;}

  /* ===== white Excel-style forecast sheet (same structure as analysis) ===== */
  :root{ --sh-bg:#ffffff; --sh-text:#1d1d1d; --sh-head:#3c7d3f; --sh-banner:#5a9550; --sh-accent:#2f6b32; --sh-muted:#9a9a9a; }
  .sheet{background:var(--sh-bg);color:var(--sh-text);border:1px solid #d6dce4;border-radius:8px;
    padding:22px 24px 28px;margin:0 0 40px;box-shadow:0 18px 44px -30px rgba(31,28,20,.25);font-family:'DM Sans',Arial,sans-serif;}
  .sheet-hdr .co{font-family:Georgia,'Times New Roman',serif;font-size:23px;font-weight:700;color:var(--sh-text);}
  .sheet-hdr .meta{color:var(--sh-muted);font-size:12.5px;margin-top:3px;}
  .sheet-title{background:var(--sh-head);color:#fff;text-align:center;font-weight:700;font-size:14px;padding:7px 10px;margin-top:14px;}
  .sheet-title .units-note{font-weight:400;opacity:.85;font-size:12px;}
  .xl-banner{background:var(--sh-banner);color:#fff;text-align:center;font-weight:700;font-size:13px;padding:6px 10px;}
  .xl-scroll{overflow-x:auto;max-width:100%;}
  .sheet table.xl{width:100%;border-collapse:collapse;font-size:12.5px;color:var(--sh-text);background:var(--sh-bg);}
  .sheet table.xl th{background:var(--sh-bg);color:var(--sh-text);font-weight:700;font-size:11.5px;text-align:right;padding:6px 12px;border-bottom:2px solid var(--sh-head);}
  .sheet table.xl th.lbl,.sheet table.xl td.lbl{text-align:left;white-space:normal;min-width:220px;}
  .sheet table.xl td{padding:3px 12px;text-align:right;color:var(--sh-text);background:transparent;border-bottom:0;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .sheet table.xl td.lbl{font-weight:600;}
  .sheet tr.xl-val.xtot td{font-weight:700;border-top:2px solid var(--sh-accent);border-bottom:2px solid var(--sh-accent);}
  .sheet tr.xl-sub td{color:var(--sh-muted);font-style:italic;font-weight:400;font-size:11px;padding-top:0;padding-bottom:5px;}
  .sheet tr.xl-sub td.lbl{padding-left:16px;}
  .sheet td.neg{color:#c0392b;}
  /* forecast columns tinted gold so they're visually distinct from history */
  .sheet table.xl th.fcol{background:#fbf3df;color:#8a6d12;}
  .sheet table.xl td.fcol{background:#fdf8ec;}

  /* teach side panel (shared markup with the term panel) */
  .term-overlay{position:fixed;inset:0;background:rgba(31,28,20,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80;}
  .term-overlay.show{opacity:1;pointer-events:auto;}
  .term-panel{position:fixed;top:0;right:0;height:100vh;width:min(420px,92vw);z-index:90;background:var(--navy2);
    border-left:1px solid var(--line);box-shadow:-24px 0 60px -20px rgba(31,28,20,.25);transform:translateX(100%);
    transition:transform .3s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;padding:22px;}
  .term-panel.open{transform:translateX(0);}
  .tp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;}
  .tp-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.5px;color:var(--gold-soft);}
  .tp-close{background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer;line-height:1;}
  .tp-body{flex:1;overflow:auto;padding:16px 0;}
  .teach-sec{font-size:13.5px;line-height:1.55;margin-bottom:12px;color:var(--txt);}
  .teach-k{display:block;color:var(--gold-soft);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:3px;}
</style>
</head>
<body>
<header>
  <span class="brand">InvestVerdict</span>
  <span class="sub">Guided Assumptions &amp; Forecast</span>
  <a href="/analysis.html" style="margin-left:auto">← Analysis</a>
  <a href="/ratios.html" style="margin-left:10px">Ratios →</a>
</header>
<main id="app">
  <div class="empty" id="empty">
    No confirmed financial data found.<br>
    Go to the <a href="/" style="color:var(--gold-soft)">extractor</a>, confirm a statement, open Analyse, then come here to forecast.
  </div>
</main>

<div class="term-overlay" id="term-overlay"></div>
<aside class="term-panel" id="term-panel" role="dialog" aria-label="Teach me">
  <div class="tp-head"><span class="tp-title" id="tp-title"></span><button class="tp-close" id="tp-close" aria-label="Close">&times;</button></div>
  <div class="tp-body" id="tp-body"></div>
</aside>

<script type="module">
  import { renderForecastApp } from "./forecast/forecast-ui.mjs";
  const raw = sessionStorage.getItem("iv_confirmed");
  if (raw) { document.getElementById("empty").remove(); renderForecastApp(document.getElementById("app"), JSON.parse(raw)); }
</script>
</body>
</html>
