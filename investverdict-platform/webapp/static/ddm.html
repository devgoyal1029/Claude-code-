<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvestVerdict — DDM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--navy:#f6f3ec;--navy2:#ffffff;--gold:#c9982a;--gold-soft:#8a6a15;--mut:#6d675a;
  --sh-bg:#fff;--sh-text:#1d1d1d;--sh-head:#3c7d3f;--sh-banner:#5a9550;--sh-accent:#2f6b32;--sh-muted:#8a8a8a;--amber:#b08400;--amber-bg:#fff6df;}
*{box-sizing:border-box;}body{margin:0;background:var(--navy);color:#20272f;font-family:'DM Sans',sans-serif;font-size:14px;}
header{display:flex;gap:14px;padding:18px 26px;border-bottom:1px solid #e3dcc9;background:var(--navy2);align-items:baseline;}
.brand{font-family:'Bebas Neue';font-size:28px;color:#8a6a15;letter-spacing:1.4px;}
header a{margin-left:auto;color:var(--gold-soft);text-decoration:none;font-size:13px;border:1px solid #e3dcc9;padding:7px 14px;border-radius:8px;}
main{max-width:1200px;margin:0 auto;padding:24px;}
h2{font-family:'Bebas Neue';font-size:26px;letter-spacing:1px;margin:0 0 6px;color:#20272f;}
h3{font-family:'Bebas Neue';color:var(--gold-soft);font-size:16px;margin:20px 0 8px;letter-spacing:1px;}
.meta{color:var(--mut);font-size:13px;}
.learn{background:#fbf9f3;border:1px solid #e3dcc9;border-left:4px solid var(--gold);border-radius:12px;padding:14px 18px;margin:14px 0;font-size:13px;color:var(--mut);line-height:1.6;}
.learn b{color:var(--gold-soft);}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start;}
@media(max-width:900px){.grid{grid-template-columns:1fr;}}
/* Excel-white sheets for every content block, like the Analysis screen */
.ig,.hero,table,.chartbox{background:var(--sh-bg);color:var(--sh-text);border:1px solid #d6dce4;border-radius:8px;box-shadow:0 10px 28px -20px rgba(31,28,20,.22);}
.ig{padding:12px 14px;margin-bottom:12px;}
.igh{background:var(--sh-banner);color:#fff;font-size:11px;text-transform:uppercase;font-weight:700;margin:-12px -14px 10px;padding:6px 12px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0;}
.row label{color:#555;font-size:12.5px;display:flex;gap:5px;}
.row input,.row select{width:90px;background:#fbfdfb;border:1px solid #c9d3c9;color:var(--sh-text);border-radius:6px;padding:5px 7px;text-align:right;font-size:13px;}
.row select{width:auto;text-align:left;}
.hero{padding:0;overflow:hidden;margin-bottom:16px;}
.hero::before{content:"Dividend Discount Model — Value per Share";display:block;background:var(--sh-head);color:#fff;font-weight:700;font-size:13px;text-align:center;padding:7px 10px;}
.hero-k{display:block;color:var(--sh-muted);text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:700;padding:14px 22px 0;}
.hero-v{display:block;font-family:'Bebas Neue';font-size:48px;color:var(--sh-head);padding:0 22px;}
.hero .meta{padding:0 22px 16px;}
.warnbox{background:var(--amber-bg);border:1px solid #7a5c10;border-radius:8px;padding:10px 14px;color:var(--amber);font-size:12.5px;margin-top:10px;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{padding:7px 11px;border-bottom:1px solid #eef1ec;text-align:right;color:var(--sh-text);}
th:first-child,td:first-child{text-align:left;}
thead th{background:#f3f6f3;color:#555;font-size:11px;border-bottom:2px solid var(--sh-head);}
.sens td{text-align:center;} .sens td.base{outline:2px solid var(--gold);outline-offset:-2px;font-weight:700;}
.chartbox{padding:14px;margin-top:12px;}
.empty{color:var(--mut);padding:50px;text-align:center;}
</style></head><body>
<header><span class="brand">InvestVerdict</span><span class="meta">Dividend Discount Model</span><a href="/valuation.html">← Choose model</a></header>
<main id="app"><div class="empty">No data. Go to <a href="/" style="color:var(--gold-soft)">extractor</a> → confirm → forecast, then return here.</div></main>
<script type="module">
import { ddm } from "./valuation/engines.mjs";
import { normaliseHistoricals } from "./model/normalise.mjs";
import { seedAssumptions, buildModel } from "./model/engine.mjs";

let model=null;
const fc=sessionStorage.getItem("iv_forecast");
if(fc){try{model=JSON.parse(fc);}catch(e){}}
if(!model){const cf=sessionStorage.getItem("iv_confirmed");if(cf){const c=JSON.parse(cf);const h=normaliseHistoricals(c);model=buildModel(h,{...seedAssumptions(h)},3);}}
if(!model)  {} else {
const hist = model.historicalPeriods && model.historicalPeriods.length ? model.historicalPeriods : model.periods.filter(p=>!(model.forecastPeriods||[]).includes(p));
const last = hist[hist.length-1]||model.periods[0];
const y = model.years[last]||{};
const ni = y.net_income||0, div = Math.abs(y.dividends||0);
const payout = ni?div/ni:0.3;
const roe = (y.net_income && y.total_equity) ? y.net_income/y.total_equity : 0.15;
const MKT=JSON.parse(sessionStorage.getItem("iv_market")||"{}");
const shares = MKT.shares || 100;
// D0 must be PER SHARE: total dividends (₹ Cr) / shares. If shares unknown the
// user must set both — the ⓘ default of 100 is a placeholder, not a fact.
const state = { d0: ((div||ni*payout)/shares)||10, ke: 0.145, gh:0.10, gs:0.045, n:5, form:"gordon", payout, roe, payouts:hist.map(()=>payout), shares };

const el=document.getElementById("app");
el.innerHTML=`<h2>${esc(model.company_name||"Company")} <span class="meta">· Dividend Discount Model</span></h2>
<div class="learn"><b>What it is:</b> DDM values a stock as the present value of its future dividends — it only "sees" cash actually paid out. <b>Best for:</b> mature, steady dividend payers (and banks). <b>Avoid when:</b> the company barely pays dividends. <b>3 common mistakes:</b> using g ≥ Ke (breaks the math), ignoring the sustainable-growth cross-check (ROE×(1−payout)), and applying DDM to a non-payer.</div>
<div id="hero"></div>
<div class="grid">
<section class="ig-wrap"><h3>Inputs</h3>
<div class="ig"><div class="igh">Model form</div><div class="row"><label>Method</label><select id="form"><option value="gordon">Gordon (single-stage)</option><option value="two">Two-Stage</option><option value="h">H-Model</option></select></div></div>
<div class="ig"><div class="igh">Dividend &amp; rate</div>
<div class="row"><label>D0 (last dividend/share)</label><input id="d0" type="number" step="any" value="${numv(state.d0)}"></div>
<div class="row"><label>Ke (cost of equity)</label><input id="ke" type="number" step="any" value="${numv(state.ke*100)}"><span>%</span></div>
<div class="row"><label>High growth (gh)</label><input id="gh" type="number" step="any" value="${numv(state.gh*100)}"><span>%</span></div>
<div class="row"><label>Stable growth (gs)</label><input id="gs" type="number" step="any" value="${numv(state.gs*100)}"><span>%</span></div>
<div class="row"><label>High-growth years</label><input id="n" type="number" step="1" value="${state.n}"></div>
<div class="row"><label>Diluted shares</label><input id="shares" type="number" step="any" value="${state.shares}"></div>
</div>
<div class="ig"><div class="igh">Sustainable growth check</div>
<div class="row"><label>ROE (history)</label><input id="roe" type="number" step="any" value="${numv(state.roe*100)}"><span>%</span></div>
<div class="row"><label>Payout ratio</label><input id="payout" type="number" step="any" value="${numv(state.payout*100)}"><span>%</span></div>
</div>
<div id="warn"></div>
</section>
<section><h3>Value per share</h3><div id="tbl"></div>
<h3>Sensitivity — Ke × terminal growth</h3><div id="sens"></div>
<div class="chartbox"><canvas id="chart" height="130"></canvas></div>
</section></div>`;

function readInputs(){
  state.form=document.getElementById("form").value;
  state.d0=parseFloat(document.getElementById("d0").value)||0;
  state.ke=parseFloat(document.getElementById("ke").value)/100;
  state.gh=parseFloat(document.getElementById("gh").value)/100;
  state.gs=parseFloat(document.getElementById("gs").value)/100;
  state.n=parseInt(document.getElementById("n").value)||5;
  state.shares=parseFloat(document.getElementById("shares").value)||1;
  state.roe=parseFloat(document.getElementById("roe").value)/100;
  state.payout=parseFloat(document.getElementById("payout").value)/100;
  state.payouts=hist.map(()=>state.payout);
}
["form","d0","ke","gh","gs","n","shares","roe","payout"].forEach(id=>{
  document.getElementById(id).addEventListener("input",recompute);
  document.getElementById(id).addEventListener("change",recompute);
});

function recompute(){
  readInputs();
  const r = ddm(state);
  const perShare = r.value!=null ? r.value : null;
  sessionStorage.setItem("iv_market",JSON.stringify({...MKT,shares:state.shares}));
  if(perShare!=null){const V=JSON.parse(sessionStorage.getItem("iv_valuations")||"{}");V.ddm=perShare;sessionStorage.setItem("iv_valuations",JSON.stringify(V));}
  import("./lib/supa.mjs").then(m=>m.saveValuations()).catch(()=>{});
  document.getElementById("hero").innerHTML = `<div class="hero"><div class="hero-k">Intrinsic Value</div><div class="hero-v">₹${perShare==null?"—":round(perShare)} <span style="font-size:18px;color:var(--mut)">/ share</span></div><div class="meta">Ke ${pct(state.ke)} · stable g ${pct(state.gs)} · form: ${state.form}</div></div>`;
  document.getElementById("warn").innerHTML = r.checks.length ? `<div class="warnbox">${r.checks.map(c=>`⚠ ${esc(c.msg)}`).join("<br>")}</div>` : "";
  document.getElementById("tbl").innerHTML = `<table><tbody>
    <tr><td>D0</td><td>${round(state.d0)}</td></tr>
    <tr><td>Ke</td><td>${pct(state.ke)}</td></tr>
    <tr><td>Terminal growth</td><td>${pct(state.gs)}</td></tr>
    <tr><td><b>Value per share</b></td><td><b>${perShare==null?"-":round(perShare)}</b></td></tr>
  </tbody></table>`;
  const s=r.sens;
  let sh=`<table class="sens"><thead><tr><th>Ke \\ g</th>${s.cols.map(g=>`<th>${pct(g)}</th>`).join("")}</tr></thead><tbody>`;
  s.rows.forEach((ke,ri)=>{sh+=`<tr><th>${pct(ke)}</th>${s.cols.map((g,ci)=>{const v=s.grid[ri][ci];const b=ri===s.baseRow&&ci===s.baseCol?" base":"";return `<td class="${b}">${v==null?"-":round(v)}</td>`;}).join("")}</tr>`;});
  sh+=`</tbody></table>`;
  document.getElementById("sens").innerHTML=sh;
  drawChart(r);
}
function drawChart(r){
  const c=document.getElementById("chart"); if(!c||!window.Chart) return;
  if(c._chart) c._chart.destroy();
  c._chart=new window.Chart(c,{type:"bar",data:{labels:["Value/share"],datasets:[{label:"DDM value",data:[r.value||0],backgroundColor:"#c9982a"}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{ticks:{color:"#777062"}},x:{ticks:{color:"#777062"}}}}});
}
recompute();
}
function numv(x){return x==null||!isFinite(+x)?"":String(+(+x).toFixed(4));}
function round(x){return x==null?"-":Number(x).toLocaleString("en-IN",{maximumFractionDigits:2});}
function pct(x){return x==null?"-":(x*100).toFixed(1)+"%";}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script></body></html>
