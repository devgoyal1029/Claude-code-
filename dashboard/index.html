<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fund Analyzer — InvestVerdict</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF;
  --navy:#0B1F3A; --navy-mid:#122847; --navy-dark:#061029;
  --gold:#C9A961; --gold-bright:#E0C07A; --gold-deep:#8B6F2F; --gold-soft:rgba(201,169,97,0.12);
  --primary:#059669; --primary-deep:#047857; --primary-light:#D1FAE5; --primary-soft:#ECFDF5;
  --text:#0F172A; --muted:#64748B; --border:#E2E8F0; --border-soft:#F1F5F9;
  --amber:#F59E0B; --amber-bg:#FFFBEB; --red:#DC2626; --red-bg:#FEF2F2;
  --blue:#2563EB; --purple:#7C3AED;
  --r:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.05);
  --shadow:0 4px 16px rgba(15,23,42,.07);
  --shadow-lg:0 12px 40px rgba(15,23,42,.10);
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'DM Mono','SF Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
     font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{background:var(--navy-dark);color:#fff;position:sticky;top:0;z-index:50;
        box-shadow:0 1px 0 rgba(255,255,255,.07)}
.topbar .wrap{display:flex;align-items:center;gap:22px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;
       letter-spacing:-.01em;flex-shrink:0;cursor:pointer}
.brand i{width:20px;height:20px;border-radius:6px;display:inline-block;
         background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep))}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav a{padding:7px 13px;border-radius:99px;color:rgba(255,255,255,.62);font-weight:600;
      font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none}
nav a:hover{color:#fff;background:rgba(255,255,255,.07)}
nav a.on{color:var(--navy-dark);background:var(--gold-bright)}

/* ---------- search ---------- */
.hero{background:linear-gradient(135deg,var(--navy-dark),var(--navy-mid));color:#fff;
      padding:26px 0 66px}
.hero h1{font-size:24px;margin-bottom:5px}
.hero p{margin:0;color:rgba(255,255,255,.6);font-size:13.5px;max-width:640px}
.searchbox{position:relative;margin-top:20px;max-width:720px}
.searchrow{display:flex;gap:8px}
.sw{display:flex;background:rgba(255,255,255,.12);border-radius:var(--r-md);padding:3px;flex-shrink:0}
.sw button{border:0;background:transparent;color:rgba(255,255,255,.7);font-family:var(--font);
  font-weight:700;font-size:12px;padding:8px 13px;border-radius:var(--r);cursor:pointer}
.sw button.on{background:#fff;color:var(--navy-dark)}
.searchbox input{width:100%;padding:14px 16px;border-radius:var(--r-md);border:1px solid transparent;
  background:rgba(255,255,255,.97);font-family:var(--font);font-size:15px;color:var(--text);
  box-shadow:var(--shadow-lg);outline:none}
.searchbox input:focus{border-color:var(--gold)}
.results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);
  color:var(--text);border-radius:var(--r-md);box-shadow:var(--shadow-lg);max-height:430px;
  overflow-y:auto;z-index:40;display:none;border:1px solid var(--border)}
.results.on{display:block}
.res{padding:11px 15px;cursor:pointer;border-bottom:1px solid var(--border-soft);display:flex;
     gap:10px;align-items:flex-start}
.res:last-child{border-bottom:0}
.res:hover,.res.sel{background:var(--primary-soft)}
.res .nm{font-weight:600;font-size:13.5px;line-height:1.35;color:var(--text)}
.res .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.res .rt{margin-left:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pill{font-size:10px;font-weight:700;padding:2.5px 7px;border-radius:99px;letter-spacing:.02em;
      text-transform:uppercase;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--primary-light);color:var(--primary-deep)}
.pill.no{background:var(--border-soft);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold-deep)}
.pill.blue{background:#DBEAFE;color:#1D4ED8}

/* ---------- layout ---------- */
main{margin-top:-44px;padding-bottom:70px;min-height:60vh}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
      border:1px solid var(--border);padding:22px;margin-bottom:18px}
.card h2{font-size:15px;margin-bottom:3px}
.card h3{font-size:13.5px;margin-bottom:3px}
.hint{color:var(--muted);font-size:12px;margin-bottom:15px}
.row{display:grid;gap:18px}
@media(min-width:960px){.row.two{grid-template-columns:1fr 1fr}
  .row.side{grid-template-columns:320px 1fr}}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:11px}
.tile{background:var(--bg);border-radius:var(--r-md);padding:13px 14px;border:1px solid var(--border-soft)}
.tile .k{color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:19px;font-weight:700;margin-top:5px;font-family:var(--mono);letter-spacing:-.02em}
.tile .s{color:var(--muted);font-size:11px;margin-top:2px}
.up{color:var(--primary)} .down{color:var(--red)} .flat{color:var(--muted)}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 15px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);
     border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
.pane{display:none} .pane.on{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);
    cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);font-family:var(--font)}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- chart ---------- */
.chartwrap{position:relative}
svg.chart{width:100%;height:280px;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:7px 10px;
     border-radius:var(--r);font-size:11.5px;white-space:nowrap;opacity:0;transition:opacity .12s;
     z-index:10;box-shadow:var(--shadow)}
.tip .tv{font-family:var(--mono);font-weight:700}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px}
.bar .lbl{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lbl.clk{cursor:pointer;color:var(--blue)}
.bar .lbl.clk:hover{text-decoration:underline}
.bar .pc{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted)}
.bar .tr{grid-column:1/-1;height:7px;background:var(--border-soft);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
   font-weight:700;padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border-soft)}
tbody tr:hover{background:var(--bg)}
td.n,th.n{text-align:right}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lnk{cursor:pointer;color:var(--blue);font-weight:600}
.lnk:hover{text-decoration:underline}
.sub2{font-size:10.5px;color:var(--muted)}

/* ---------- misc ---------- */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.note{background:var(--amber-bg);border:1px solid #FDE68A;border-radius:var(--r-md);
      padding:11px 14px;font-size:12.5px;color:#92400E;margin-bottom:16px}
.note.err{background:var(--red-bg);border-color:#FECACA;color:#991B1B}
.spin{width:17px;height:17px;border:2px solid var(--border);border-top-color:var(--gold);
      border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:16px}
.filters label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.filters input,.filters select{width:100%;padding:9px 11px;border-radius:var(--r);
  border:1px solid var(--border);font-family:var(--font);font-size:13px;outline:none;
  background:var(--surface);color:var(--text)}
.filters input:focus,.filters select:focus{border-color:var(--gold)}
.btn{padding:10px 18px;border-radius:var(--r);border:0;background:var(--navy);color:#fff;
  font-family:var(--font);font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--navy-mid)}
.btn.ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--gold);color:var(--text)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb span{cursor:pointer;color:var(--blue)}
.crumb span:hover{text-decoration:underline}
</style>

<div class="topbar"><div class="wrap">
  <div class="brand" onclick="go('#/market')"><i></i> InvestVerdict</div>
  <nav id="nav">
    <a href="#/market">Market</a>

<main class="wrap"><div id="view"></div></main>

<script>
/* ==========================================================================
   CONFIG — anon key only. This file runs in the browser; everything in it
   is public. The RPCs are SECURITY DEFINER so this key can call functions
   but cannot read tables directly.
   ========================================================================== */
const SUPABASE_URL = "https://ulunrpbayvlazzxpqrpj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsdW5ycGJheXZsYXp6eHBxcnBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODM1MDcsImV4cCI6MjA5NTU1OTUwN30.y7BxUVuGqpaGumYm9bU5W7Yg-0XemuHC07CHcA_Mn6Q";

const MFAPI = "https://api.mfapi.in/mf/";
const RISK_FREE = 6.5;
const TRADING_DAYS = 252;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t);
  if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const fmt = (n, d = 2) => n == null || !isFinite(n) ? "—"
  : Number(n).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 2) => n == null || !isFinite(n) ? "—" : fmt(n, d) + "%";
const signOf = n => n == null || !isFinite(n) ? "flat" : n > 1e-4 ? "up" : n < -1e-4 ? "down" : "flat";
const signed = (n, d = 2) => n == null || !isFinite(n) ? "—" : (n > 0 ? "+" : "") + fmt(n, d) + "%";
const dstr = d => d instanceof Date && !isNaN(d)
  ? d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const dt = s => s ? new Date(s) : null;

/* ₹ in crore, abbreviated once it stops being readable */
function cr(n) {
  if (n == null || !isFinite(n)) return "—";
  n = Number(n);
  if (Math.abs(n) >= 1e5) return "₹" + fmt(n / 1e5, 2) + " L Cr";
  if (Math.abs(n) >= 1e3) return "₹" + fmt(n / 1e3, 2) + " K Cr";
  return "₹" + fmt(n, 0) + " Cr";
}

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
               "Content-Type": "application/json" },
    body: JSON.stringify(args || {})
  });
  if (!r.ok) throw new Error(`${fn}: ${r.status} ${(await r.text()).slice(0, 220)}`);
  return r.json();
}
const one = rows => (rows && rows.length) ? rows[0] : null;

function loading(msg) {
  return `<div class="card"><div class="empty"><span class="spin"></span>&nbsp; ${esc(msg)}</div></div>`;
}
function errCard(e) {
  return `<div class="card"><div class="note err">${esc(e.message || e)}</div></div>`;
}

/* ==========================================================================
   Charts
   ========================================================================== */
const NS = "http://www.w3.org/2000/svg";
const mk = (t, a) => { const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]); return n; };
const PALETTE = ["#0B1F3A","#059669","#C9A961","#2563EB","#7C3AED","#F59E0B",
                 "#DC2626","#0891B2","#DB2777","#65A30D","#475569","#B45309"];

function lineChart(host, series, yLabel) {
  host.innerHTML = "";
  if (!series || series.length < 2) { host.appendChild(el("div", "empty", "Not enough data to plot")); return; }

  const wrap = el("div", "chartwrap");
  const W = 1000, H = 280, P = { t: 14, r: 58, b: 26, l: 8 };
  const svg = mk("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });

  const xs = series.map(p => +p.t), ys = series.map(p => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.12 || y1 * 0.02 || 1;
  y0 -= pad; y1 += pad;
  const X = v => P.l + (v - x0) / (x1 - x0 || 1) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - y0) / (y1 - y0 || 1)) * (H - P.t - P.b);

  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = Y(v);
    svg.appendChild(mk("line", { x1: P.l, x2: W - P.r, y1: y, y2: y,
      stroke: "#E2E8F0", "stroke-width": 1, "stroke-dasharray": i ? "3 4" : "0" }));
    const tx = mk("text", { x: W - P.r + 8, y: y + 4, fill: "#64748B",
      "font-size": 11, "font-family": "DM Mono, monospace" });
    tx.textContent = v >= 1000 ? Math.round(v).toLocaleString("en-IN") : v.toFixed(1);
    svg.appendChild(tx);
  }

  const d = series.map((p, i) => `${i ? "L" : "M"}${X(+p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  const gain = series[series.length - 1].v >= series[0].v;
  const col = gain ? "#059669" : "#DC2626";
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  const grad = mk("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(mk("stop", { offset: "0%", "stop-color": col, "stop-opacity": .18 }));
  grad.appendChild(mk("stop", { offset: "100%", "stop-color": col, "stop-opacity": 0 }));
  const defs = mk("defs"); defs.appendChild(grad); svg.appendChild(defs);
  svg.appendChild(mk("path", { d: `${d}L${X(x1)},${Y(y0)}L${X(x0)},${Y(y0)}Z`, fill: `url(#${gid})` }));
  svg.appendChild(mk("path", { d, fill: "none", stroke: col, "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }));

  [0, .25, .5, .75, 1].forEach(f => {
    const t = new Date(x0 + (x1 - x0) * f);
    const tx = mk("text", { x: X(+t), y: H - 6, fill: "#94A3B8", "font-size": 11,
      "text-anchor": f === 0 ? "start" : f === 1 ? "end" : "middle" });
    tx.textContent = yLabel === "rank" ? "#" + Math.round(1 + (series.length - 1) * f)
      : t.toLocaleDateString("en-IN", { month: "short", year: "2-digit" });
    svg.appendChild(tx);
  });

  const dot = mk("circle", { r: 4, fill: col, stroke: "#fff", "stroke-width": 2, opacity: 0 });
  const vln = mk("line", { stroke: "#94A3B8", "stroke-width": 1, "stroke-dasharray": "3 3",
    y1: P.t, y2: H - P.b, opacity: 0 });
  svg.appendChild(vln); svg.appendChild(dot);
  wrap.appendChild(svg);
  const tip = el("div", "tip"); wrap.appendChild(tip);

  svg.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const vx = (ev.clientX - box.left) / box.width * W;
    const tv = x0 + (vx - P.l) / (W - P.l - P.r) * (x1 - x0);
    let lo = 0, hi = series.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (+series[m].t < tv) lo = m + 1; else hi = m; }
    const p = series[lo];
    const px = X(+p.t) / W * box.width, py = Y(p.v) / H * box.height;
    dot.setAttribute("cx", X(+p.t)); dot.setAttribute("cy", Y(p.v)); dot.setAttribute("opacity", 1);
    vln.setAttribute("x1", X(+p.t)); vln.setAttribute("x2", X(+p.t)); vln.setAttribute("opacity", 1);
    tip.innerHTML = (p.label ? esc(p.label) : dstr(p.t)) +
      `<br><span class="tv">${yLabel === "rank" ? fmt(p.v) + "%" : "₹" + fmt(p.v, 4)}</span>`;
    tip.style.opacity = 1;
    tip.style.left = Math.min(Math.max(px - 55, 0), box.width - 150) + "px";
    tip.style.top = Math.max(py - 52, 0) + "px";
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.opacity = 0; dot.setAttribute("opacity", 0); vln.setAttribute("opacity", 0);
  });
  host.appendChild(wrap);
}

function barList(host, rows, opt = {}) {
  const { max = 12, colorFn = null, onClick = null } = opt;
  host.innerHTML = "";
  if (!rows || !rows.length) { host.appendChild(el("div", "empty", "No data")); return; }
  const top = rows.slice(0, max), rest = rows.slice(max);
  if (rest.length) top.push({ label: `Other (${rest.length})`,
    pct: rest.reduce((a, b) => a + Number(b.pct || 0), 0), other: true });
  const peak = Math.max(...top.map(r => Math.abs(Number(r.pct) || 0)), 0.01);
  const box = el("div", "bars");
  top.forEach((r, i) => {
    const b = el("div", "bar");
    const lbl = el("div", "lbl" + (onClick && !r.other ? " clk" : ""), esc(r.label));
    if (onClick && !r.other) lbl.onclick = () => onClick(r);
    b.appendChild(lbl);
    b.appendChild(el("div", "pc", r.raw != null ? r.raw : pct(Number(r.pct))));
    const tr = el("div", "tr"), fl = el("div", "fl");
    fl.style.width = Math.abs(Number(r.pct) || 0) / peak * 100 + "%";
    fl.style.background = r.other ? "#CBD5E1" : colorFn ? colorFn(r) : PALETTE[i % PALETTE.length];
    tr.appendChild(fl); b.appendChild(tr); box.appendChild(b);
  });
  host.appendChild(box);
}

function donut(host, rows, centerLabel) {
  host.innerHTML = "";
  const data = (rows || []).filter(r => Number(r.pct) > 0);
  if (!data.length) { host.appendChild(el("div", "empty", "No data")); return; }
  const total = data.reduce((a, b) => a + Number(b.pct), 0);
  const S = 200, R = 74, C = 2 * Math.PI * R;
  const svg = mk("svg", { viewBox: `0 0 ${S} ${S}`, style: "width:180px;height:180px;flex:0 0 auto" });
  let off = 0;
  data.forEach((r, i) => {
    const frac = Number(r.pct) / total;
    svg.appendChild(mk("circle", { cx: S/2, cy: S/2, r: R, fill: "none",

/* build a table quickly: cols = [{h, k, n?, fn?, cls?}] */
function table(rows, cols, onRow) {
  const box = el("div", "tblwrap");

    `<th class="${c.n ? "n" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead>`;
  const tb = el("tbody");
  (rows || []).forEach((r, i) => {
    const tr = el("tr");

      const v = c.fn ? c.fn(r, i) : r[c.k];
      return `<td class="${c.n ? "n" : ""} ${c.cls || ""}">${v == null ? "—" : v}</td>`;

/* ==========================================================================
   NAV history + metrics (client-side; api.mfapi.in)
   ========================================================================== */
async function loadNav(code) {
  const r = await fetch(MFAPI + encodeURIComponent(code));
  if (!r.ok) throw new Error("mfapi " + r.status);
  const j = await r.json();
  if (!j || !Array.isArray(j.data)) throw new Error("mfapi: unexpected shape");
  const series = j.data.map(d => {
    const [dd, mm, yy] = String(d.date).split("-");
    return { t: new Date(+yy, +mm - 1, +dd), v: parseFloat(d.nav) };
  }).filter(p => !isNaN(p.t) && isFinite(p.v) && p.v > 0).sort((a, b) => a.t - b.t);
  return { meta: j.meta || {}, series };
}
const addM = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const addY = (d, n) => { const x = new Date(d); x.setFullYear(x.getFullYear() + n); return x; };

function navOn(series, target) {
  let lo = 0, hi = series.length - 1, out = null;
  while (lo <= hi) { const m = (lo + hi) >> 1;
    if (series[m].t <= target) { out = series[m]; lo = m + 1; } else hi = m - 1; }
  return out;
}

const PERIODS = [["1M", d => addM(d,-1)], ["3M", d => addM(d,-3)], ["6M", d => addM(d,-6)],
  ["YTD", d => new Date(d.getFullYear(),0,1)], ["1Y", d => addY(d,-1)], ["3Y", d => addY(d,-3)],
  ["5Y", d => addY(d,-5)], ["10Y", d => addY(d,-10)]];

/* Beyond a year, returns are annualised. Quoting an absolute 3-year figure
   beside a 1-year one flatters the longer period purely for elapsed time. */
function returns(series) {
  if (!series || !series.length) return [];
  const last = series[series.length - 1], first = series[0], out = [];
  for (const [name, back] of PERIODS) {
    const target = back(last.t);
    if (target < first.t) continue;
    const base = navOn(series, target);
    if (!base || !base.v) continue;
    const days = (last.t - base.t) / 864e5;
    out.push({ name, abs: (last.v / base.v - 1) * 100,
      ann: days > 400 ? (Math.pow(last.v / base.v, 365.25 / days) - 1) * 100 : null,
      from: base.t });
  }
  const days = (last.t - first.t) / 864e5;
  if (days > 30) out.push({ name: "Since inception", abs: (last.v / first.v - 1) * 100,
    ann: days > 400 ? (Math.pow(last.v / first.v, 365.25 / days) - 1) * 100 : null, from: first.t });
  return out;
}

/* NAV lands on business days only, so annualise over 252, not 365. */
function risk(series, years = 3) {
  if (!series || series.length < 30) return null;
  const end = series[series.length - 1].t;
  const s = series.filter(p => p.t >= addY(end, -years));
  if (s.length < 30) return null;
  const r = [];
  for (let i = 1; i < s.length; i++) if (s[i-1].v > 0) r.push(s[i].v / s[i-1].v - 1);
  if (r.length < 20) return null;
  const mean = r.reduce((a,b) => a+b, 0) / r.length;
  const vol = Math.sqrt(r.reduce((a,b) => a + (b-mean)**2, 0) / (r.length-1) * TRADING_DAYS) * 100;
  const down = r.filter(x => x < 0);
  const dvol = down.length
    ? Math.sqrt(down.reduce((a,b) => a + b*b, 0) / down.length * TRADING_DAYS) * 100 : 0;
  const days = (s[s.length-1].t - s[0].t) / 864e5;
  const cagr = (Math.pow(s[s.length-1].v / s[0].v, 365.25 / days) - 1) * 100;
  let peak = -Infinity, mdd = 0, mddAt = null;
  for (const p of s) { if (p.v > peak) peak = p.v;
    const dd = p.v / peak - 1; if (dd < mdd) { mdd = dd; mddAt = p.t; } }
  return { years, cagr, vol,
    sharpe: vol > 0 ? (cagr - RISK_FREE) / vol : null,
    sortino: dvol > 0 ? (cagr - RISK_FREE) / dvol : null,
    maxdd: mdd * 100, maxddAt: mddAt,
    best: Math.max(...r) * 100, worst: Math.min(...r) * 100,
    posDays: r.filter(x => x > 0).length / r.length * 100, obs: r.length };
}

/* ==========================================================================
   Search
   ========================================================================== */
let MODE = "fund", searchTimer = null, cursor = -1, hits = [];

function setMode(m) {
  MODE = m;
  $("#mFund").classList.toggle("on", m === "fund");
  $("#mStock").classList.toggle("on", m === "stock");
  $("#q").placeholder = m === "fund"
    ? "Search a fund — flexi cap, corporate bond, nifty 50"
    : "Search a stock — reliance, hdfc bank, or an ISIN";
  $("#q").value = ""; $("#res").classList.remove("on"); $("#q").focus();
}

$("#q").addEventListener("input", e => {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if (q.length < 2) { $("#res").classList.remove("on"); return; }
  searchTimer = setTimeout(() => runSearch(q), 220);
});
$("#q").addEventListener("keydown", e => {
  const box = $("#res");
  if (!box.classList.contains("on")) return;
  if (e.key === "ArrowDown") { e.preventDefault(); cursor = Math.min(cursor+1, hits.length-1); paintCursor(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); cursor = Math.max(cursor-1, 0); paintCursor(); }
  else if (e.key === "Enter" && cursor >= 0) { e.preventDefault(); choose(hits[cursor]); }
  else if (e.key === "Escape") box.classList.remove("on");
});
function paintCursor() {
  [...$("#res").children].forEach((n, i) => n.classList.toggle("sel", i === cursor));
  const n = $("#res").children[cursor]; if (n) n.scrollIntoView({ block: "nearest" });
}
document.addEventListener("click", e => {
  if (!e.target.closest(".searchbox")) $("#res").classList.remove("on");
});

async function runSearch(q) {
  const box = $("#res");
  box.innerHTML = `<div class="res"><span class="spin"></span>&nbsp; Searching…</div>`;
  box.classList.add("on");
  try {
    hits = MODE === "fund"
      ? await rpc("search_schemes", { q, lim: 25 })
      : await rpc("search_stocks", { q, lim: 25 });
    cursor = -1;
    if (!hits.length) {
      box.innerHTML = `<div class="res"><div><div class="nm">No match</div>
        <div class="sub">Try a shorter phrase</div></div></div>`;
      return;
    }
    box.innerHTML = "";
    hits.forEach((h, i) => {
      const r = el("div", "res");
      r.innerHTML = MODE === "fund"
        ? `<div style="flex:1;min-width:0">
             <div class="nm">${esc(h.scheme_name)}</div>
             <div class="sub">${esc(h.amc_name || "—")}${h.category ? " · " + esc(h.category) : ""}</div>
           </div>
           <div class="rt"><span class="pill ${h.has_holdings ? "ok" : "no"}">
             ${h.has_holdings ? "Portfolio" : "NAV only"}</span>
             <span class="sub mono">${esc(h.scheme_code)}</span></div>`
        : `<div style="flex:1;min-width:0">
             <div class="nm">${esc(h.instrument)}</div>
             <div class="sub">${esc(h.sector || "—")} · ${esc(h.isin)}</div>
           </div>
           <div class="rt"><span class="pill blue">${h.funds_holding} funds</span>
             <span class="sub mono">${cr(h.total_value_cr)}</span></div>`;
      r.onclick = () => choose(h);
      r.onmouseenter = () => { cursor = i; paintCursor(); };
      box.appendChild(r);
    });
  } catch (err) {
    box.innerHTML = `<div class="res"><div><div class="nm">Search failed</div>
      <div class="sub">${esc(err.message)}</div></div></div>`;
  }
}

function choose(h) {
  $("#res").classList.remove("on");
  if (MODE === "fund") { $("#q").value = h.scheme_name; go("#/fund/" + h.scheme_code); }
  else { $("#q").value = h.instrument; go("#/stock/" + h.isin); }
}

/* ==========================================================================
   Router
   ========================================================================== */
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
window.addEventListener("hashchange", route);

function setNav(name) {
  [...$("#nav").children].forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#/" + name));
}
function hero(title, sub) { $("#heroTitle").textContent = title; $("#heroSub").textContent = sub; }

async function route() {
  const p = (location.hash || "#/market").slice(2).split("/");
  const v = $("#view");
  try {
    if (p[0] === "fund" && p[1])        { setNav(""); await viewFund(v, p[1]); }
    else if (p[0] === "stock" && p[1])  { setNav(""); await viewStock(v, decodeURIComponent(p[1])); }
    else if (p[0] === "sector" && p[1]) { setNav("sectors"); await viewSector(v, decodeURIComponent(p[1])); }
    else if (p[0] === "sectors")        { setNav("sectors"); await viewSectors(v); }
    else if (p[0] === "amc" && p[1])     { setNav("amcs"); await viewAmc(v, decodeURIComponent(p[1])); }
    else if (p[0] === "screener")       { setNav("screener"); await viewScreener(v); }
    else if (p[0] === "amcs")           { setNav("amcs"); await viewAmcs(v); }
    else                                 { setNav("market"); await viewMarket(v); }
  } catch (e) { v.innerHTML = errCard(e); }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

  barList(bh, secs.slice(0, 15).map(h => ({ label: h.instrument, pct: h.pct_to_nav })),
    { max: 15, colorFn: () => "#0B1F3A", onClick: null });
  const plot = el("div"); plot.style.marginTop = "18px"; cc.appendChild(plot);
  let run = 0;
  const cum = secs.map((h, i) => { run += Number(h.pct_to_nav) || 0;
    return { t: new Date(2000, 0, 1 + i), v: run, label: `Top ${i + 1}: ${h.instrument}` }; });

    barList(dh, Object.entries(agg).map(([label, p]) => ({ label, pct: p }))

      const t = el("div", "tiles"); t.style.marginTop = "16px";
      t.innerHTML = `<div class="tile"><div class="k">Weighted yield</div><div class="v">${pct(wavg)}</div>
        <div class="s">across ${wy.length} rated papers</div></div>`;
      d.appendChild(t);
    }
    host.appendChild(d);
  }

  const uw = el("div"); uw.style.marginTop = "26px";
  uw.appendChild(el("h2", "", "Off-consensus positions"));
  uw.appendChild(el("div", "hint",
    "Names that at most one other loaded fund holds — either genuine conviction, " +
    "or a position nobody else wants."));
  const uh = el("div", "empty", '<span class="spin"></span>'); uw.appendChild(uh);
  host.appendChild(uw);
  try {
    const rows = await rpc("unique_holdings", { p_scheme_code: code, lim: 40 });
    uh.replaceWith(rows.length ? table(rows, [
      { h: "Instrument", fn: r => `<span class="lnk">${esc(r.instrument)}</span>
          <div class="sub2 mono">${esc(r.isin)}</div>` },
      { h: "Sector", fn: r => esc(r.sector || "—") },
      { h: "% to NAV", n: 1, fn: r => `<b>${pct(r.pct_to_nav)}</b>` },
      { h: "₹ Cr", n: 1, fn: r => fmt(r.value_cr, 1) },
      { h: "Held by", n: 1, fn: r => `${r.held_by} fund${r.held_by > 1 ? "s" : ""}` }
    ], r => go("#/stock/" + r.isin))
      : el("div", "empty", "Every holding is shared with other funds."));
  } catch (e) { uh.replaceWith(el("div", "note err", esc(e.message))); }

  host.appendChild(el("div", "note",
    "Portfolio turnover, YTM and Macaulay duration are published in the same AMC files " +
    "but are not captured in this database yet — only holdings are stored."));
}

/* AMC breakdown for one stock, with a scheme-level drill-down per row.
   Two sort orders because "biggest holder" and "highest conviction" are
   genuinely different answers. */
function buildAmcBreakdown(rows, isin) {
  const wrap = el("div");
  if (!rows || !rows.length) {
    wrap.appendChild(el("div", "empty", "No AMC holds this security."));
    return wrap;
  }

  const chips = el("div", "chips");
  const body = el("div");
  let order = "share";

  const draw = () => {
    const sorted = [...rows].sort((a, b) => order === "share"
      ? Number(b.total_value_cr) - Number(a.total_value_cr)
      : Number(b.pct_of_amc_book) - Number(a.pct_of_amc_book));

    body.innerHTML = "";
    const box = el("div", "tblwrap");
    const t = el("table");
    t.innerHTML = `<thead><tr>
      <th>AMC</th><th class="n">Schemes</th><th class="n">Value</th>
      <th class="n">Share</th><th class="n">Of AMC book</th><th>Largest scheme</th>
    </tr></thead>`;
    const tb = el("tbody");

    sorted.forEach(r => {
      const tr = el("tr");
      tr.innerHTML = `
        <td><span class="pill gold">${esc(r.amc)}</span></td>
        <td class="n">${fmt(r.schemes, 0)}</td>
        <td class="n">${cr(r.total_value_cr)}</td>
        <td class="n"><b>${pct(r.share_of_total_pct)}</b></td>
        <td class="n">${pct(r.pct_of_amc_book, 3)}</td>
        <td><span class="lnk">${esc((r.top_scheme || "—").slice(0, 42))}</span>
            <div class="sub2">${pct(r.top_scheme_pct)} of that scheme</div></td>`;
      tb.appendChild(tr);

      let open = null;
      tr.onclick = async () => {
        if (open) { open.remove(); open = null; return; }
        open = el("tr");
        open.innerHTML = `<td colspan="6"><span class="spin"></span></td>`;
        tr.after(open);
        try {
          const schemes = await rpc("stock_funds", { p_isin: isin, lim: 15, p_amc: r.amc });
          const cell = el("td"); cell.colSpan = 6;
          cell.style.cssText = "background:var(--bg);padding:14px 11px";
          cell.appendChild(el("div", "hint",
            `Top ${schemes.length} ${esc(r.amc)} scheme${schemes.length === 1 ? "" : "s"} holding this security`));
          const inner = el("table");
          inner.style.minWidth = "0";
          inner.innerHTML = `<thead><tr><th>Scheme</th><th class="n">% to NAV</th>
            <th class="n">₹ Cr</th><th class="n">Fund AUM</th></tr></thead>`;
          const itb = el("tbody");
          schemes.forEach(s => {
            const str = el("tr");
            str.innerHTML = `<td><span class="lnk">${esc(s.scheme_name)}</span>
                ${s.category ? `<div class="sub2">${esc(s.category)}</div>` : ""}</td>
              <td class="n"><b>${pct(s.pct_to_nav)}</b></td>
              <td class="n">${fmt(s.value_cr, 1)}</td>
              <td class="n">${cr(s.fund_aum_cr)}</td>`;
            str.onclick = ev => { ev.stopPropagation();
              if (s.scheme_code) go("#/fund/" + s.scheme_code); };
            itb.appendChild(str);
          });
          inner.appendChild(itb);
          cell.appendChild(inner);
          open.innerHTML = ""; open.appendChild(cell);
        } catch (e) {
          open.innerHTML = `<td colspan="6"><div class="note err">${esc(e.message)}</div></td>`;
        }
      };
    });

    t.appendChild(tb); box.appendChild(t); body.appendChild(box);

    const bh = el("div"); bh.style.marginTop = "20px"; body.appendChild(bh);
    barList(bh, sorted.map(r => ({
      label: r.amc,
      pct: order === "share" ? Number(r.total_value_cr) : Number(r.pct_of_amc_book),
      raw: order === "share" ? cr(r.total_value_cr) : pct(r.pct_of_amc_book, 3)
    })), { max: 20 });
  };

  [["share", "By money"], ["book", "By conviction"]].forEach(([o, label], i) => {
    const b = el("button", "chip" + (i === 0 ? " on" : ""), label);
    b.onclick = () => { order = o;
      [...chips.children].forEach(n => n.classList.remove("on"));
      b.classList.add("on"); draw(); };
    chips.appendChild(b);
  });

  wrap.append(chips, body);
  draw();
  return wrap;
}

  v.innerHTML = "";
  const c = el("div", "card");
  c.appendChild(el("h2", "", `${rows.length} sectors`));
  c.appendChild(el("div", "hint",
    "Sector labels come from the AMCs themselves and are not perfectly standardised — " +
    "one house writes “IT - Software”, another “Software”. Debt schemes report credit " +
    "ratings in the same field, so ratings appear here too."));
  c.appendChild(table(rows, [
    { h: "Sector", fn: r => `<span class="lnk">${esc(r.sector)}</span>` },
    { h: "Stocks", n: 1, fn: r => fmt(r.stocks, 0) },
    { h: "Funds holding", n: 1, fn: r => fmt(r.funds_holding, 0) },
    { h: "Total value", n: 1, fn: r => cr(r.total_value_cr) }
  ], r => go("#/sector/" + encodeURIComponent(r.sector))));
  v.appendChild(c);
}

async function viewSector(v, sector) {
  hero(sector, "Stocks in this sector, and the funds most exposed to it.");
  v.innerHTML = loading("Loading sector…");
  const [st, fn] = await Promise.all([
    rpc("sector_stocks", { p_sector: sector, lim: 60 }),
    rpc("sector_funds",  { p_sector: sector, lim: 60 })
  ]);
  v.innerHTML = "";

  const c0 = el("div", "card");
  c0.innerHTML = `<div class="crumb"><span onclick="go('#/sectors')">Sectors</span> › ${esc(sector)}</div>`;
  c0.appendChild(el("h2", "", sector));
  c0.appendChild(el("div", "hint",
    `${st.length} securities · ${fn.length} funds hold something in this sector`));
  v.appendChild(c0);

  const c1 = el("div", "card");
  c1.appendChild(el("h2", "", "Stocks"));
  c1.appendChild(el("div", "hint", "Ranked by total disclosed value across all funds"));
  c1.appendChild(table(st, [
    { h: "#", n: 1, fn: (r, i) => `<span style="color:var(--muted)">${i + 1}</span>` },
    { h: "Stock", fn: r => `<span class="lnk">${esc(r.instrument)}</span>
        <div class="sub2 mono">${esc(r.isin)}</div>` },
    { h: "Funds", n: 1, fn: r => fmt(r.funds_holding, 0) },
    { h: "Total value", n: 1, fn: r => cr(r.total_value_cr) },
    { h: "Avg wt", n: 1, fn: r => pct(r.avg_weight, 3) }
  ], r => go("#/stock/" + r.isin)));
  v.appendChild(c1);

  const c2 = el("div", "card");
  c2.appendChild(el("h2", "", "Funds most exposed"));
  c2.appendChild(el("div", "hint", "By share of the fund's own net assets, not by size"));
  c2.appendChild(table(fn, [
    { h: "Fund", fn: r => `<span class="lnk">${esc(r.scheme_name)}</span>
        <div class="sub2">${esc(r.amc)}${r.category ? " · " + esc(r.category) : ""}</div>` },
    { h: "Sector wt", n: 1, fn: r => `<b>${pct(r.sector_pct)}</b>` },
    { h: "Stocks", n: 1, fn: r => fmt(r.stocks, 0) },
    { h: "Value", n: 1, fn: r => cr(r.value_cr) },
    { h: "Fund AUM", n: 1, fn: r => cr(r.fund_aum_cr) }
  ], r => { if (r.scheme_code) go("#/fund/" + r.scheme_code); }));
  v.appendChild(c2);
}

/* ==========================================================================
   VIEW · Screener
   ========================================================================== */
async function viewScreener(v) {
  hero("Screener", "Filter every disclosed portfolio by size, concentration and exposure.");
  v.innerHTML = loading("Loading filters…");
  const [cats, secs] = await Promise.all([rpc("list_categories"), rpc("list_sectors")]);
  v.innerHTML = "";

  const c = el("div", "card");
  c.appendChild(el("h2", "", "Filters"));
  c.appendChild(el("div", "hint",
    "Leave anything blank to ignore it. Setting a sector also enables the sector-weight " +
    "filter and the “sector weight” sort."));

  const f = el("div", "filters");
  f.innerHTML = `
    <div><label>Category</label><select id="fCat"><option value="">Any</option>
      ${cats.map(x => `<option value="${esc(x.category)}">${esc(x.category)} (${x.funds})</option>`).join("")}
    </select></div>
    <div><label>Sector</label><select id="fSec"><option value="">Any</option>
      ${secs.slice(0, 120).map(x => `<option value="${esc(x.sector)}">${esc(x.sector)}</option>`).join("")}
    </select></div>
    <div><label>Min sector wt %</label><input id="fSecPct" type="number" step="1" placeholder="e.g. 25"></div>
    <div><label>Min AUM (Cr)</label><input id="fMinAum" type="number" step="100" placeholder="e.g. 1000"></div>
    <div><label>Max AUM (Cr)</label><input id="fMaxAum" type="number" step="100"></div>
    <div><label>Min holdings</label><input id="fMinH" type="number" step="1"></div>
    <div><label>Max holdings</label><input id="fMaxH" type="number" step="1" placeholder="e.g. 40"></div>
    <div><label>Min top-10 %</label><input id="fMinT" type="number" step="1"></div>
    <div><label>Max top-10 %</label><input id="fMaxT" type="number" step="1"></div>
    <div><label>Holds ISIN</label><input id="fIsin" placeholder="INE002A01018"></div>
    <div><label>Sort by</label><select id="fOrd">
      <option value="aum">AUM</option><option value="holdings">Holdings</option>
      <option value="top10">Top-10 concentration</option><option value="hhi">HHI</option>
      <option value="cash">Cash</option><option value="match">Sector / stock weight</option>
    </select></div>`;
  c.appendChild(f);
  const btns = el("div"); btns.style.cssText = "display:flex;gap:9px";
  const run = el("button", "btn", "Run screen");
  const clear = el("button", "btn ghost", "Clear");
  btns.append(run, clear); c.appendChild(btns);
  v.appendChild(c);

  const out = el("div"); v.appendChild(out);
  const num = id => { const x = $("#" + id).value.trim(); return x === "" ? null : Number(x); };
  const str = id => { const x = $("#" + id).value.trim(); return x === "" ? null : x; };

  const doRun = async () => {
    out.innerHTML = loading("Screening…");
    try {
      const rows = await rpc("fund_screener", {
        p_category: str("fCat"), p_sector: str("fSec"),
        p_min_sector_pct: num("fSecPct"),
        p_min_aum: num("fMinAum"), p_max_aum: num("fMaxAum"),
        p_min_holdings: num("fMinH"), p_max_holdings: num("fMaxH"),
        p_min_top10: num("fMinT"), p_max_top10: num("fMaxT"),
        p_holds_isin: str("fIsin"), p_order: $("#fOrd").value, lim: 200
      });
      out.innerHTML = "";
      const rc = el("div", "card");
      rc.appendChild(el("h2", "", `${rows.length} fund${rows.length === 1 ? "" : "s"}`));
      rc.appendChild(el("div", "hint", rows.length === 200
        ? "Capped at 200 — tighten the filters to see the full set." : "Click a row to open the fund."));
      const cols = [
        { h: "Fund", fn: r => `<span class="lnk">${esc(r.scheme_name)}</span>
            <div class="sub2">${esc(r.amc)}${r.category ? " · " + esc(r.category) : ""}</div>` },
        { h: "AUM", n: 1, fn: r => cr(r.aum_cr) },
        { h: "Holdings", n: 1, fn: r => fmt(r.securities, 0) },
        { h: "Top 10", n: 1, fn: r => pct(r.top_10_pct) },
        { h: "Eff. stocks", n: 1, fn: r => fmt(r.effective_stocks, 1) },
        { h: "Cash", n: 1, fn: r => pct(r.cash_pct) },
        { h: "Top sector", fn: r => r.top_sector
            ? `${esc(r.top_sector)} <span class="sub2">${pct(r.top_sector_pct)}</span>` : "—" }
      ];
      if (rows.some(r => r.match_pct != null))
        cols.splice(1, 0, { h: "Match wt", n: 1, fn: r => `<b>${pct(r.match_pct)}</b>` });
      rc.appendChild(table(rows, cols, r => { if (r.scheme_code) go("#/fund/" + r.scheme_code); }));
      out.appendChild(rc);
    } catch (e) { out.innerHTML = errCard(e); }
  };
  run.onclick = doRun;
  clear.onclick = () => { f.querySelectorAll("input").forEach(i => i.value = "");
    f.querySelectorAll("select").forEach(s => s.selectedIndex = 0); out.innerHTML = ""; };
  doRun();
}

/* ==========================================================================
   VIEW · AMCs
   ========================================================================== */
async function viewAmcs(v) {
  hero("Fund houses", "Every AMC loaded, by disclosed assets.");
  v.innerHTML = loading("Loading AMCs…");
  const rows = await rpc("amc_summary");
  v.innerHTML = "";
  const c = el("div", "card");
  c.appendChild(el("h2", "", `${rows.length} AMCs`));
  c.appendChild(el("div", "hint",
    "AUM here is the sum of disclosed holding values, not an official AUM figure — " +
    "close enough for ranking, not for reporting. Dates differ by house. " +
    "Click a house to see everything it holds."));
  c.appendChild(table(rows, [
    { h: "AMC", fn: r => `<span class="pill gold">${esc(r.amc)}</span>` },
    { h: "Funds", n: 1, fn: r => fmt(r.funds, 0) },
    { h: "Total", n: 1, fn: r => cr(r.total_aum_cr) },
    { h: "Equity", n: 1, fn: r => cr(r.equity_aum_cr) },
    { h: "Debt", n: 1, fn: r => cr(r.debt_aum_cr) },
    { h: "Avg holdings", n: 1, fn: r => fmt(r.avg_holdings, 1) },
    { h: "Med top-10", n: 1, fn: r => pct(r.med_top_10) },
    { h: "As on", fn: r => `<span class="sub2 mono">${dstr(dt(r.latest_date))}</span>` }
  ], r => go("#/amc/" + encodeURIComponent(r.amc))));
  v.appendChild(c);

  const b = el("div", "card");
  b.appendChild(el("h2", "", "By disclosed assets"));
  const bh = el("div"); b.appendChild(bh);
  barList(bh, rows.map(r => ({ label: r.amc, pct: r.total_aum_cr, raw: cr(r.total_aum_cr) })),
    { max: 20, onClick: r => go("#/amc/" + encodeURIComponent(r.label)) });
  v.appendChild(b);
}

if (SUPABASE_ANON_KEY.startsWith("PASTE_")) {
