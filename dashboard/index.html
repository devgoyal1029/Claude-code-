<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fund Analyzer — InvestVerdict</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- three.js for the real 3D showcase elements (loaded only on the home page). -->
<script type="importmap">{"imports":{"three":"https://esm.sh/three@0.160.1","three/addons/":"https://esm.sh/three@0.160.1/examples/jsm/"}}</script>

<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF;
  --navy:#0B1F3A; --navy-mid:#122847; --navy-dark:#061029;
  --gold:#C9A961; --gold-bright:#E0C07A; --gold-deep:#8B6F2F; --gold-soft:rgba(201,169,97,0.12);
  --primary:#059669; --primary-deep:#047857; --primary-light:#D1FAE5; --primary-soft:#ECFDF5;
  --text:#0F172A; --muted:#64748B; --border:#E2E8F0; --border-soft:#F1F5F9;
  --amber:#F59E0B; --amber-bg:#FFFBEB; --red:#DC2626; --red-bg:#FEF2F2;
  --blue:#2563EB; --purple:#7C3AED;
  --r:8px; --r-md:12px; --r-lg:16px; --r-xl:20px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.05);
  --shadow:0 4px 16px rgba(15,23,42,.07);
  --shadow-lg:0 12px 40px rgba(15,23,42,.10);
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'DM Mono','SF Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
     font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.topbar{background:var(--navy-dark);color:#fff;position:sticky;top:0;z-index:50;
        box-shadow:0 1px 0 rgba(255,255,255,.07)}
.topbar .wrap{display:flex;align-items:center;gap:22px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14.5px;
       letter-spacing:-.01em;flex-shrink:0;cursor:pointer}
.brand i{width:20px;height:20px;border-radius:6px;display:inline-block;
         background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep))}
nav{display:flex;gap:2px;overflow-x:auto;flex:1}
nav a{padding:7px 13px;border-radius:99px;color:rgba(255,255,255,.62);font-weight:600;
      font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none}
nav a:hover{color:#fff;background:rgba(255,255,255,.07)}
nav a.on{color:var(--navy-dark);background:var(--gold-bright)}

/* ---------- search ---------- */
.hero{background:linear-gradient(135deg,var(--navy-dark),var(--navy-mid));color:#fff;
      padding:26px 0 66px}
.hero h1{font-size:24px;margin-bottom:5px}
.hero p{margin:0;color:rgba(255,255,255,.6);font-size:13.5px;max-width:640px}
.searchbox{position:relative;margin-top:20px;max-width:720px}
.searchrow{display:flex;gap:8px}
.sw{display:flex;background:rgba(255,255,255,.12);border-radius:var(--r-md);padding:3px;flex-shrink:0}
.sw button{border:0;background:transparent;color:rgba(255,255,255,.7);font-family:var(--font);
  font-weight:700;font-size:12px;padding:8px 13px;border-radius:var(--r);cursor:pointer}
.sw button.on{background:#fff;color:var(--navy-dark)}
.searchbox input{width:100%;padding:14px 16px;border-radius:var(--r-md);border:1px solid transparent;
  background:rgba(255,255,255,.97);font-family:var(--font);font-size:15px;color:var(--text);
  box-shadow:var(--shadow-lg);outline:none}
.searchbox input:focus{border-color:var(--gold)}
.results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);
  color:var(--text);border-radius:var(--r-md);box-shadow:var(--shadow-lg);max-height:430px;
  overflow-y:auto;z-index:40;display:none;border:1px solid var(--border)}
.results.on{display:block}
.res{padding:11px 15px;cursor:pointer;border-bottom:1px solid var(--border-soft);display:flex;
     gap:10px;align-items:flex-start}
.res:last-child{border-bottom:0}
.res:hover,.res.sel{background:var(--primary-soft)}
.res .nm{font-weight:600;font-size:13.5px;line-height:1.35;color:var(--text)}
.res .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.res .rt{margin-left:auto;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pill{font-size:10px;font-weight:700;padding:2.5px 7px;border-radius:99px;letter-spacing:.02em;
      text-transform:uppercase;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--primary-light);color:var(--primary-deep)}
.pill.no{background:var(--border-soft);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold-deep)}
.pill.blue{background:#DBEAFE;color:#1D4ED8}

/* ---------- layout ---------- */
main{margin-top:-44px;padding-bottom:70px;min-height:60vh}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);
      border:1px solid var(--border);padding:22px;margin-bottom:18px}
.card h2{font-size:15px;margin-bottom:3px}
.card h3{font-size:13.5px;margin-bottom:3px}
.hint{color:var(--muted);font-size:12px;margin-bottom:15px}
.row{display:grid;gap:18px}
@media(min-width:960px){.row.two{grid-template-columns:1fr 1fr}
  .row.side{grid-template-columns:320px 1fr}}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:11px}
.tile{background:var(--bg);border-radius:var(--r-md);padding:13px 14px;border:1px solid var(--border-soft)}
.tile .k{color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:19px;font-weight:700;margin-top:5px;font-family:var(--mono);letter-spacing:-.02em}
.tile .s{color:var(--muted);font-size:11px;margin-top:2px}
.up{color:var(--primary)} .down{color:var(--red)} .flat{color:var(--muted)}

/* ---------- tabs / chips ---------- */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tab{padding:10px 15px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);
     border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
.pane{display:none} .pane.on{display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);
    cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);font-family:var(--font)}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- chart ---------- */
.chartwrap{position:relative}
svg.chart{width:100%;height:280px;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;padding:7px 10px;
     border-radius:var(--r);font-size:11.5px;white-space:nowrap;opacity:0;transition:opacity .12s;
     z-index:10;box-shadow:var(--shadow)}
.tip .tv{font-family:var(--mono);font-weight:700}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px}
.bar .lbl{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .lbl.clk{cursor:pointer;color:var(--blue)}
.bar .lbl.clk:hover{text-decoration:underline}
.bar .pc{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--muted)}
.bar .tr{grid-column:1/-1;height:7px;background:var(--border-soft);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
   font-weight:700;padding:9px 11px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border-soft)}
tbody tr:hover{background:var(--bg)}
td.n,th.n{text-align:right}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lnk{cursor:pointer;color:var(--blue);font-weight:600}
.lnk:hover{text-decoration:underline}
.sub2{font-size:10.5px;color:var(--muted)}

/* ---------- misc ---------- */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
.note{background:var(--amber-bg);border:1px solid #FDE68A;border-radius:var(--r-md);
      padding:11px 14px;font-size:12.5px;color:#92400E;margin-bottom:16px}
.note.err{background:var(--red-bg);border-color:#FECACA;color:#991B1B}
/* toast — sits above everything, ignores clicks, slides up from the bottom */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:900;
  max-width:min(460px,calc(100vw - 32px));padding:12px 17px;border-radius:var(--r-md);
  background:var(--text);color:#fff;font-size:13px;line-height:1.45;text-align:center;
  box-shadow:0 8px 28px rgba(0,0,0,.22);opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:#991B1B}
.spin{width:17px;height:17px;border:2px solid var(--border);border-top-color:var(--gold);
      border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:16px}
.filters label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.filters input,.filters select{width:100%;padding:9px 11px;border-radius:var(--r);
  border:1px solid var(--border);font-family:var(--font);font-size:13px;outline:none;
  background:var(--surface);color:var(--text)}
.filters input:focus,.filters select:focus{border-color:var(--gold)}
.btn{padding:10px 18px;border-radius:var(--r);border:0;background:var(--navy);color:#fff;
  font-family:var(--font);font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--navy-mid)}
.btn.ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--gold);color:var(--text)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb span{cursor:pointer;color:var(--blue)}
.crumb span:hover{text-decoration:underline}

/* ---------- compare download bar ---------- */
.cmp-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cmp-actions .btn{font-size:13px}

/* ---------- comparison vs peers ---------- */
.cmp-tbl td.d{font-family:var(--mono);font-weight:700}
.insight{background:linear-gradient(135deg,rgba(11,31,58,.04),rgba(201,169,97,.07));
  border:1px solid var(--border);border-left:3px solid var(--gold);
  border-radius:var(--r-md);padding:13px 16px;font-size:13px;margin:16px 0;line-height:1.6}
.insight b{color:var(--navy)}
.split{display:flex;height:26px;border-radius:var(--r);overflow:hidden;margin:6px 0 10px}
.split div{display:flex;align-items:center;justify-content:center;font-size:10.5px;
  font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}

/* ---------- landing: hero band + metric showcase (light) ---------- */
.showcase{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-bottom:16px}
@media(max-width:820px){.showcase{grid-template-columns:1fr}}
.hero-card{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:26px 28px;
  background:linear-gradient(140deg,var(--navy-dark) 0%,var(--navy-mid) 55%,#183156 100%);
  color:#fff;box-shadow:var(--shadow-lg)}
.hero-card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(680px 300px at 88% -20%,rgba(201,169,97,.20),transparent 60%),
             radial-gradient(520px 280px at -8% 120%,rgba(5,150,105,.16),transparent 60%)}
.hero-card>*{position:relative;z-index:1}
.hero-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold-bright);display:flex;align-items:center;gap:8px}
.hero-eyebrow .dot{width:7px;height:7px;border-radius:50%;background:#34D39F;
  box-shadow:0 0 0 0 rgba(52,211,159,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,159,.5)}70%{box-shadow:0 0 0 9px rgba(52,211,159,0)}100%{box-shadow:0 0 0 0 rgba(52,211,159,0)}}
.hero-big{font-family:var(--font);font-weight:800;letter-spacing:-.03em;line-height:1;
  font-size:clamp(38px,6vw,60px);margin:14px 0 2px;
  background:linear-gradient(120deg,#fff 30%,var(--gold-bright));-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{color:rgba(255,255,255,.62);font-size:13.5px;max-width:44ch}
.hero-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.hero-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  border-radius:var(--r-md);padding:11px 15px;min-width:104px}
.hero-chip .n{font-family:var(--mono);font-weight:600;font-size:21px;letter-spacing:-.02em}
.hero-chip .l{font-size:10.5px;color:rgba(255,255,255,.55);text-transform:uppercase;
  letter-spacing:.06em;margin-top:3px}
.gauge-card{border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center}
.gauge-card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;margin-bottom:4px}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:16px;margin-bottom:16px}
.mcard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:20px 20px 18px;box-shadow:var(--shadow-sm);
  transition:transform .18s,box-shadow .18s,border-color .18s}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
.mcard .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold-deep);display:flex;align-items:center;gap:7px}
.mcard .lead{font-weight:800;font-size:19px;letter-spacing:-.02em;margin:9px 0 2px;line-height:1.15}
.mcard .leadsub{font-size:12px;color:var(--muted)}
.mcard.clk{cursor:pointer}
/* coin-stack style ranked bars inside a metric card */
.stack{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.stack .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.stack .nm{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack .tk{height:8px;border-radius:99px;background:var(--border-soft);overflow:hidden;grid-column:1/-1;margin-top:-2px}
.stack .fl{height:100%;border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1)}
.stack .vv{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}

/* features grid -- "what you can do here" */
.feats-head{margin:26px 0 14px}
.feats-head h2{font-size:20px}
.feats-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(276px,1fr));gap:16px;margin-bottom:16px}
.feat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:20px;cursor:pointer;box-shadow:var(--shadow-sm);
  transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column;gap:10px}
.feat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--gold)}
.feat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,var(--gold-soft),transparent 70%);opacity:0;transition:opacity .2s}
.feat:hover::after{opacity:1}
.feat .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,var(--navy),var(--navy-mid));color:var(--gold-bright);flex:0 0 auto}
.feat .ft{font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--text)}
.feat .fd{font-size:12.8px;color:var(--muted);line-height:1.5;flex:1}
.feat .fs{display:inline-flex;align-items:baseline;gap:6px;font-size:12px;color:var(--gold-deep);
  font-weight:700;margin-top:2px}
.feat .fs b{font-family:var(--mono);font-size:15px;color:var(--navy)}
.feat .go{font-size:12px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:5px}
.feat .go svg{transition:transform .18s}
.feat:hover .go svg{transform:translateX(3px)}

/* interesting facts strip */
.facts{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:16px;
  scrollbar-width:none}
.facts::-webkit-scrollbar{display:none}
.fact{flex:0 0 auto;min-width:230px;max-width:300px;background:linear-gradient(135deg,#fff,var(--gold-soft));
  border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:var(--r-md);
  padding:13px 15px}
.fact .big{font-family:var(--mono);font-weight:600;font-size:22px;color:var(--navy);letter-spacing:-.02em}
.fact .txt{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.fadein{animation:rise .6s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- 3D showcase block (light card, dark 3D stages) ----------
   The block itself is light and colourful to match the page; only the little
   stages the 3D metal sits on stay dark, because a gold coin needs a dark
   pedestal to read as gold -- the same reason product shots use a dark box. */
.dc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);
  padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.dc-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin-bottom:16px;flex-wrap:wrap}
.dc-head .t{font-family:'Sora',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;color:var(--navy)}
.dc-head .e{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--gold-deep);display:flex;align-items:center;gap:8px}
.dc-head .e .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);
  box-shadow:0 0 0 0 rgba(5,150,105,.5);animation:pulse 2.4s infinite}
.dc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.dc-grid{grid-template-columns:1fr}}
.dc-card{background:var(--surface);border:1px solid var(--border);
  border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.dc-card .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dc-card .num{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--muted)}
.dc-card h4{margin:2px 0 0;font-family:'Sora',sans-serif;font-weight:600;font-size:17px;
  letter-spacing:-.01em;color:var(--text)}
.dc-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--primary-deep);
  border:1px solid var(--primary-light);background:var(--primary-soft);padding:4px 9px;border-radius:999px;white-space:nowrap}
.dc-badge.gold{color:var(--gold-deep);border-color:rgba(201,169,97,.4);background:var(--gold-soft)}
/* light pedestal -- the 3D canvas is transparent, so this shows through */
.dc-stage{position:relative;height:230px;border-radius:14px;overflow:hidden;cursor:grab;
  background:radial-gradient(70% 70% at 50% 30%,#FFFFFF 0%,#EEF2F7 100%);border:1px solid var(--border)}
.dc-cap{margin:0;font-size:12.5px;line-height:1.5;color:var(--muted)}
/* AUM counters strip -- light + colourful */
.dc-counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;
  margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

<script>
/* ==========================================================================
   CONFIG — anon key only. This file runs in the browser; everything in it

const SUPABASE_URL = "https://ulunrpbayvlazzxpqrpj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsdW5ycGJheXZsYXp6eHBxcnBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5ODM1MDcsImV4cCI6MjA5NTU1OTUwN30.y7BxUVuGqpaGumYm9bU5W7Yg-0XemuHC07CHcA_Mn6Q";

const MFAPI = "https://api.mfapi.in/mf/";
const RISK_FREE = 6.5;          // % p.a., for Sharpe / Sortino
const TRADING_DAYS = 252;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t);
  if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const fmt = (n, d = 2) => n == null || !isFinite(n) ? "—"
  : Number(n).toLocaleString("en-IN", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 2) => n == null || !isFinite(n) ? "—" : fmt(n, d) + "%";
const signOf = n => n == null || !isFinite(n) ? "flat" : n > 1e-4 ? "up" : n < -1e-4 ? "down" : "flat";
const signed = (n, d = 2) => n == null || !isFinite(n) ? "—" : (n > 0 ? "+" : "") + fmt(n, d) + "%";
const dstr = d => d instanceof Date && !isNaN(d)
  ? d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) : "—";
const dt = s => s ? new Date(s) : null;
const short = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

/* ₹ in crore, abbreviated once it stops being readable */
function cr(n) {
  if (n == null || !isFinite(n)) return "—";
  n = Number(n);
  if (Math.abs(n) >= 1e5) return "₹" + fmt(n / 1e5, 2) + " L Cr";
  if (Math.abs(n) >= 1e3) return "₹" + fmt(n / 1e3, 2) + " K Cr";
  return "₹" + fmt(n, 0) + " Cr";
}

async function rpc(fn, args) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
               "Content-Type": "application/json" },
    body: JSON.stringify(args || {})
  });
  if (!r.ok) throw new Error(`${fn}: ${r.status} ${(await r.text()).slice(0, 220)}`);
  return r.json();
}
const one = rows => (rows && rows.length) ? rows[0] : null;
/* optional data (market cap, NAV history, change tracking) may not be loaded
   yet — these sections stay hidden rather than showing an error */
const soft = p => p.then(r => r).catch(() => null);

const loading = m => `<div class="card"><div class="empty"><span class="spin"></span>&nbsp; ${esc(m)}</div></div>`;
const errCard = e => `<div class="card"><div class="note err">${esc(e.message || e)}</div></div>`;

/* toast — for refusals that need a full sentence, where a button label has no
   room for one ("+ Compare" on a fund page rejecting an AMC mix). */
let TOAST_T = null;
function toast(msg, kind) {
  let t = document.getElementById("toast");
  if (!t) { t = el("div"); t.id = "toast"; document.body.appendChild(t); }
  t.className = "toast" + (kind === "err" ? " err" : "");
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add("on"));
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => t.classList.remove("on"), 4200);
}

/* ==========================================================================
   Charts — inline SVG, no libraries
   ========================================================================== */
const NS = "http://www.w3.org/2000/svg";
const mk = (t, a) => { const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]); return n; };
const PALETTE = ["#0B1F3A","#059669","#C9A961","#2563EB","#7C3AED","#F59E0B",
                 "#DC2626","#0891B2","#DB2777","#65A30D","#475569","#B45309"];

function lineChart(host, series, mode) {
  host.innerHTML = "";
  if (!series || series.length < 2) { host.appendChild(el("div", "empty", "Not enough data to plot")); return; }
  const wrap = el("div", "chartwrap");
  const W = 1000, H = 280, P = { t: 14, r: 58, b: 26, l: 8 };
  const svg = mk("svg", { class: "chart", viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });

  const xs = series.map(p => +p.t), ys = series.map(p => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = (y1 - y0) * 0.12 || y1 * 0.02 || 1;
  y0 -= pad; y1 += pad;
  const X = v => P.l + (v - x0) / (x1 - x0 || 1) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - y0) / (y1 - y0 || 1)) * (H - P.t - P.b);

  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4, y = Y(v);
    svg.appendChild(mk("line", { x1: P.l, x2: W - P.r, y1: y, y2: y,
      stroke: "#E2E8F0", "stroke-width": 1, "stroke-dasharray": i ? "3 4" : "0" }));
    const tx = mk("text", { x: W - P.r + 8, y: y + 4, fill: "#64748B",
      "font-size": 11, "font-family": "DM Mono, monospace" });
    tx.textContent = v >= 1000 ? Math.round(v).toLocaleString("en-IN") : v.toFixed(1);
    svg.appendChild(tx);
  }

  const d = series.map((p, i) => `${i ? "L" : "M"}${X(+p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  const col = series[series.length - 1].v >= series[0].v ? "#059669" : "#DC2626";
  const gid = "g" + Math.random().toString(36).slice(2, 8);
  const grad = mk("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(mk("stop", { offset: "0%", "stop-color": col, "stop-opacity": .18 }));
  grad.appendChild(mk("stop", { offset: "100%", "stop-color": col, "stop-opacity": 0 }));
  const defs = mk("defs"); defs.appendChild(grad); svg.appendChild(defs);
  svg.appendChild(mk("path", { d: `${d}L${X(x1)},${Y(y0)}L${X(x0)},${Y(y0)}Z`, fill: `url(#${gid})` }));
  svg.appendChild(mk("path", { d, fill: "none", stroke: col, "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }));

  [0, .25, .5, .75, 1].forEach(f => {
    const t = new Date(x0 + (x1 - x0) * f);
    const tx = mk("text", { x: X(+t), y: H - 6, fill: "#94A3B8", "font-size": 11,
      "text-anchor": f === 0 ? "start" : f === 1 ? "end" : "middle" });
    tx.textContent = mode === "rank" ? "#" + Math.round(1 + (series.length - 1) * f)
      : t.toLocaleDateString("en-IN", { month: "short", year: "2-digit" });
    svg.appendChild(tx);
  });

  const dot = mk("circle", { r: 4, fill: col, stroke: "#fff", "stroke-width": 2, opacity: 0 });
  const vln = mk("line", { stroke: "#94A3B8", "stroke-width": 1, "stroke-dasharray": "3 3",
    y1: P.t, y2: H - P.b, opacity: 0 });
  svg.appendChild(vln); svg.appendChild(dot);
  wrap.appendChild(svg);
  const tip = el("div", "tip"); wrap.appendChild(tip);

  svg.addEventListener("mousemove", ev => {
    const box = svg.getBoundingClientRect();
    const vx = (ev.clientX - box.left) / box.width * W;
    const tv = x0 + (vx - P.l) / (W - P.l - P.r) * (x1 - x0);
    let lo = 0, hi = series.length - 1;
    while (lo < hi) { const m = (lo + hi) >> 1; if (+series[m].t < tv) lo = m + 1; else hi = m; }
    const p = series[lo];
    const px = X(+p.t) / W * box.width, py = Y(p.v) / H * box.height;
    dot.setAttribute("cx", X(+p.t)); dot.setAttribute("cy", Y(p.v)); dot.setAttribute("opacity", 1);
    vln.setAttribute("x1", X(+p.t)); vln.setAttribute("x2", X(+p.t)); vln.setAttribute("opacity", 1);
    tip.innerHTML = (p.label ? esc(p.label) : dstr(p.t)) +
      `<br><span class="tv">${mode === "rank" ? fmt(p.v) + "%" : "₹" + fmt(p.v, 4)}</span>`;
    tip.style.opacity = 1;
    tip.style.left = Math.min(Math.max(px - 55, 0), box.width - 150) + "px";
    tip.style.top = Math.max(py - 52, 0) + "px";
  });
  svg.addEventListener("mouseleave", () => {
    tip.style.opacity = 0; dot.setAttribute("opacity", 0); vln.setAttribute("opacity", 0);
  });
  host.appendChild(wrap);
}

function barList(host, rows, opt = {}) {
  const { max = 12, colorFn = null, onClick = null } = opt;
  host.innerHTML = "";
  if (!rows || !rows.length) { host.appendChild(el("div", "empty", "No data")); return; }
  const top = rows.slice(0, max), rest = rows.slice(max);
  if (rest.length) top.push({ label: `Other (${rest.length})`,
    pct: rest.reduce((a, b) => a + Number(b.pct || 0), 0), other: true });
  const peak = Math.max(...top.map(r => Math.abs(Number(r.pct) || 0)), 0.01);
  const box = el("div", "bars");
  top.forEach((r, i) => {
    const b = el("div", "bar");
    const lbl = el("div", "lbl" + (onClick && !r.other ? " clk" : ""), esc(r.label));
    if (onClick && !r.other) lbl.onclick = () => onClick(r);
    b.appendChild(lbl);
    b.appendChild(el("div", "pc", r.raw != null ? r.raw : pct(Number(r.pct))));
    const tr = el("div", "tr"), fl = el("div", "fl");
    fl.style.width = Math.abs(Number(r.pct) || 0) / peak * 100 + "%";
    fl.style.background = r.other ? "#CBD5E1" : colorFn ? colorFn(r) : PALETTE[i % PALETTE.length];
    tr.appendChild(fl); b.appendChild(tr); box.appendChild(b);
  });
  host.appendChild(box);
}

function donut(host, rows, centerLabel) {
  host.innerHTML = "";
  const data = (rows || []).filter(r => Number(r.pct) > 0);
  if (!data.length) { host.appendChild(el("div", "empty", "No data")); return; }
  const total = data.reduce((a, b) => a + Number(b.pct), 0);
  const S = 200, R = 74, C = 2 * Math.PI * R;
  const svg = mk("svg", { viewBox: `0 0 ${S} ${S}`, style: "width:180px;height:180px;flex:0 0 auto" });
  let off = 0;
  data.forEach((r, i) => {
    const frac = Number(r.pct) / total;
    svg.appendChild(mk("circle", { cx: S/2, cy: S/2, r: R, fill: "none",
      stroke: PALETTE[i % PALETTE.length], "stroke-width": 26,
      "stroke-dasharray": `${(frac*C).toFixed(2)} ${C.toFixed(2)}`,
      "stroke-dashoffset": (-off*C).toFixed(2), transform: `rotate(-90 ${S/2} ${S/2})` }));
    off += frac;
  });
  const t1 = mk("text", { x: S/2, y: S/2 - 4, "text-anchor": "middle", "font-size": 25,
    "font-weight": 700, fill: "#0F172A", "font-family": "DM Mono, monospace" });
  t1.textContent = data.length;
  const t2 = mk("text", { x: S/2, y: S/2 + 16, "text-anchor": "middle", "font-size": 11,
    fill: "#64748B", "font-family": "Plus Jakarta Sans, sans-serif" });
  t2.textContent = centerLabel || "types";
  svg.appendChild(t1); svg.appendChild(t2);

  const legend = el("div");
  legend.style.cssText = "flex:1;min-width:170px;display:flex;flex-direction:column;gap:8px";
  data.forEach((r, i) => {
    const row = el("div");
    row.style.cssText = "display:flex;align-items:center;gap:9px;font-size:12.5px";
    const sw = el("i");
    sw.style.cssText = `width:11px;height:11px;border-radius:3px;flex:0 0 auto;background:${PALETTE[i%PALETTE.length]}`;
    const nm = el("span", "", esc(r.label)); nm.style.flex = "1";
    const vv = el("span", "mono", pct(Number(r.pct))); vv.style.fontWeight = 600;
    row.append(sw, nm, vv); legend.appendChild(row);
  });
  const wrap = el("div");
  wrap.style.cssText = "display:flex;gap:22px;align-items:center;flex-wrap:wrap";
  wrap.append(svg, legend);
  host.appendChild(wrap);
}

/* one horizontal bar split into labelled segments -- for cap and asset mixes */
function splitBar(host, rows, opt = {}) {
  host.innerHTML = "";
  const data = (rows || []).filter(r => Number(r.pct) > 0);
  if (!data.length) { host.appendChild(el("div", "empty", "No data")); return; }
  const total = data.reduce((a, b) => a + Number(b.pct), 0);
  const bar = el("div", "split");
  const leg = el("div", "legend");
  data.forEach((r, i) => {
    const share = Number(r.pct) / total * 100;
    const seg = el("div", "", share > 7 ? pct(Number(r.pct), opt.dp ?? 1) : "");
    seg.style.width = share + "%";
    seg.style.background = opt.colors ? opt.colors[i % opt.colors.length] : PALETTE[i % PALETTE.length];
    seg.title = `${r.label}: ${pct(Number(r.pct))}`;
    bar.appendChild(seg);
    const l = el("span", "", `<i style="background:${opt.colors ? opt.colors[i % opt.colors.length] : PALETTE[i % PALETTE.length]}"></i>${esc(r.label)} ${pct(Number(r.pct), opt.dp ?? 1)}`);
    leg.appendChild(l);
  });
  host.append(bar, leg);
}

/* cols = [{h, k, n?, fn?}] */
function table(rows, cols, onRow) {
  const box = el("div", "tblwrap");
  const t = el("table");
  t.innerHTML = `<thead><tr>${cols.map(c =>
    `<th class="${c.n ? "n" : ""}">${esc(c.h)}</th>`).join("")}</tr></thead>`;
  const tb = el("tbody");
  (rows || []).forEach((r, i) => {
    const tr = el("tr");
    tr.innerHTML = cols.map(c => {
      const v = c.fn ? c.fn(r, i) : r[c.k];
      return `<td class="${c.n ? "n" : ""}">${v == null ? "—" : v}</td>`;
    }).join("");
    if (onRow) tr.onclick = () => onRow(r);
    tb.appendChild(tr);
  });
  t.appendChild(tb); box.appendChild(t);
  if (!rows || !rows.length) box.appendChild(el("div", "empty", "Nothing here"));
  return box;
}

const tiles = specs => {
  const t = el("div", "tiles");
  specs.forEach(([k, v, s]) => t.appendChild(el("div", "tile",
    `<div class="k">${esc(k)}</div><div class="v">${v ?? "—"}</div>
     <div class="s">${s == null ? "" : s}</div>`)));

};

/* count-up: animates a number from 0 to target the first time it scrolls in.
   fmtFn turns the running value into display text (so it works for AUM in Cr,
   plain counts, percentages). Respects prefers-reduced-motion. */
function countUp(node, target, fmtFn, ms = 1100) {
  target = Number(target) || 0;
  const paint = v => { node.textContent = fmtFn(v); };
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) {
    paint(target); return node;
  }
  let started = false;
  const run = () => {
    if (started) return; started = true;
    const t0 = performance.now();
    const step = now => {
      const p = Math.min((now - t0) / ms, 1);
      const e = 1 - Math.pow(1 - p, 3);         // easeOutCubic
      paint(target * e);
      if (p < 1) requestAnimationFrame(step); else paint(target);
    };
    requestAnimationFrame(step);
  };
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { run(); io.disconnect(); } });
    }, { threshold: .4 });
    io.observe(node);
  } else run();
  return node;
}

/* radial gauge -- an arc that sweeps to `frac` (0..1), with a big center value.
   Used for the equity share of the whole book, coverage, concentration. */
function gauge(host, frac, opt = {}) {
  const { size = 190, stroke = 15, color = "#059669", track = "#EEF2F7",
          center = "", sub = "", gradient = null } = opt;
  frac = Math.max(0, Math.min(1, Number(frac) || 0));
  const R = (size - stroke) / 2, C = 2 * Math.PI * R, cx = size / 2;
  const svg = mk("svg", { viewBox: `0 0 ${size} ${size}`,
    style: `width:${size}px;height:${size}px` });
  if (gradient) {
    const defs = mk("defs"), lg = mk("linearGradient",
      { id: gradient.id, x1: 0, y1: 0, x2: 1, y2: 1 });
    lg.appendChild(mk("stop", { offset: "0%", "stop-color": gradient.from }));
    lg.appendChild(mk("stop", { offset: "100%", "stop-color": gradient.to }));
    defs.appendChild(lg); svg.appendChild(defs);
  }
  svg.appendChild(mk("circle", { cx, cy: cx, r: R, fill: "none",
    stroke: track, "stroke-width": stroke }));
  const arc = mk("circle", { cx, cy: cx, r: R, fill: "none",
    stroke: gradient ? `url(#${gradient.id})` : color, "stroke-width": stroke,
    "stroke-linecap": "round", "stroke-dasharray": C.toFixed(2),
    "stroke-dashoffset": C.toFixed(2),
    transform: `rotate(-90 ${cx} ${cx})`,
    style: "transition:stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1)" });
  svg.appendChild(arc);
  const t1 = mk("text", { x: cx, y: cx - 2, "text-anchor": "middle", "font-size": 26,
    "font-weight": 800, fill: "#0F172A", "font-family": "DM Mono, monospace" });
  t1.textContent = center;
  const t2 = mk("text", { x: cx, y: cx + 18, "text-anchor": "middle", "font-size": 11,
    fill: "#64748B", "font-family": "Plus Jakarta Sans, sans-serif" });
  t2.textContent = sub;
  svg.append(t1, t2);
  host.appendChild(svg);
  requestAnimationFrame(() => { arc.setAttribute("stroke-dashoffset", (C * (1 - frac)).toFixed(2)); });
  return svg;
}

/* SEBI-style riskometer -- a 180° dial with six coloured zones and a needle
   that swings to `frac` (0 = Low on the left, 1 = Very High on the right). */
function riskometer(host, frac, label) {
  frac = Math.max(0, Math.min(1, Number(frac) || 0));
  const W = 210, H = 128, cx = W / 2, cy = H - 12, R = 84, r = 52;
  const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, style: `width:${W}px;height:${H}px` });
  const zones = ["#2FA36B", "#7DBE4E", "#E3B93E", "#E8912F", "#E0692C", "#D6402C"];
  const arc = (a0, a1, rad) => {
    const p = (ang, rr) => [cx + rr * Math.cos(Math.PI - ang * Math.PI),
                            cy - rr * Math.sin(Math.PI - ang * Math.PI)];
    const [x0, y0] = p(a0, rad), [x1, y1] = p(a1, rad);
    return `M ${x0} ${y0} A ${rad} ${rad} 0 0 1 ${x1} ${y1}`;
  };
  zones.forEach((c, i) => {
    svg.appendChild(mk("path", { d: arc(i / 6, (i + 1) / 6, R), fill: "none",
      stroke: c, "stroke-width": 15, "stroke-linecap": "butt" }));
  });
  // needle
  const ang = Math.PI - frac * Math.PI;
  const nx = cx + (R - 4) * Math.cos(ang), ny = cy - (R - 4) * Math.sin(ang);
  const needle = mk("line", { x1: cx, y1: cy, x2: cx, y2: cy - (R - 4),
    stroke: "#0F172A", "stroke-width": 3, "stroke-linecap": "round",
    style: "transition:transform 1.3s cubic-bezier(.34,1.4,.5,1);transform-origin:" + cx + "px " + cy + "px" });
  svg.appendChild(needle);
  svg.appendChild(mk("circle", { cx, cy, r: 6, fill: "#0F172A" }));
  const lbl = mk("text", { x: cx, y: cy - 20, "text-anchor": "middle", "font-size": 12,
    "font-weight": 700, fill: "#0F172A", "font-family": "Plus Jakarta Sans, sans-serif" });
  lbl.textContent = label || "";
  svg.appendChild(lbl);
  host.appendChild(svg);
  // swing from left to the target
  requestAnimationFrame(() =>
    needle.setAttribute("transform", `rotate(${frac * 180 - 0} ${cx} ${cy})`));
  // (needle drawn pointing up; rotate maps 0->left via -90 offset)
  needle.setAttribute("transform", `rotate(-90 ${cx} ${cy})`);
  requestAnimationFrame(() =>
    setTimeout(() => needle.setAttribute("transform", `rotate(${frac * 180 - 90} ${cx} ${cy})`), 80));
  return svg;
}

/* coin-stack: ranked horizontal bars that grow on render (top holders etc.) */
function stackBars(host, rows, opt = {}) {
  const { valFn = r => r.pct, labFn = r => r.label, dispFn = r => pct(Number(r.pct)),
          colorFn = (r, i) => PALETTE[i % PALETTE.length], onClick = null } = opt;
  const data = (rows || []).slice(0, 5);
  const peak = Math.max(...data.map(r => Math.abs(Number(valFn(r)) || 0)), 0.01);
  const box = el("div", "stack");
  data.forEach((r, i) => {
    const row = el("div", "row" + (onClick ? " clk" : ""));
    row.innerHTML = `<span class="nm">${esc(labFn(r))}</span><span class="vv">${dispFn(r)}</span>`;
    const tk = el("div", "tk"), fl = el("div", "fl");
    fl.style.background = colorFn(r, i);
    tk.appendChild(fl); row.appendChild(tk); box.appendChild(row);
    if (onClick) { row.style.cursor = "pointer"; row.onclick = () => onClick(r); }
    requestAnimationFrame(() =>
      setTimeout(() => { fl.style.width = Math.abs(Number(valFn(r)) || 0) / peak * 100 + "%"; }, 60 + i * 90));
  });
  host.appendChild(box);
  return box;
}

/* ==========================================================================
   NAV history + metrics (client-side, api.mfapi.in)
   ========================================================================== */
async function loadNav(code) {
  const r = await fetch(MFAPI + encodeURIComponent(code));
  if (!r.ok) throw new Error("mfapi " + r.status);
  const j = await r.json();
  if (!j || !Array.isArray(j.data)) throw new Error("mfapi: unexpected shape");
  const series = j.data.map(d => {
    const [dd, mm, yy] = String(d.date).split("-");
    return { t: new Date(+yy, +mm - 1, +dd), v: parseFloat(d.nav) };
  }).filter(p => !isNaN(p.t) && isFinite(p.v) && p.v > 0).sort((a, b) => a.t - b.t);
  return { meta: j.meta || {}, series };
}
const addM = (d, n) => { const x = new Date(d); x.setMonth(x.getMonth() + n); return x; };
const addY = (d, n) => { const x = new Date(d); x.setFullYear(x.getFullYear() + n); return x; };

function navOn(series, target) {
  let lo = 0, hi = series.length - 1, out = null;
  while (lo <= hi) { const m = (lo + hi) >> 1;
    if (series[m].t <= target) { out = series[m]; lo = m + 1; } else hi = m - 1; }
  return out;
}

const PERIODS = [["1M", d => addM(d,-1)], ["3M", d => addM(d,-3)], ["6M", d => addM(d,-6)],
  ["YTD", d => new Date(d.getFullYear(),0,1)], ["1Y", d => addY(d,-1)], ["3Y", d => addY(d,-3)],
  ["5Y", d => addY(d,-5)], ["10Y", d => addY(d,-10)]];

/* Beyond a year, returns are annualised. Quoting an absolute 3-year figure
   beside a 1-year one flatters the longer period purely for elapsed time. */
function returns(series) {
  if (!series || !series.length) return [];
  const last = series[series.length - 1], first = series[0], out = [];
  for (const [name, back] of PERIODS) {
    const target = back(last.t);
    if (target < first.t) continue;
    const base = navOn(series, target);
    if (!base || !base.v) continue;
    const days = (last.t - base.t) / 864e5;
    out.push({ name, abs: (last.v / base.v - 1) * 100,
      ann: days > 400 ? (Math.pow(last.v / base.v, 365.25 / days) - 1) * 100 : null,
      from: base.t });
  }
  const days = (last.t - first.t) / 864e5;
  if (days > 30) out.push({ name: "Since inception", abs: (last.v / first.v - 1) * 100,
    ann: days > 400 ? (Math.pow(last.v / first.v, 365.25 / days) - 1) * 100 : null, from: first.t });
  return out;
}

/* NAV lands on business days only, so annualise over 252, not 365. */
function risk(series, years = 3) {
  if (!series || series.length < 30) return null;
  const end = series[series.length - 1].t;
  const s = series.filter(p => p.t >= addY(end, -years));
  if (s.length < 30) return null;
  const r = [];
  for (let i = 1; i < s.length; i++) if (s[i-1].v > 0) r.push(s[i].v / s[i-1].v - 1);
  if (r.length < 20) return null;
  const mean = r.reduce((a,b) => a+b, 0) / r.length;
  const vol = Math.sqrt(r.reduce((a,b) => a + (b-mean)**2, 0) / (r.length-1) * TRADING_DAYS) * 100;
  const down = r.filter(x => x < 0);
  const dvol = down.length
    ? Math.sqrt(down.reduce((a,b) => a + b*b, 0) / down.length * TRADING_DAYS) * 100 : 0;
  const days = (s[s.length-1].t - s[0].t) / 864e5;
  const cagr = (Math.pow(s[s.length-1].v / s[0].v, 365.25 / days) - 1) * 100;
  let peak = -Infinity, mdd = 0, mddAt = null;
  for (const p of s) { if (p.v > peak) peak = p.v;
    const dd = p.v / peak - 1; if (dd < mdd) { mdd = dd; mddAt = p.t; } }
  return { years, cagr, vol,
    sharpe: vol > 0 ? (cagr - RISK_FREE) / vol : null,
    sortino: dvol > 0 ? (cagr - RISK_FREE) / dvol : null,
    maxdd: mdd * 100, maxddAt: mddAt,
    best: Math.max(...r) * 100, worst: Math.min(...r) * 100,
    posDays: r.filter(x => x > 0).length / r.length * 100, obs: r.length };
}

   Search
   ========================================================================== */
let MODE = "fund", searchTimer = null, cursor = -1, hits = [];

function setMode(m) {
  MODE = m;
  $("#mFund").classList.toggle("on", m === "fund");
  $("#mStock").classList.toggle("on", m === "stock");
  $("#q").placeholder = m === "fund"
    ? "Search a fund — flexi cap, corporate bond, nifty 50"
    : "Search a stock — reliance, hdfc bank, or an ISIN";
  $("#q").value = ""; $("#res").classList.remove("on"); $("#q").focus();
}

$("#q").addEventListener("input", e => {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if (q.length < 2) { $("#res").classList.remove("on"); return; }
  searchTimer = setTimeout(() => runSearch(q), 220);
});
$("#q").addEventListener("keydown", e => {
  const box = $("#res");
  if (!box.classList.contains("on")) return;
  if (e.key === "ArrowDown") { e.preventDefault(); cursor = Math.min(cursor+1, hits.length-1); paintCursor(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); cursor = Math.max(cursor-1, 0); paintCursor(); }
  else if (e.key === "Enter" && cursor >= 0) { e.preventDefault(); choose(hits[cursor]); }
  else if (e.key === "Escape") box.classList.remove("on");
});
function paintCursor() {
  [...$("#res").children].forEach((n, i) => n.classList.toggle("sel", i === cursor));
  const n = $("#res").children[cursor]; if (n) n.scrollIntoView({ block: "nearest" });
}
document.addEventListener("click", e => {
  if (!e.target.closest(".searchbox")) $("#res").classList.remove("on");
});

async function runSearch(q) {
  const box = $("#res");
  box.innerHTML = `<div class="res"><span class="spin"></span>&nbsp; Searching…</div>`;
  box.classList.add("on");
  try {
    hits = MODE === "fund"
      ? await rpc("search_schemes", { q, lim: 25 })
      : await rpc("search_stocks", { q, lim: 25 });
    cursor = -1;
    if (!hits.length) {
      box.innerHTML = `<div class="res"><div><div class="nm">No match</div>
        <div class="sub">Try a shorter phrase</div></div></div>`;
      return;
    }
    box.innerHTML = "";
    hits.forEach((h, i) => {
      const r = el("div", "res");
      r.innerHTML = MODE === "fund"
        ? `<div style="flex:1;min-width:0">
             <div class="nm">${esc(h.scheme_name)}</div>
             <div class="sub">${esc(h.amc_name || "—")}${h.category ? " · " + esc(h.category) : ""}</div>
           </div>
           <div class="rt"><span class="pill ${h.has_holdings ? "ok" : "no"}">
             ${h.has_holdings ? "Portfolio" : "NAV only"}</span>
             <span class="sub mono">${esc(h.scheme_code)}</span></div>`
        : `<div style="flex:1;min-width:0">
             <div class="nm">${esc(h.instrument)}</div>
             <div class="sub">${esc(h.sector || "—")} · ${esc(h.isin)}</div>
           </div>
           <div class="rt"><span class="pill blue">${h.funds_holding} funds</span>
             <span class="sub mono">${cr(h.total_value_cr)}</span></div>`;
      r.onclick = () => choose(h);
      r.onmouseenter = () => { cursor = i; paintCursor(); };
      box.appendChild(r);
    });
  } catch (err) {
    box.innerHTML = `<div class="res"><div><div class="nm">Search failed</div>
      <div class="sub">${esc(err.message)}</div></div></div>`;
  }
}

function choose(h) {
  $("#res").classList.remove("on");
  if (MODE === "fund") { $("#q").value = h.scheme_name; go("#/fund/" + h.scheme_code); }
  else { $("#q").value = h.instrument; go("#/stock/" + h.isin); }
}

/* ==========================================================================
   Real 3D showcase elements -- three.js, ported verbatim from the reference
   file's coin / arrow / shield scenes. Only the mounting and data wiring is
   new; the geometry, materials and lighting are the reference's own.
   ========================================================================== */
let DC_STATE = null;                       // { dead, raf, cleanups } for the live block

function disposeDarkThree() {
  if (!DC_STATE) return;
  DC_STATE.dead = true;
  if (DC_STATE.raf) cancelAnimationFrame(DC_STATE.raf);
  DC_STATE.cleanups.forEach(fn => { try { fn(); } catch (_e) {} });
  DC_STATE = null;
}

async function initDarkThree(hosts) {      // hosts = {coin, arrow, shield}
  let THREE, RoomEnvironment;
  try {
    THREE = await import("three");
    RoomEnvironment = (await import("three/addons/environments/RoomEnvironment.js")).RoomEnvironment;
  } catch (err) { console.warn("three.js unavailable", err); return; }

  const state = { dead: false, raf: 0, cleanups: [], scenes: [] };
  DC_STATE = state;
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const motion = reduce ? 0 : 1;
  const accent = 0xE9B949;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

  const mk = (host, build) => {
    if (!host) return;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(dpr);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.style.cssText = "width:100%;height:100%;display:block";
    host.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.035).texture;
    const key = new THREE.DirectionalLight(0xffffff, 2.1);
    key.position.set(3.2, 5, 4); key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.near = 1; key.shadow.camera.far = 20;
    key.shadow.camera.left = -5; key.shadow.camera.right = 5;
    key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xE9B949, 1.4); rim.position.set(-4, 1.4, -3); scene.add(rim);
    scene.add(new THREE.AmbientLight(0x8FA4C0, 0.35));
    const group = new THREE.Group(); scene.add(group);
    const api = build({ THREE, scene, group, camera });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.42 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = api.floorY ?? -0.02; floor.receiveShadow = true;
    scene.add(floor);
    const resize = () => {
      const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    };
    resize();
    const ro = new ResizeObserver(resize); ro.observe(host);
    let tx = 0, ty = 0, cxr = 0, cyr = 0;
    const move = e => { const r = host.getBoundingClientRect();
      tx = ((e.clientX - r.left) / r.width - 0.5) * 0.85 * motion;
      ty = ((e.clientY - r.top) / r.height - 0.5) * 0.45 * motion; };
    const out = () => { tx = 0; ty = 0; };
    host.addEventListener("pointermove", move);
    host.addEventListener("pointerleave", out);
    const entry = { visible: true, tick: t => {
      cxr += (tx - cxr) * 0.075; cyr += (ty - cyr) * 0.075;
      api.tick && api.tick(t, cxr, cyr);
      group.rotation.y = (api.baseY ?? 0) + cxr;
      group.rotation.x = (api.baseX ?? 0) + cyr;
      renderer.render(scene, camera);
    } };
    const io = new IntersectionObserver(([e]) => { entry.visible = e.isIntersecting; }, { threshold: 0.05 });
    io.observe(host);
    state.cleanups.push(() => { ro.disconnect(); io.disconnect(); pmrem.dispose(); renderer.dispose();
      host.removeEventListener("pointermove", move); host.removeEventListener("pointerleave", out);
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); });
    state.scenes.push(entry);
  };

  const gold = c => new THREE.MeshStandardMaterial({ color: c || accent, metalness: 1, roughness: 0.19 });
  const steel = new THREE.MeshStandardMaterial({ color: 0x9FB0C4, metalness: 0.95, roughness: 0.31 });

    });
    const ang = 0.6109, dx = Math.cos(ang), dy = Math.sin(ang), rz = -(Math.PI / 2 - ang);
    const Sp = [-2.05, 0.55], L = 3.8, arrowG = new THREE.Group();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.115, L, 32), gold()); shaft.castShadow = true;
    shaft.position.set(Sp[0] + dx * L / 2, Sp[1] + dy * L / 2, 0); shaft.rotation.z = rz; arrowG.add(shaft);
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.72, 40), gold()); head.castShadow = true;
    head.position.set(Sp[0] + dx * (L + 0.34), Sp[1] + dy * (L + 0.34), 0); head.rotation.z = rz; arrowG.add(head);
    arrowG.position.z = 0.55; group.add(arrowG);

    innerS.scale.set(0.8, 0.8, 1); innerS.position.z = 0.12; group.add(innerS);
    const core = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.12, bevelEnabled: true, bevelSize: 0.04, bevelThickness: 0.04, bevelSegments: 4, curveSegments: 24 }), dark);
    core.scale.set(0.63, 0.63, 1); core.position.z = 0.22; group.add(core);
    const bar1 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.72, 0.1), gold(0xF2CE7C)); bar1.position.set(0, 0.1, 0.4); group.add(bar1);
    const bar2 = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.16, 0.1), gold(0xF2CE7C)); bar2.position.set(0, -0.16, 0.4); group.add(bar2);
    return { floorY: -2.1, tick: t => {
      group.rotation.y = reduce ? 0 : Math.sin(t * 0.00042) * 0.36; group.position.y = 0.1 + Math.sin(t * 0.0011) * 0.05; } };
  });

  const loop = t => {
    if (state.dead) return;
    state.scenes.forEach(s => { if (s.visible) s.tick(t); });
    state.raf = requestAnimationFrame(loop);
  };
  state.raf = requestAnimationFrame(loop);
}

/* ==========================================================================
   Landing showcase -- the animated front page, built from real RPC data
   ========================================================================== */
function crBig(cr) {                       // rupees-in-crore -> readable scale
  cr = Number(cr) || 0;
  if (cr >= 1e5) return "₹" + (cr / 1e5).toFixed(2) + " L Cr";
  if (cr >= 1e3) return "₹" + (cr / 1e3).toFixed(2) + "k Cr";
  return "₹" + fmt(cr, 0) + " Cr";
}

function buildLanding(v, ov, sectors, conc, cov, topFunds, rets) {
  const equityShare = ov.total_aum_cr ? Number(ov.equity_aum_cr) / Number(ov.total_aum_cr) : 0;
  const debtShare   = ov.total_aum_cr ? Number(ov.debt_aum_cr)   / Number(ov.total_aum_cr) : 0;

  // median 3Y return for the arrow badge
  let medCagr = null;
  if (rets && rets.length) {
    const vals = rets.map(r => Number(r.return_pct)).filter(x => isFinite(x)).sort((a, b) => a - b);
    if (vals.length) medCagr = vals[Math.floor(vals.length / 2)];
  }

  /* ---- dark reference-textured showcase: real 3D + counters ---- */
  buildDarkHero(v, ov, medCagr);

  /* ---- equity/debt gauge (light) ---- */
  const gc = el("div", "gauge-card fadein");
  gc.style.marginBottom = "16px";
  gc.appendChild(el("h3", "", "Equity vs debt across the whole book"));
  const gh = el("div"); gc.appendChild(gh);
  gauge(gh, equityShare, { color: "#059669", center: Math.round(equityShare * 100) + "%",
    sub: "in equity", gradient: { id: "gEq", from: "#34D39F", to: "#047857" } });
  gc.appendChild(el("div", "legend", `<span style="margin-top:12px">
    <i style="background:#059669"></i>Equity ${pct(equityShare * 100, 1)} &nbsp;
    <i style="background:#0B1F3A"></i>Debt ${pct(debtShare * 100, 1)}</span>`));
  v.appendChild(gc);

  /* ---- three showcase metric cards ---- */
  const m = el("div", "metrics fadein");

  // 1. most-held stock, coin-stack of top 5 by fund count
  if (topFunds && topFunds.length) {
    const t = topFunds[0];
    const card = el("div", "mcard clk");
    card.innerHTML =
      `<div class="cap">★ Most-owned stock</div>
       <div class="lead">${esc(t.instrument)}</div>
       <div class="leadsub">held by <b>${fmt(t.funds_holding, 0)}</b> funds across
         ${fmt(t.amcs_holding, 0)} fund houses</div>`;
    const h = el("div"); card.appendChild(h);
    stackBars(h, topFunds, {
      valFn: r => r.funds_holding, labFn: r => r.instrument,
      dispFn: r => fmt(r.funds_holding, 0) + " funds",
      colorFn: (_r, i) => i === 0 ? "#C9A961" : "#0B1F3A",
      onClick: r => go("#/stock/" + r.isin) });
    card.onclick = () => go("#/stock/" + t.isin);
    m.appendChild(card);
  }

  // 2. biggest sector bet
  if (sectors && sectors.length) {
    const s = sectors[0];
    const card = el("div", "mcard clk");
    card.innerHTML =
      `<div class="cap">◆ Market's biggest bet</div>
       <div class="lead">${esc(s.sector)}</div>
       <div class="leadsub">${cr(s.total_value_cr)} · most-held name
         ${esc(short(s.top_stock || "", 22))}</div>`;
    const h = el("div"); card.appendChild(h);
    stackBars(h, sectors, {
      valFn: r => r.total_value_cr, labFn: r => r.sector,
      dispFn: r => cr(r.total_value_cr),
      colorFn: (_r, i) => PALETTE[i % PALETTE.length],
      onClick: r => go("#/sector/" + encodeURIComponent(r.sector)) });
    card.onclick = () => go("#/sector/" + encodeURIComponent(s.sector));
    m.appendChild(card);
  }

  // 3. concentration gauge -- how much of the market sits in its top 10 names
  const t10 = (conc || []).find(r => /top\s*10\b/i.test(r.bucket)) || (conc || [])[0];
  if (t10) {
    const card = el("div", "mcard");
    card.innerHTML = `<div class="cap">◐ How top-heavy the market is</div>`;
    const gh2 = el("div"); gh2.style.cssText = "display:flex;justify-content:center;margin:6px 0";
    card.appendChild(gh2);
    gauge(gh2, Number(t10.share_pct) / 100, { size: 168, stroke: 14, color: "#C9A961",
      center: Math.round(Number(t10.share_pct)) + "%", sub: esc(t10.bucket),
      gradient: { id: "gConc", from: "#E0C07A", to: "#8B6F2F" } });
    card.appendChild(el("div", "leadsub",
      `${fmt(t10.stocks, 0)} names hold ${pct(t10.share_pct)} of the entire pooled equity book — ` +
      `a quick read on how crowded the top of the market is.`));
    m.appendChild(card);
  }
  v.appendChild(m);

  /* ---- second row: donut · growth · riskometer · vault · shield ---- */
  const r2 = el("div", "showrow fadein");
  const othersCr = Math.max(0, Number(ov.total_aum_cr) - Number(ov.equity_aum_cr) - Number(ov.debt_aum_cr));

  // asset allocation donut
  const dCard = el("div", "scard");
  dCard.appendChild(el("div", "cap", "Asset allocation"));
  const dBody = el("div", "body"); dCard.appendChild(dBody);
  donut(dBody, [
    { label: "Equity", pct: equityShare * 100 },
    { label: "Debt", pct: debtShare * 100 },
    { label: "Cash / other", pct: ov.total_aum_cr ? othersCr / Number(ov.total_aum_cr) * 100 : 0 }
  ], "asset mix");
  r2.appendChild(dCard);

  // compounding growth -- median 3Y return across funds with NAV history
  if (rets && rets.length) {
    const vals = rets.map(r => Number(r.return_pct)).filter(x => isFinite(x)).sort((a, b) => a - b);
    const med = vals.length ? vals[Math.floor(vals.length / 2)] : null;
    if (med != null) {
      const g = el("div", "scard");
      g.appendChild(el("div", "cap", "Compounding · 3-year"));
      const b = el("div", "body");
      b.innerHTML = `<div class="grow">
        <svg viewBox="0 0 120 54" style="width:150px;height:66px">
          <defs><linearGradient id="gGrow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(5,150,105,.28)"/>
            <stop offset="100%" stop-color="rgba(5,150,105,0)"/></linearGradient></defs>
          <path d="M4 50 L34 40 L60 30 L86 16 L116 5" fill="none" stroke="#059669"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 50 L34 40 L60 30 L86 16 L116 5 L116 54 L4 54 Z" fill="url(#gGrow)"/>
          <path d="M108 5 L116 5 L116 13" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="pct${med < 0 ? " dn" : ""}">${signed(med)}</div></div>`;
      g.appendChild(b);
      g.appendChild(el("div", "foot",
        `Median annualised 3-year return across the ${fmt(vals.length, 0)} funds with enough NAV history.`));
      r2.appendChild(g);
    }
  }

  // riskometer -- where the whole tracked book sits on risk (equity-heavy = higher)
  const risk = el("div", "scard");
  risk.appendChild(el("div", "cap", "Market riskometer"));
  const rBody = el("div", "body"); risk.appendChild(rBody);
  const zone = ["Low", "Low–Moderate", "Moderate", "Moderately High", "High", "Very High"][
    Math.min(5, Math.floor(equityShare * 6))];
  riskometer(rBody, equityShare, zone);
  risk.appendChild(el("div", "foot",
    `Read from the equity share of the tracked book — ${pct(equityShare * 100, 1)} in equity puts it at “${zone}”.`));
  r2.appendChild(risk);

  // holdings vault
  const vault = el("div", "scard");
  vault.appendChild(el("div", "cap", "Holdings vault"));
  const vBody = el("div", "body");
  vBody.innerHTML = `<div class="vault"><div class="door"></div>
    <div class="big" id="ldVault">0</div></div>`;
  vault.appendChild(vBody);
  vault.appendChild(el("div", "foot",
    `Distinct securities the engine sees through, across every disclosed portfolio.`));
  r2.appendChild(vault);
  countUp(vBody.querySelector("#ldVault"), ov.securities, x => fmt(x, 0));
  setTimeout(() => vBody.querySelector(".vault").classList.add("open"), 500);

  v.appendChild(r2);

  /* ---- interesting facts strip ---- */
  const facts = [];
  if (topFunds && topFunds[0])
    facts.push([fmt(topFunds[0].funds_holding, 0),
      `funds hold ${topFunds[0].instrument} — the single most widely owned stock in the book.`]);
  if (sectors && sectors[0])
    facts.push([pct(sectors[0].avg_weight),
      `is the average fund's weight in ${sectors[0].sector}, the market's largest sector.`]);
  const smallCov = (cov || []).find(r => /small/i.test(r.market_cap_class));
  if (smallCov && smallCov.untouched)
    facts.push([fmt(smallCov.untouched, 0),
      `listed small-cap companies are held by no fund at all — the market's blind spot.`]);
  if (t10) facts.push([pct(t10.share_pct),
    `of all equity money sits in just ${fmt(t10.stocks, 0)} stocks.`]);
  facts.push([crBig(ov.total_aum_cr),
    `tracked across ${fmt(ov.amcs, 0)} fund houses and ${fmt(ov.funds, 0)} funds.`]);

  if (facts.length) {
    const strip = el("div", "facts fadein");
    facts.forEach(([big, txt]) => strip.appendChild(
      el("div", "fact", `<div class="big">${esc(big)}</div><div class="txt">${esc(txt)}</div>`)));
    v.appendChild(strip);
  }
}

   VIEW · Market
   ========================================================================== */
async function viewMarket(v) {
  hero("Market intelligence",
       "What every disclosed portfolio in the database owns, aggregated across AMCs.");
  v.innerHTML = loading("Loading market…");

  const [ovR, seR, capR, covR, concR, catR, topFunds, retLead] = await Promise.all([
    rpc("market_overview"),
    rpc("top_sectors", { lim: 14 }),
    soft(rpc("marketcap_overview")),
    soft(rpc("mf_coverage")),
    soft(rpc("market_concentration")),
    rpc("list_categories"),
    soft(rpc("top_stocks", { lim: 6, p_order: "funds" })),
    soft(rpc("return_leaderboard", { p_months: 36, lim: 500 }))
  ]);
  const ov = one(ovR);
  v.innerHTML = "";

  /* ---- landing showcase: the front page ---- */
  buildLanding(v, ov, seR, concR, covR, topFunds, retLead);

  /* ---- what visitors can do here ---- */
  buildFeatures(v, ov);

  /* ---- coverage detail ---- */
  const c1 = el("div", "card");
  c1.appendChild(el("h2", "", "Coverage in full"));
  c1.appendChild(el("div", "hint",
    `Snapshots span ${dstr(dt(ov.oldest_snapshot))} to ${dstr(dt(ov.newest_snapshot))} — AMCs
     disclose on different cycles, and each fund is shown at its own latest date. AUM is the
     sum of disclosed holding values, not an official figure.`));
  c1.appendChild(tiles([
    ["Funds", fmt(ov.funds, 0), "with disclosed portfolios"],
    ["AMCs", fmt(ov.amcs, 0), "fund houses loaded"],
    ["Securities", fmt(ov.securities, 0), "unique ISINs"],
    ["Total AUM", cr(ov.total_aum_cr), "disclosed"],
    ["Equity", cr(ov.equity_aum_cr), ov.total_aum_cr ? pct(ov.equity_aum_cr / ov.total_aum_cr * 100, 1) + " of book" : ""],
    ["Debt", cr(ov.debt_aum_cr), ov.total_aum_cr ? pct(ov.debt_aum_cr / ov.total_aum_cr * 100, 1) + " of book" : ""],
    ["Categories", fmt(ov.categories, 0), ""],
    ["Sectors", fmt(ov.sectors, 0), ""]
  ]));
  v.appendChild(c1);

  /* ---- market cap mix + concentration, side by side ---- */
  if (capR || concR) {
    const two = el("div", "row two");

    if (capR) {
      const a = el("div", "card");
      a.appendChild(el("h2", "", "Where equity money sits by size"));
      const unc = capR.find(r => r.market_cap_class === "Unclassified");
      a.appendChild(el("div", "hint",
        "Against AMFI's half-yearly ranking — ranks 1–100 Large, 101–250 Mid, 251+ Small." +
        (unc ? ` Unclassified is ${pct(unc.share_pct)} and is almost entirely debt, cash,
                 gold, foreign and fund units — none of which AMFI ranks.` : "")));
      const known = capR.filter(r => r.market_cap_class !== "Unclassified");
      const kt = known.reduce((s, r) => s + Number(r.total_value_cr), 0);
      const h = el("div"); a.appendChild(h);
      splitBar(h, known.map(r => ({ label: r.market_cap_class,
        pct: Number(r.total_value_cr) / kt * 100 })),
        { colors: ["#0B1F3A", "#059669", "#C9A961"] });
      a.appendChild(el("div", "hint", "Share of the classified equity book only."));
      a.appendChild(table(capR, [
        { h: "Class", fn: r => esc(r.market_cap_class) },
        { h: "Stocks", n: 1, fn: r => fmt(r.securities, 0) },
        { h: "Funds", n: 1, fn: r => fmt(r.funds_holding, 0) },
        { h: "Value", n: 1, fn: r => cr(r.total_value_cr) },
        { h: "Of all", n: 1, fn: r => pct(r.share_pct) }
      ]));
      two.appendChild(a);
    }

    if (concR && concR.length) {
      const b = el("div", "card");
      b.appendChild(el("h2", "", "How top-heavy the industry is"));
      b.appendChild(el("div", "hint",
        "Every equity holding across every loaded fund, pooled and ranked by rupees. " +
        "This is the industry's combined book, not any one fund's."));
      const h = el("div"); b.appendChild(h);
      barList(h, concR.map(r => ({ label: r.bucket, pct: Number(r.share_pct),
        raw: pct(r.share_pct) + " · " + cr(r.value_cr) })), { max: 6 });
      const top10 = concR.find(r => r.bucket === "Top 10");
      if (top10) b.appendChild(el("div", "insight",
        `The <b>10 largest names</b> hold <b>${pct(top10.share_pct)}</b> of all equity money
         across ${fmt(ov.funds, 0)} funds. Owning more funds does not escape this — most of
         them are buying the same top of the market.`));
      two.appendChild(b);
    }
    v.appendChild(two);
  }

  /* ---- what the industry does and does not touch ---- */
  if (covR && covR.length) {
    const c = el("div", "card");
    c.appendChild(el("h2", "", "What the industry actually touches"));
    c.appendChild(el("div", "hint",
      "Of every company AMFI ranks, how many any loaded fund holds at all."));
    c.appendChild(table(covR, [
      { h: "Class", fn: r => esc(r.market_cap_class) },
      { h: "Listed", n: 1, fn: r => fmt(r.amfi_companies, 0) },
      { h: "Held", n: 1, fn: r => fmt(r.held_by_funds, 0) },
      { h: "Untouched", n: 1, fn: r => fmt(r.untouched, 0) },
      { h: "Coverage", n: 1, fn: r => `<b>${pct(r.coverage_pct, 1)}</b>` }
    ]));
    const small = covR.find(r => r.market_cap_class === "Small Cap");
    if (small) c.appendChild(el("div", "insight",
      `Every large cap and every mid cap is owned by someone. In small caps, funds hold
       <b>${fmt(small.held_by_funds, 0)} of ${fmt(small.amfi_companies, 0)}</b> —
       <b>${fmt(small.untouched, 0)} listed companies have no mutual fund money in them at
       all</b>. Usually that is thin float or thin volume rather than oversight: SEBI's
       liquidity norms keep managers out.`));

    /* the biggest of the untouched */
    const uh = el("div"); uh.style.marginTop = "20px"; c.appendChild(uh);
    soft(rpc("untouched_stocks", { p_class: "Small Cap", lim: 20 })).then(rows => {
      if (!rows || !rows.length) return;
      uh.appendChild(el("h3", "", "Largest companies with zero fund ownership"));
      uh.appendChild(el("div", "hint",
        "Ranked by AMFI's own average market cap. A fact about ownership, not a recommendation."));
      uh.appendChild(table(rows, [
        { h: "Rank", n: 1, fn: r => `<span style="color:var(--muted)">#${r.cap_rank}</span>` },

        { h: "ISIN", fn: r => `<span class="sub2 mono">${esc(r.isin)}</span>` },

      ]));
    });

  }

  /* ---- most-held stocks, three orderings ---- */
  const c2 = el("div", "card");
  c2.appendChild(el("h2", "", "Most-held stocks"));
  c2.appendChild(el("div", "hint",
    "These three orderings disagree, and the disagreement is the point: a name held by " +
    "400 funds at 1% each is a different bet from one held by 12 funds at 8% each."));
  const chips = el("div", "chips"), host = el("div");
  const orders = [["funds", "By fund count"], ["value", "By rupees"], ["weight", "By avg weight"]];
  const drawStocks = async (ord, btn) => {
    [...chips.children].forEach(n => n.classList.remove("on"));
    if (btn) btn.classList.add("on");
    host.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
    const rows = await rpc("top_stocks", { lim: 25, p_order: ord });
    host.innerHTML = "";
    host.appendChild(table(rows, [
      { h: "#", n: 1, fn: (r, i) => `<span style="color:var(--muted)">${i + 1}</span>` },
      { h: "Stock", fn: r => `<span class="lnk">${esc(r.instrument)}</span>
          <div class="sub2 mono">${esc(r.isin)}</div>` },
      { h: "Sector", fn: r => esc(short(r.sector, 26)) },
      { h: "Funds", n: 1, fn: r => fmt(r.funds_holding, 0) },
      { h: "AMCs", n: 1, fn: r => fmt(r.amcs_holding, 0) },
      { h: "Total value", n: 1, fn: r => cr(r.total_value_cr) },
      { h: "Avg wt", n: 1, fn: r => pct(r.avg_weight, 2) },
      { h: "Max wt", n: 1, fn: r => pct(r.max_weight) }
    ], r => go("#/stock/" + r.isin)));
  };
  orders.forEach(([o, label], i) => {
    const b = el("button", "chip" + (i === 0 ? " on" : ""), label);
    b.onclick = () => drawStocks(o, b);
    chips.appendChild(b);
  });
  c2.append(chips, host);
  v.appendChild(c2);
  drawStocks("funds", chips.children[0]);

  /* ---- flows, only once a second snapshot exists ---- */
  const flow = el("div"); v.appendChild(flow);
  soft(rpc("market_changes", { p_action: "bought", lim: 20 })).then(rows => {
    if (!rows || !rows.length) return;
    const fc = el("div", "card");
    fc.appendChild(el("h2", "", "Where money moved"));
    fc.appendChild(el("div", "hint",
      "Change in disclosed value between each fund's last two disclosures, pooled across " +
      "every fund that has two. Funds disclose on different dates, so this is a rough " +
      "direction of travel, not a single-period flow figure."));
    const fchips = el("div", "chips"), fhost = el("div");
    [["bought", "Bought"], ["sold", "Sold"], ["new", "New positions"], ["exit", "Exited"]]
      .forEach(([a, label], i) => {
        const b = el("button", "chip" + (i === 0 ? " on" : ""), label);
        b.onclick = async () => {
          [...fchips.children].forEach(n => n.classList.remove("on"));
          b.classList.add("on");
          fhost.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
          const rr = await rpc("market_changes", { p_action: a, lim: 25 });
          fhost.innerHTML = "";
          fhost.appendChild(table(rr, [
            { h: "Stock", fn: r => `<span class="lnk">${esc(r.instrument || r.isin)}</span>
                <div class="sub2 mono">${esc(r.isin)}</div>` },
            { h: "Sector", fn: r => esc(short(r.sector, 24)) },
            { h: "Funds", n: 1, fn: r => fmt(r.funds_moved, 0) },
            { h: "Value change", n: 1, fn: r =>
                `<b class="${signOf(r.value_change_cr)}">${r.value_change_cr > 0 ? "+" : ""}${cr(r.value_change_cr)}</b>` },
            { h: "Now", n: 1, fn: r => cr(r.value_now_cr) },
            { h: "Avg wt Δ", n: 1, fn: r => signed(r.avg_pct_change, 3) }
          ], r => go("#/stock/" + r.isin)));
        };
        fchips.appendChild(b);
      });
    fc.append(fchips, fhost);
    flow.appendChild(fc);
    fchips.children[0].click();
  });

  /* ---- sectors ---- */
  const c3 = el("div", "card");
  c3.appendChild(el("h2", "", "Sector allocation, industry-wide"));
  c3.appendChild(el("div", "hint",
    "Total disclosed value by sector. Labels come from the AMCs and are not standardised — " +
    "one house writes “IT - Software”, another “Software”. Click to open a sector."));
  const sh = el("div"); c3.appendChild(sh);
  barList(sh, seR.map(r => ({ label: r.sector, pct: r.total_value_cr, raw: cr(r.total_value_cr) })),
    { max: 14, onClick: r => go("#/sector/" + encodeURIComponent(r.label)) });
  v.appendChild(c3);

  /* ---- categories ---- */
  const c4 = el("div", "card");
  c4.appendChild(el("h2", "", "By scheme category"));
  c4.appendChild(el("div", "hint", "Click a category for its peer benchmark."));
  c4.appendChild(table(catR.slice(0, 25), [
    { h: "Category", fn: r => `<span class="lnk">${esc(r.category)}</span>` },
    { h: "Funds", n: 1, fn: r => fmt(r.funds, 0) },
    { h: "AUM", n: 1, fn: r => cr(r.total_aum_cr) },
    { h: "Avg holdings", n: 1, fn: r => fmt(r.avg_holdings, 1) }
  ], r => go("#/category/" + encodeURIComponent(r.category))));
  v.appendChild(c4);
}
