async function viewFund(v, code) {
  v.innerHTML = loading("Loading fund…");

  const [ovR, navR] = await Promise.allSettled([
    rpc("fund_overview", { p_scheme_code: code }),
    loadNav(code)
  ]);
  const ov = ovR.status === "fulfilled" ? one(ovR.value) : null;
  const navData = navR.status === "fulfilled" ? navR.value : null;
  const navErr = navR.status === "rejected" ? navR.reason.message : null;
  const series = navData ? navData.series : [];
  const name = (ov && ov.plan_name) || (navData && navData.meta.scheme_name) || "Scheme " + code;
  const hasPortfolio = !!(ov && ov.has_holdings);

  hero(name, hasPortfolio
    ? "NAV, returns, risk and the full disclosed portfolio."
    : "NAV, returns and risk. No portfolio disclosure loaded for this scheme.");

  const last = series.length ? series[series.length - 1] : null;
  const prev = series.length > 1 ? series[series.length - 2] : null;
  const dayChg = last && prev ? (last.v / prev.v - 1) * 100 : null;

  v.innerHTML = "";
  const head = el("div", "card");
  head.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start">
    <div style="flex:1;min-width:260px">
      <h2>${esc(name)}</h2>
      <div class="chips" style="margin-top:9px;margin-bottom:0">
        ${ov && ov.master_amc ? `<span class="pill gold">${esc(ov.master_amc)}</span>` : ""}
        ${ov && ov.category ? `<span class="pill no">${esc(ov.category)}</span>` : ""}
        <span class="pill ${hasPortfolio ? "ok" : "no"}">${hasPortfolio ? "Portfolio" : "NAV only"}</span>
        <span class="pill no mono">${esc(code)}</span>
      </div>
      <div id="fundCmp" style="margin-top:12px;display:flex;gap:9px"></div>
    </div>
    <div style="text-align:right;min-width:150px">
      <div style="font-size:30px;font-weight:800;letter-spacing:-.03em;font-family:var(--mono)">
        ${last ? "₹" + fmt(last.v, 4) : "—"}</div>
      <div class="mono ${signOf(dayChg)}" style="font-weight:700;font-size:13px">
        ${dayChg == null ? "" : signed(dayChg)}
        <span style="color:var(--muted);font-weight:500">1D</span></div>
      <div style="color:var(--muted);font-size:11.5px;margin-top:2px">
        NAV as on ${last ? dstr(last.t) : "—"}</div>
    </div></div>`;
  v.appendChild(head);

  if (hasPortfolio) {
    const box = $("#fundCmp");
    box.append(cmpButton("+ Compare", () => cmpAddFund(code, name, ov && ov.master_amc)));
    const g = el("button", "btn ghost", "Open compare");
    g.style.cssText += ";padding:7px 13px;font-size:12px";
    g.onclick = () => go("#/compare");
    box.appendChild(g);
  }

  if (navErr) v.appendChild(el("div", "note err",
    `NAV history unavailable — ${esc(navErr)}. Returns and risk need api.mfapi.in.`));

  /* Changes earns a tab only once a second snapshot exists for this scheme */
  let chSum = null;
  if (hasPortfolio) chSum = one(await soft(rpc("fund_change_summary", { p_scheme_code: code })) || []);
  const hasHistory = !!(chSum && chSum.has_history);

  const tabDefs = [["perf", "Performance", true], ["port", "Portfolio", hasPortfolio],
    ["vs", "Versus peers", hasPortfolio], ["chg", "Changes", hasHistory],
    ["anly", "Analytics", hasPortfolio], ["peer", "Similar funds", hasPortfolio]]
    .filter(t => t[2]);
  const shell = el("div", "card");
  const bar = el("div", "tabs"), panes = el("div");
  tabDefs.forEach(([id, label], i) => {
    const t = el("div", "tab" + (i === 0 ? " on" : ""), label);
    t.onclick = () => {
      [...bar.children].forEach(n => n.classList.remove("on"));
      [...panes.children].forEach(n => n.classList.remove("on"));
      t.classList.add("on"); $("#pane-" + id).classList.add("on");
    };
    bar.appendChild(t);
    const p = el("div", "pane" + (i === 0 ? " on" : "")); p.id = "pane-" + id;
    panes.appendChild(p);
  });
  shell.append(bar, panes);
  v.appendChild(shell);

  paintPerf($("#pane-perf"), series);

  if (hasPortfolio) {
    const [mx, as, se, hl, rk, capR] = await Promise.all([
      rpc("holdings_metrics", { p_scheme_code: code }),
      rpc("holdings_assets",  { p_scheme_code: code }),
      rpc("holdings_sectors", { p_scheme_code: code }),
      rpc("holdings_list",    { p_scheme_code: code }),
      soft(rpc("fund_rank",   { p_scheme_code: code })),
      soft(rpc("fund_marketcap", { p_scheme_code: code }))
    ]);
    paintPortfolio($("#pane-port"), one(mx), as, se, hl, ov, capR);
    paintVersus($("#pane-vs"), one(rk), one(mx), capR);
    paintFundAnalytics($("#pane-anly"), code, hl, one(mx));
    paintPeers($("#pane-peer"), code);
    if (hasHistory) paintChanges($("#pane-chg"), code, chSum);
  }
}

function paintPerf(host, series) {
  host.innerHTML = "";
  if (!series.length) {
    host.appendChild(el("div", "empty",
      "<b>No NAV history</b>api.mfapi.in returned nothing for this scheme code."));
    return;
  }
  const rets = returns(series), rk = risk(series, 3);

  host.appendChild(el("h2", "", "Returns"));
  host.appendChild(el("div", "hint",
    "Periods beyond one year are annualised (CAGR). Shorter periods are absolute."));
  host.appendChild(tiles(rets.map(r => {
    const val = r.ann != null ? r.ann : r.abs;
    return [r.name, `<span class="${signOf(val)}">${signed(val)}</span>`,
            `${r.ann != null ? "CAGR · " : ""}from ${dstr(r.from)}`];
  })));

  const ch = el("div"); ch.style.marginTop = "26px";
  ch.appendChild(el("h2", "", "NAV history"));
  ch.appendChild(el("div", "hint",
    `${series.length.toLocaleString("en-IN")} observations · ${dstr(series[0].t)} to ${dstr(series[series.length-1].t)}`));
  const chips = el("div", "chips"), plot = el("div");
  const draw = yrs => {
    const end = series[series.length - 1].t;
    const s = yrs == null ? series : series.filter(p => p.t >= addY(end, -yrs));
    lineChart(plot, s.length > 1 ? s : series);
  };
  [["1M",1/12],["6M",.5],["1Y",1],["3Y",3],["5Y",5],["10Y",10],["MAX",null]].forEach(([label, yrs]) => {
    const b = el("button", "chip" + (label === "3Y" ? " on" : ""), label);
    b.onclick = () => { [...chips.children].forEach(n => n.classList.remove("on"));
      b.classList.add("on"); draw(yrs); };
    chips.appendChild(b);
  });
  ch.append(chips, plot); host.appendChild(ch); draw(3);

  const rw = el("div"); rw.style.marginTop = "26px";
  rw.appendChild(el("h2", "", "Risk"));
  if (!rk) { rw.appendChild(el("div", "empty", "Not enough history.")); host.appendChild(rw); return; }
  rw.appendChild(el("div", "hint",
    `Trailing ${rk.years} years · ${rk.obs.toLocaleString("en-IN")} daily observations ·
     risk-free ${RISK_FREE}% · annualised over ${TRADING_DAYS} trading days`));
  rw.appendChild(tiles([
    ["CAGR", `<span class="${signOf(rk.cagr)}">${signed(rk.cagr)}</span>`, `${rk.years}-year annualised`],
    ["Volatility", pct(rk.vol), "annualised σ of daily returns"],
    ["Sharpe", `<span class="${signOf(rk.sharpe)}">${fmt(rk.sharpe)}</span>`, "per unit of total risk"],
    ["Sortino", `<span class="${signOf(rk.sortino)}">${fmt(rk.sortino)}</span>`, "per unit of downside risk"],
    ["Max drawdown", `<span class="down">${pct(rk.maxdd)}</span>`, rk.maxddAt ? "trough " + dstr(rk.maxddAt) : ""],
    ["Best day", `<span class="up">${signed(rk.best)}</span>`, ""],
    ["Worst day", `<span class="down">${signed(rk.worst)}</span>`, ""],
    ["Positive days", pct(rk.posDays, 1), "share of sessions up"]
  ]));
  host.appendChild(rw);
}

function paintPortfolio(host, m, assets, sectors, holdings, ov, capR) {
  host.innerHTML = "";
  if (!holdings || !holdings.length) {
    host.appendChild(el("div", "empty", "<b>No holdings returned</b>"));
    return;
  }
  const pd = m ? m.portfolio_date : (ov ? ov.portfolio_date : null);
  host.appendChild(el("h2", "", "Portfolio snapshot"));
  host.appendChild(el("div", "hint",
    `Disclosure as on ${pd ? dstr(dt(pd)) : "—"} · weights sum to ${m ? pct(m.pct_sum) : "—"}`));

  if (m && Math.abs(Number(m.pct_sum) - 100) > 2) {
    host.appendChild(el("div", "note",
      `Weights sum to ${pct(m.pct_sum)} rather than 100%. Arbitrage, equity-savings and
       dynamic-allocation funds disclose derivative legs differently, which is the usual
       cause. The holdings themselves are unaffected.`));
  }

  if (m) {
    host.appendChild(tiles([
      ["Holdings", m.total_holdings, `${m.securities} securities`],
      ["Top 5", pct(m.top_5_pct), "of net assets"],
      ["Top 10", pct(m.top_10_pct), "of net assets"],
      ["Largest", pct(m.largest_pct), "single position"],
      ["Cash", pct(m.cash_pct), "TREPS + net current assets"],
      ["Sectors", m.sectors, m.top_sector ? "top: " + short(m.top_sector, 18) : ""],
      ["HHI", fmt(m.hhi, 0), "concentration index"],
      ["Effective stocks", fmt(m.effective_stocks, 1), "10000 / HHI"]
    ]));
    if (m.securities && m.effective_stocks && m.securities > m.effective_stocks * 1.8) {
      host.appendChild(el("div", "insight",
        `Holds <b>${fmt(m.securities, 0)}</b> securities but behaves like
         <b>${fmt(m.effective_stocks, 1)}</b> equally-weighted positions — the tail is small
         enough that it barely moves the fund.`));
    }
  }

  /* market cap split, if AMFI tagging has been loaded */
  if (capR && capR.length) {
    const known = capR.filter(r => r.market_cap_class !== "Unclassified");
    if (known.length) {
      const unc = capR.find(r => r.market_cap_class === "Unclassified");
      const kt = known.reduce((s, r) => s + Number(r.pct), 0);
      const mc = el("div"); mc.style.marginTop = "26px";
      mc.appendChild(el("h3", "", "Market-cap split"));
      mc.appendChild(el("div", "hint",
        "Against AMFI's half-yearly ranking — ranks 1–100 Large, 101–250 Mid, 251+ Small. " +
        (unc ? `${pct(unc.pct)} is unclassified (debt, cash, foreign, gold or fund units), so
                the split below describes the ${pct(kt)} that AMFI ranks.` : "")));
      const h = el("div"); mc.appendChild(h);
      splitBar(h, known.map(r => ({ label: r.market_cap_class, pct: Number(r.pct) / kt * 100 })),
        { colors: ["#0B1F3A", "#059669", "#C9A961"] });
      host.appendChild(mc);
    }
  }

  const two = el("div", "row two"); two.style.marginTop = "26px";
  const a = el("div");
  a.appendChild(el("h3", "", "Asset allocation"));
  a.appendChild(el("div", "hint", "Equity / debt / cash / REITs / fund units"));
  const ah = el("div"); a.appendChild(ah);

/* ---------- Fund · Versus peers ---------- */
async function paintVersus(host, rk, m, capR) {
  host.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  if (!rk || !rk.category) {
    host.innerHTML = "";
    host.appendChild(el("div", "empty",
      "<b>No peer group</b>This scheme has no AMFI category, so there is nothing to compare against."));
    return;
  }
  const S = one(await soft(rpc("category_stats", { p_category: rk.category })) || []);
  host.innerHTML = "";

  host.appendChild(el("h2", "", "Versus its category"));
  host.appendChild(el("div", "hint",
    `Against ${fmt(rk.peers, 0)} funds in ${esc(rk.category)}. Percentile is where this fund
     sits among them — for concentration a high percentile is not automatically better, it
     just means more concentrated.`));

  const rowsSpec = [
    ["AUM", rk.aum_cr, S ? null : null, rk.aum_pctile, v => cr(v), null],
    ["Securities held", rk.securities, S ? S.med_holdings : null, rk.holdings_pctile, v => fmt(v, 0), v => fmt(v, 1)],
    ["Top-10 weight", rk.top_10_pct, S ? S.med_top_10 : null, rk.top10_pctile, v => pct(v), v => pct(v)],
    ["HHI", rk.hhi, S ? S.med_hhi : null, rk.hhi_pctile, v => fmt(v, 0), v => fmt(v, 0)],
    ["Cash", rk.cash_pct, S ? S.med_cash : null, rk.cash_pctile, v => pct(v), v => pct(v)]
  ];
  const box = el("div", "tblwrap");
  const t = el("table"); t.className = "cmp-tbl";
  t.innerHTML = `<thead><tr><th>Metric</th><th class="n">This fund</th>
    <th class="n">Category median</th><th class="n">Difference</th>
    <th class="n">Percentile</th></tr></thead>`;
  const tb = el("tbody");
  rowsSpec.forEach(([label, mine, med, pctile, f, fm]) => {
    const diff = (mine != null && med != null) ? Number(mine) - Number(med) : null;
    const tr = el("tr");
    tr.innerHTML = `<td>${esc(label)}</td>
      <td class="n"><b>${f(mine)}</b></td>
      <td class="n">${med == null ? "—" : (fm || f)(med)}</td>
      <td class="n d ${signOf(diff)}">${diff == null ? "—"
          : (diff > 0 ? "+" : "") + (fm || f)(Math.abs(diff)).replace("₹", diff < 0 ? "−₹" : "₹")}</td>
      <td class="n">${pctile == null ? "—" : fmt(pctile, 0) + "th"}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); box.appendChild(t);
  host.appendChild(box);

  if (S && S.med_holdings && rk.securities) {
    const ratio = rk.securities / Number(S.med_holdings);
    if (ratio < 0.7 || ratio > 1.4) {
      host.appendChild(el("div", "insight",
        ratio < 0.7
          ? `Holds <b>${fmt(rk.securities, 0)}</b> securities against a category median of
             <b>${fmt(S.med_holdings, 1)}</b> — a materially more concentrated book than its peers.`
          : `Holds <b>${fmt(rk.securities, 0)}</b> securities against a category median of
             <b>${fmt(S.med_holdings, 1)}</b> — a materially wider book than its peers.`));
    }
  }

  if (S && S.most_common_stock) {
    host.appendChild(el("div", "hint",
      `Most widely held name in this category: <b>${esc(S.most_common_stock)}</b>, in
       ${pct(S.most_common_pct, 0)} of its funds.`));
  }

  if (capR && capR.length) {
    const known = capR.filter(r => r.market_cap_class !== "Unclassified");
    if (known.length) {
      const kt = known.reduce((s, r) => s + Number(r.pct), 0);
      const w = el("div"); w.style.marginTop = "26px";
      w.appendChild(el("h3", "", "Cap mix against the mandate"));
      w.appendChild(el("div", "hint",
        "SEBI minimums are written against AMFI's ranking: Large Cap 80% large, Mid Cap 65% " +
        "mid, Small Cap 65% small, Large & Mid 35% each. Shares below are of the classified " +
        "book only."));
      const h = el("div"); w.appendChild(h);
      splitBar(h, known.map(r => ({ label: r.market_cap_class, pct: Number(r.pct) / kt * 100 })),
        { colors: ["#0B1F3A", "#059669", "#C9A961"] });
      host.appendChild(w);
    }
  }
}

/* ---------- Fund · Changes ---------- */
async function paintChanges(host, code, sum) {
  host.innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  try {
    const rows = await rpc("fund_changes", { p_scheme_code: code, lim: 400 });
    host.innerHTML = "";
    host.appendChild(el("h2", "", "What changed"));
    host.appendChild(el("div", "hint",
      `Between ${dstr(dt(sum.date_before))} and ${dstr(dt(sum.date_now))}.`));
    host.appendChild(tiles([
      ["New positions", fmt(sum.new_count, 0), pct(sum.new_pct) + " of the book"],
      ["Exits", fmt(sum.exit_count, 0), pct(sum.exit_pct) + " released"],
      ["Added to", fmt(sum.added_count, 0), ""],
      ["Trimmed", fmt(sum.trimmed_count, 0), ""],
      ["Churn", pct(sum.churn_pct), "half the absolute weight shift"],
      ["AUM now", cr(sum.aum_now_cr), signed(sum.aum_change_pct) + " vs before"]
    ]));
    host.appendChild(el("div", "note",
      `Weight change alone can mislead — when the whole book rises, an untouched position's
       weight barely moves while its value climbs. Where the AMC discloses quantity, the
       <b>Qty</b> column is the cleaner read on what was actually traded.`));

    const chips = el("div", "chips"); chips.style.marginTop = "20px";
    const body = el("div");
    const draw = f => {
      const list = f ? rows.filter(r => r.action === f) : rows.filter(r => r.action !== "HELD");
      body.innerHTML = "";
      body.appendChild(table(list, [
        { h: "", fn: r => `<span class="pill ${r.action === "NEW" ? "ok"
            : r.action === "EXIT" ? "no" : r.action === "ADDED" ? "blue" : "gold"}">${r.action}</span>` },
        { h: "Instrument", fn: r => `<span class="lnk">${esc(r.instrument)}</span>
            <div class="sub2 mono">${esc(r.isin || "")}</div>` },
        { h: "Sector", fn: r => esc(short(r.sector, 24)) },
        { h: "Before", n: 1, fn: r => pct(r.pct_before) },
        { h: "Now", n: 1, fn: r => pct(r.pct_now) },
        { h: "Change", n: 1, fn: r => `<b class="${signOf(r.pct_change)}">${signed(r.pct_change)}</b>` },
        { h: "Qty", n: 1, fn: r => r.qty_change_pct == null ? "—"
            : `<span class="${signOf(r.qty_change_pct)}">${signed(r.qty_change_pct, 1)}</span>` }
      ], r => { if (r.isin) go("#/stock/" + r.isin); }));
    };
    [["", "Everything"], ["NEW", "New"], ["EXIT", "Exits"], ["ADDED", "Added"], ["TRIMMED", "Trimmed"]]
      .forEach(([f, label], i) => {
        const b = el("button", "chip" + (i === 0 ? " on" : ""), label);
        b.onclick = () => { [...chips.children].forEach(n => n.classList.remove("on"));
          b.classList.add("on"); draw(f); };

      });

    draw("");
  } catch (e) { host.innerHTML = errCard(e); }

  let run = 0;
  const cum = secs.map((h, i) => { run += Number(h.pct_to_nav) || 0;
    return { t: new Date(2000, 0, 1 + i), v: run, label: `Top ${i + 1}: ${h.instrument}` }; });

      d.appendChild(tiles([["Weighted yield", pct(wavg), `across ${wy.length} rated papers`]]));
    }

  const uw = el("div"); uw.style.marginTop = "26px";
  uw.appendChild(el("h2", "", "Off-consensus positions"));
  uw.appendChild(el("div", "hint",
    "Names that at most one other loaded fund holds — either genuine conviction, or a " +
    "position nobody else wants. Coverage is 16 of ~45 AMCs, so a name here may well be " +
    "held by a house that is not loaded."));

  host.appendChild(uw);
  try {

      { h: "Instrument", fn: r => `<span class="lnk">${esc(r.instrument)}</span>
          <div class="sub2 mono">${esc(r.isin)}</div>` },
      { h: "Sector", fn: r => esc(short(r.sector, 24)) },
      { h: "% to NAV", n: 1, fn: r => `<b>${pct(r.pct_to_nav)}</b>` },
      { h: "₹ Cr", n: 1, fn: r => fmt(r.value_cr, 1) },
      { h: "Held by", n: 1, fn: r => `${r.held_by} fund${r.held_by > 1 ? "s" : ""}` }
    ], r => go("#/stock/" + r.isin))
      : el("div", "empty", "Every holding is shared with other funds."));
  } catch (e) { uh.replaceWith(el("div", "note err", esc(e.message))); }

  host.appendChild(el("div", "note",
    "Portfolio turnover, YTM and Macaulay duration are published in the same AMC files " +
    "but are not captured in this database yet — only holdings are stored."));

function buildAmcBreakdown(rows, isin) {
  const wrap = el("div");
  if (!rows || !rows.length) {
    wrap.appendChild(el("div", "empty", "No AMC holds this security."));
    return wrap;
  }
  const chips = el("div", "chips"), body = el("div");
  let order = "share";

  const draw = () => {
    const sorted = [...rows].sort((a, b) => order === "share"
      ? Number(b.total_value_cr) - Number(a.total_value_cr)
      : Number(b.pct_of_amc_book) - Number(a.pct_of_amc_book));
    body.innerHTML = "";
    const box = el("div", "tblwrap");
    const t = el("table");
    t.innerHTML = `<thead><tr><th>AMC</th><th class="n">Schemes</th><th class="n">Value</th>
      <th class="n">Share</th><th class="n">Of AMC book</th><th>Largest scheme</th></tr></thead>`;
    const tb = el("tbody");
    sorted.forEach(r => {
      const tr = el("tr");
      tr.innerHTML = `
        <td><span class="pill gold">${esc(r.amc)}</span></td>
        <td class="n">${fmt(r.schemes, 0)}</td>
        <td class="n">${cr(r.total_value_cr)}</td>
        <td class="n"><b>${pct(r.share_of_total_pct)}</b></td>
        <td class="n">${pct(r.pct_of_amc_book, 3)}</td>
        <td><span class="lnk">${esc(short(r.top_scheme, 40))}</span>
            <div class="sub2">${pct(r.top_scheme_pct)} of that scheme</div></td>`;
      tb.appendChild(tr);
      let open = null;
      tr.onclick = async () => {
        if (open) { open.remove(); open = null; return; }
        open = el("tr");
        open.innerHTML = `<td colspan="6"><span class="spin"></span></td>`;
        tr.after(open);
        try {
          const schemes = await rpc("stock_funds", { p_isin: isin, lim: 15, p_amc: r.amc });
          const cell = el("td"); cell.colSpan = 6;
          cell.style.cssText = "background:var(--bg);padding:14px 11px";
          cell.appendChild(el("div", "hint",
            `Top ${schemes.length} ${esc(r.amc)} scheme${schemes.length === 1 ? "" : "s"} holding this security`));
          const inner = el("table"); inner.style.minWidth = "0";
          inner.innerHTML = `<thead><tr><th>Scheme</th><th class="n">% to NAV</th>
            <th class="n">₹ Cr</th><th class="n">Fund AUM</th></tr></thead>`;
          const itb = el("tbody");
          schemes.forEach(s => {
            const str = el("tr");
            str.innerHTML = `<td><span class="lnk">${esc(s.scheme_name)}</span>
                ${s.category ? `<div class="sub2">${esc(s.category)}</div>` : ""}</td>
              <td class="n"><b>${pct(s.pct_to_nav)}</b></td>
              <td class="n">${fmt(s.value_cr, 1)}</td>
              <td class="n">${cr(s.fund_aum_cr)}</td>`;
            str.onclick = ev => { ev.stopPropagation();
              if (s.scheme_code) go("#/fund/" + s.scheme_code); };
            itb.appendChild(str);
          });
          inner.appendChild(itb); cell.appendChild(inner);
          open.innerHTML = ""; open.appendChild(cell);
        } catch (e) {
          open.innerHTML = `<td colspan="6"><div class="note err">${esc(e.message)}</div></td>`;
        }
      };
    });
    t.appendChild(tb); box.appendChild(t); body.appendChild(box);

    const bh = el("div"); bh.style.marginTop = "20px"; body.appendChild(bh);
    barList(bh, sorted.map(r => ({
      label: r.amc,
      pct: order === "share" ? Number(r.total_value_cr) : Number(r.pct_of_amc_book),
      raw: order === "share" ? cr(r.total_value_cr) : pct(r.pct_of_amc_book, 3)
    })), { max: 20 });
  };

  [["share", "By money"], ["book", "By conviction"]].forEach(([o, label], i) => {
    const b = el("button", "chip" + (i === 0 ? " on" : ""), label);
    b.onclick = () => { order = o;
      [...chips.children].forEach(n => n.classList.remove("on"));
      b.classList.add("on"); draw(); };
    chips.appendChild(b);
  });
  wrap.append(chips, body);
  draw();
  return wrap;
}

let XRAY = [];   // [{code, name, amc, amount}]

async function viewXray(v) {
  hero("Portfolio X-ray",
       "Add the funds you hold and see what you actually own underneath them.");
  v.innerHTML = "";

  const c = el("div", "card");
  c.appendChild(el("h2", "", "Your funds"));
  c.appendChild(el("div", "hint",
    "Add funds and, optionally, the amount in each — leave amounts blank to weight them " +
    "equally. Any plan works; Direct, Regular and IDCW all resolve to the same portfolio."));

  const bar = el("div", "cmp");
  const inp = el("input");
  inp.placeholder = "Search a fund to add…";
  bar.appendChild(inp);
  c.appendChild(bar);
  const drop = el("div", "results");
  drop.style.position = "static"; drop.style.marginTop = "-8px";
  c.appendChild(drop);
  const list = el("div"); c.appendChild(list);
  const actions = el("div"); actions.style.cssText = "display:flex;gap:9px;margin-top:14px";
  const run = el("button", "btn", "Run X-ray");
  const clr = el("button", "btn ghost", "Clear");
  actions.append(run, clr); c.appendChild(actions);
  v.appendChild(c);

  const out = el("div"); v.appendChild(out);

  const paintList = () => {
    list.innerHTML = "";
    if (!XRAY.length) { list.appendChild(el("div", "empty", "No funds added yet.")); return; }
    XRAY.forEach((f, i) => {
      const row = el("div");
      row.style.cssText = "display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-soft)";
      const nm = el("div", "", `<div style="font-weight:600;font-size:13.5px">${esc(f.name)}</div>
        <div class="sub2">${esc(f.amc || "")} · ${esc(f.code)}</div>`);
      nm.style.flex = "1";
      const amt = el("input");
      amt.type = "number"; amt.placeholder = "Amount ₹"; amt.value = f.amount || "";
      amt.style.cssText = "width:130px;padding:8px 10px;border-radius:var(--r);border:1px solid var(--border);font-family:var(--mono);font-size:13px;outline:none";
      amt.oninput = e => { f.amount = e.target.value ? Number(e.target.value) : null; };
      const rm = el("button", "btn ghost", "Remove");
      rm.onclick = () => { XRAY.splice(i, 1); paintList(); };
      row.append(nm, amt, rm);
      list.appendChild(row);
    });
  };
  paintList();

  let tmr = null;
  inp.addEventListener("input", e => {
    const q = e.target.value.trim();
    clearTimeout(tmr);
    if (q.length < 2) { drop.classList.remove("on"); return; }
    tmr = setTimeout(async () => {
      try {
        const rows = (await rpc("search_schemes", { q, lim: 12 }))
          .filter(r => r.has_holdings && !XRAY.some(x => x.code === String(r.scheme_code)));
        drop.innerHTML = "";
        if (!rows.length) {
          drop.innerHTML = `<div class="res"><div><div class="nm">Nothing to add</div>
            <div class="sub">Only schemes with a loaded portfolio can be x-rayed</div></div></div>`;
          drop.classList.add("on"); return;
        }
        rows.forEach(r => {
          const n = el("div", "res", `<div style="flex:1"><div class="nm">${esc(r.scheme_name)}</div>
            <div class="sub">${esc(r.amc_name || "")}</div></div>`);
          n.onclick = () => {
            XRAY.push({ code: String(r.scheme_code), name: r.scheme_name,
                        amc: r.amc_name, amount: null });
            inp.value = ""; drop.classList.remove("on"); paintList();
          };
          drop.appendChild(n);
        });
        drop.classList.add("on");
      } catch (err) { drop.classList.remove("on"); }
    }, 220);
  });

  clr.onclick = () => { XRAY = []; paintList(); out.innerHTML = ""; };
  run.onclick = () => doXray(out);
}

async function doXray(out) {
  if (XRAY.length < 1) {
    out.innerHTML = `<div class="card"><div class="empty">Add at least one fund.</div></div>`;
    return;
  }
  out.innerHTML = loading("Looking through…");
  const codes = XRAY.map(f => f.code);
  const anyAmt = XRAY.some(f => f.amount > 0);
  const amounts = anyAmt ? XRAY.map(f => f.amount || 0) : null;

  try {
    const [sumR, hldR, secR, prsR] = await Promise.all([
      rpc("xray_summary",  { p_codes: codes, p_amounts: amounts }),
      rpc("xray_holdings", { p_codes: codes, p_amounts: amounts, lim: 300 }),
      rpc("xray_sectors",  { p_codes: codes, p_amounts: amounts }),
      codes.length > 1 ? rpc("xray_pairs", { p_codes: codes }) : Promise.resolve([])
    ]);
    const S = one(sumR);
    out.innerHTML = "";

    const c1 = el("div", "card");
    c1.appendChild(el("h2", "", "What you actually own"));
    c1.appendChild(el("div", "hint", anyAmt
      ? "Weighted by the amounts entered."
      : "Equal-weighted — enter amounts above for a weighting that matches your holding."));
    c1.appendChild(tiles([
      ["Funds", fmt(S.funds, 0), anyAmt ? "₹" + fmt(S.total_amount, 0) + " total" : "equal weight"],
      ["Securities", fmt(S.securities, 0), "distinct names"],
      ["Effective stocks", fmt(S.effective_stocks, 1), "10000 / HHI"],
      ["Top 10", pct(S.top_10_pct), "of the basket"],
      ["Largest", pct(S.largest_pct), short(S.largest_name, 22)],
      ["Duplicated", pct(S.shared_pct), `${fmt(S.shared_securities, 0)} names in 2+ funds`],
      ["Sectors", fmt(S.sectors, 0), S.top_sector ? `top: ${short(S.top_sector, 16)} ${pct(S.top_sector_pct)}` : ""],
      ["Equity", pct(S.equity_pct), ""],
      ["Debt", pct(S.debt_pct), ""],
      ["Cash", pct(S.cash_pct), ""]
    ]));

    if (S.securities && S.effective_stocks) {
      c1.appendChild(el("div", "insight",
        `You hold <b>${fmt(S.securities, 0)}</b> distinct securities, but the basket behaves
         like <b>${fmt(S.effective_stocks, 1)}</b> equally-weighted positions, and
         <b>${pct(S.shared_pct)}</b> of it sits in names more than one of your funds already
         owns. Fund count is not diversification.`));
    }
    out.appendChild(c1);

    if (prsR.length) {
      const c2 = el("div", "card");
      c2.appendChild(el("h2", "", "Where your funds duplicate each other"));
      c2.appendChild(el("div", "hint",
        "Pairwise overlap — the sum of min(weight) across shared ISINs. Two funds above 70% " +
        "are close to one position wearing two expense ratios."));
      c2.appendChild(table(prsR, [
        { h: "Fund A", fn: r => esc(short(r.fund_a, 38)) },
        { h: "Fund B", fn: r => esc(short(r.fund_b, 38)) },
        { h: "Overlap", n: 1, fn: r => `<b class="${Number(r.overlap_pct) > 70 ? "down" : ""}">${pct(r.overlap_pct)}</b>` },
        { h: "Common", n: 1, fn: r => fmt(r.common, 0) }
      ]));
      out.appendChild(c2);
    }

    const c3 = el("div", "card");
    c3.appendChild(el("h2", "", "Sector exposure"));
    c3.appendChild(el("div", "hint", "Combined across every fund in the basket"));
    const sh = el("div"); c3.appendChild(sh);
    barList(sh, secR.map(r => ({ label: r.sector, pct: r.weight_pct })),
      { max: 14, onClick: r => go("#/sector/" + encodeURIComponent(r.label)) });
    out.appendChild(c3);

    const c4 = el("div", "card");
    c4.appendChild(el("h2", "", "Combined holdings"));
    c4.appendChild(el("div", "hint",
      "Every security, with its true weight in the basket and which of your funds brought it."));
    c4.appendChild(table(hldR, [
      { h: "#", n: 1, fn: (r, i) => `<span style="color:var(--muted)">${i + 1}</span>` },
      { h: "Instrument", fn: r => `<span class="lnk">${esc(r.instrument)}</span>
          <div class="sub2 mono">${esc(r.isin)}</div>` },
      { h: "Sector", fn: r => esc(short(r.sector, 24)) },
      { h: "Weight", n: 1, fn: r => `<b>${pct(r.weight_pct, 3)}</b>` },
      { h: "Amount", n: 1, fn: r => anyAmt ? "₹" + fmt(r.amount, 0) : "—" },
      { h: "Via", fn: r => `${r.funds} fund${r.funds > 1 ? "s" : ""}
          <div class="sub2">${esc(short(r.via, 55))}</div>` }
    ], r => { if (r.isin) go("#/stock/" + r.isin); }));
    out.appendChild(c4);
  } catch (e) { out.innerHTML = errCard(e); }
}

/* ==========================================================================
   VIEW · Changes — what funds bought and sold between disclosures

   Every fund holding two snapshots is compared position by position. Coverage
   is not the whole market and saying so matters: a house appears here only
   once a second portfolio_date exists for it. Debt schemes disclose
   fortnightly under SEBI rules while everything else is monthly, so they are
   the first to show movement.
   ========================================================================== */
const CHG_ACTIONS = [
  ["bought", "Bought",        "Positions whose disclosed value went up"],
  ["sold",   "Sold",          "Positions whose disclosed value went down"],

/* ==========================================================================
   Compare — funds and fund houses, any mix
   ========================================================================== */
const CMP_MAX_FUNDS = 10, CMP_MAX_AMCS = 5;
let CMP = { funds: [], amcs: [] };   // funds: [{code,name,amc}], amcs: [name]

/* A comparison is like-for-like: funds against funds, houses against houses.
   The two are not the same kind of thing -- a house is hundreds of schemes
   pooled, so its returns are a median and its overlap against one of its own
   funds reads high by construction. Mixing them produces a table that looks
   authoritative and answers nothing, so the mix is refused at selection. */
const CMP_MIX_FUND = "You can't compare a fund with an AMC. Clear the fund houses first, or compare houses only.";
const CMP_MIX_AMC  = "You can't compare an AMC with a fund. Clear the funds first, or compare funds only.";

function cmpAddFund(code, name, amc) {
  code = String(code);
  if (CMP.amcs.length) return CMP_MIX_FUND;
  if (CMP.funds.some(f => f.code === code)) return "already added";
  if (CMP.funds.length >= CMP_MAX_FUNDS) return `max ${CMP_MAX_FUNDS} funds`;
  CMP.funds.push({ code, name, amc });
  return null;
}
function cmpAddAmc(name) {
  if (CMP.funds.length) return CMP_MIX_AMC;
  if (CMP.amcs.includes(name)) return "already added";
  if (CMP.amcs.length >= CMP_MAX_AMCS) return `max ${CMP_MAX_AMCS} AMCs`;
  CMP.amcs.push(name);
  return null;
}
const cmpCount = () => CMP.funds.length + CMP.amcs.length;

/* small "+ Compare" button used on AMC and fund pages */
function cmpButton(label, addFn) {
  const b = el("button", "btn ghost", label);
  b.style.cssText += ";padding:7px 13px;font-size:12px";
  b.onclick = ev => {
    ev.stopPropagation();
    const err = addFn();
    if (err) {
      // the mix refusal is a full sentence — a button label cannot hold it
      if (err.length > 24) { toast(err, "err"); return; }
      b.textContent = err; setTimeout(() => b.textContent = label, 1400); return;
    }
    b.textContent = `Added (${cmpCount()})`;
    setTimeout(() => b.textContent = label, 1400);
  };
  return b;
}

async function viewCompare(v) {
  hero("Compare", `Up to ${CMP_MAX_FUNDS} funds, or up to ${CMP_MAX_AMCS} fund houses — one kind at a time.`);
  v.innerHTML = loading("Loading…");
  const amcs = await rpc("amc_summary");
  v.innerHTML = "";

  const c = el("div", "card");
  c.appendChild(el("h2", "", "What to compare"));
  c.appendChild(el("div", "hint",
    "Compare <b>funds with funds</b>, or <b>houses with houses</b> — not one against the " +
    "other. A fund house is pooled into one portfolio (every holding across its schemes, " +
    "summed by ISIN, re-expressed as a share of the whole house), so it is a different kind " +
    "of thing from a single scheme: its return is a median, and its overlap against one of " +
    "its own funds is high by construction. Picking one kind locks the other until you clear."));

  const note = el("div");
  c.appendChild(note);

  /* AMC chips */
  c.appendChild(el("h3", "", "Fund houses"));
  const achips = el("div", "chips");
  [...amcs].sort((a, b) => a.amc.localeCompare(b.amc)).forEach(a => {
    const b = el("button", "chip" + (CMP.amcs.includes(a.amc) ? " on" : ""), esc(a.amc));
    b.onclick = () => {
      const i = CMP.amcs.indexOf(a.amc);
      if (i >= 0) { CMP.amcs.splice(i, 1); b.classList.remove("on"); }
      else {
        const err = cmpAddAmc(a.amc);
        if (err) {
          if (err === CMP_MIX_AMC) { refuse(err); return; }
          b.textContent = err; setTimeout(() => b.textContent = a.amc, 1400); return;
        }
        b.classList.add("on");
      }
      paintSel();
    };
    achips.appendChild(b);
  });
  c.appendChild(achips);

  /* fund search */
  c.appendChild(el("h3", "", "Funds"));
  const bar = el("div", "cmp");
  const inp = el("input");
  inp.placeholder = "Search a fund to add…";
  bar.appendChild(inp);
  c.appendChild(bar);
  const drop = el("div", "results");
  drop.style.position = "static"; drop.style.marginTop = "-8px";
  c.appendChild(drop);

  const sel = el("div"); c.appendChild(sel);
  const actions = el("div"); actions.style.cssText = "display:flex;gap:9px;margin-top:14px";
  const run = el("button", "btn", "Compare");
  const clr = el("button", "btn ghost", "Clear all");
  actions.append(run, clr); c.appendChild(actions);
  v.appendChild(c);

  const out = el("div"); v.appendChild(out);

  /* the refusal shows in two places at once: inline where the eye already is,
     and as a toast, because the chip grid can be scrolled well past the note */
  let noteT = null;
  const refuse = m => {
    note.innerHTML = `<div class="note err" style="margin:12px 0 0">${esc(m)}</div>`;
    toast(m, "err");
    clearTimeout(noteT);
    noteT = setTimeout(() => { note.innerHTML = ""; }, 5000);
  };

  /* whichever kind is chosen first locks the other, so the mix is not merely
     rejected on click — it visibly is not on offer */
  const paintLock = () => {
    const amcLock  = CMP.funds.length > 0;
    const fundLock = CMP.amcs.length  > 0;
    achips.style.opacity = amcLock ? ".42" : "";
    bar.style.opacity    = fundLock ? ".42" : "";
    inp.placeholder = fundLock
      ? "Comparing fund houses — clear them to compare funds"
      : "Search a fund to add…";
  };

  const paintSel = () => {
    sel.innerHTML = "";
    paintLock();
    if (!cmpCount()) { sel.appendChild(el("div", "empty", "Nothing selected yet.")); return; }
    const row = el("div", "chips"); row.style.marginTop = "12px";
    CMP.amcs.forEach((a, i) => {
      const t = el("button", "chip on", `${esc(a)} ✕`);
      t.onclick = () => { CMP.amcs.splice(i, 1);
        [...achips.children].forEach(n => n.classList.toggle("on", CMP.amcs.includes(n.textContent)));
        paintSel(); };
      row.appendChild(t);
    });
    CMP.funds.forEach((f, i) => {
      const t = el("button", "chip on", `${esc(short(f.name, 34))} ✕`);
      t.onclick = () => { CMP.funds.splice(i, 1); paintSel(); };
      row.appendChild(t);
    });
    sel.appendChild(row);
    sel.appendChild(el("div", "hint",
      `${CMP.amcs.length}/${CMP_MAX_AMCS} houses · ${CMP.funds.length}/${CMP_MAX_FUNDS} funds`));
  };
  paintSel();

  let tmr = null;
  inp.addEventListener("input", e => {
    const q = e.target.value.trim();
    clearTimeout(tmr);
    // houses are already in play — say so instead of searching, so the refusal
    // arrives before the user has picked a fund and grown attached to it
    if (CMP.amcs.length) {
      e.target.value = ""; drop.classList.remove("on");
      if (q) refuse(CMP_MIX_FUND);
      return;
    }
    if (q.length < 2) { drop.classList.remove("on"); return; }
    tmr = setTimeout(async () => {
      try {
        const rows = (await rpc("search_schemes", { q, lim: 12 }))
          .filter(r => r.has_holdings && !CMP.funds.some(f => f.code === String(r.scheme_code)));
        drop.innerHTML = "";
        if (!rows.length) {
          drop.innerHTML = `<div class="res"><div><div class="nm">Nothing to add</div>
            <div class="sub">Only schemes with a loaded portfolio can be compared</div></div></div>`;
          drop.classList.add("on"); return;
        }
        rows.forEach(r => {
          const n = el("div", "res", `<div style="flex:1"><div class="nm">${esc(r.scheme_name)}</div>
            <div class="sub">${esc(r.amc_name || "")}</div></div>`);
          n.onclick = () => {
            const err = cmpAddFund(r.scheme_code, r.scheme_name, r.amc_name);
            if (err) { drop.classList.remove("on"); refuse(err); return; }
            inp.value = ""; drop.classList.remove("on"); paintSel();
          };
          drop.appendChild(n);
        });
        drop.classList.add("on");
      } catch (err) { drop.classList.remove("on"); }
    }, 220);
  });

  clr.onclick = () => { CMP = { funds: [], amcs: [] };
    [...achips.children].forEach(n => n.classList.remove("on"));
    paintSel(); out.innerHTML = ""; };
  run.onclick = () => runCompare(out);
  if (cmpCount() >= 2) runCompare(out);
}

/* Live per-fund returns for Compare -- pulls daily NAV from api.mfapi.in for
   each selected fund and computes 1Y (plain), 3Y/5Y (annualised), 3Y volatility
   and Sharpe client-side, the same maths the fund page uses. At most 10 funds,
   so 10 parallel calls -- fast, and it needs no stored NAV, so a freshly loaded
   fund shows returns immediately. Shape matches compare_returns() so the table,
   report and Excel render unchanged. */
async function fundReturnsLive(funds) {
  const rows = await Promise.all((funds || []).slice(0, 10).map(async f => {
    try {
      const { series } = await loadNav(f.code);
      if (!series || series.length < 2) return null;
      const rr = returns(series);
      const g = (nm, k) => { const x = rr.find(p => p.name === nm); return x ? x[k] : null; };
      const rk = risk(series, 3);
      const last = series[series.length - 1];
      return {
        entity: f.name, kind: "Fund",
        nav: last.v, nav_date: last.t.toISOString().slice(0, 10),
        ret_1y: g("1Y", "abs"),          // 1Y plain change
        ret_3y: g("3Y", "ann"),          // annualised
        ret_5y: g("5Y", "ann"),
        vol_3y: rk ? rk.vol : null,
        sharpe_3y: rk ? rk.sharpe : null,
        funds_covered: 1, basis: "own NAV (live)"
      };
    } catch (_e) { return null; }        // fund with no mfapi history is dropped
  }));
  return rows.filter(Boolean).sort((a, b) =>
    (b.ret_1y ?? -1e9) - (a.ret_1y ?? -1e9));
}

async function runCompare(out) {
  // belt and braces: selection already refuses the mix, this catches any state
  // that arrived some other way (an old link, a stale CMP from before a reload)
  if (CMP.funds.length && CMP.amcs.length) {
    out.innerHTML = `<div class="card"><div class="note err">${esc(CMP_MIX_AMC)}</div></div>`;
    return;
  }
  if (cmpCount() < 2) {
    out.innerHTML = `<div class="card"><div class="empty">
      Pick at least two things to compare.</div></div>`;
    return;
  }
  out.innerHTML = loading("Comparing…");
  const args = { p_funds: CMP.funds.map(f => f.code), p_amcs: CMP.amcs };

  try {
    const [sumR, ovR, secR, hldR] = await Promise.all([
      rpc("compare_summary",  args),
      rpc("compare_overlap",  args),
      rpc("compare_sectors",  { ...args, lim: 18 }),
      rpc("compare_holdings", { ...args, lim: 35 })
    ]);
    // Returns: funds are fetched LIVE from api.mfapi.in per scheme, so any fund
    // works whether or not its monthly NAV was ever ingested -- no "no history"
    // gap. An AMC has no NAV of its own (its return is the median across ~100
    // schemes), which cannot be fetched live, so a house still reads the stored
    // mv_fund_returns. A comparison is funds-only or houses-only, so exactly one
    // path runs.
    const retR = CMP.amcs.length
      ? (await soft(rpc("compare_returns", { p_amcs: CMP.amcs }))) || []
      : await fundReturnsLive(CMP.funds);
    out.innerHTML = "";
    const names = sumR.map(r => r.entity);

    /* ---- download bar ---- */
    const bar = el("div", "cmp-actions");
    const dl = el("button", "btn", "⤓ Download report");
    dl.onclick = () => downloadCompareReport({ names, sumR, retR, ovR, secR, hldR });
    const xl = el("button", "btn ghost", "⤓ Excel");
    xl.onclick = () => downloadCompareExcel({ names, sumR, retR, ovR, secR, hldR });
    const prn = el("button", "btn ghost", "Print / Save PDF");
    prn.onclick = () => printCompareReport({ names, sumR, retR, ovR, secR, hldR });
    bar.append(dl, xl, prn);
    out.appendChild(bar);

    /* ---- headline table ---- */
    const c1 = el("div", "card");
    c1.appendChild(el("h2", "", "Side by side"));
    c1.appendChild(el("div", "hint",
      "Read <b>effective stocks</b> against <b>securities</b>: a house pooling 900 names can " +
      "still behave like 40 positions if its schemes crowd the same book."));
    c1.appendChild(table(sumR, [
      { h: "", fn: r => `<span class="pill ${r.kind === "AMC" ? "gold" : "blue"}">${r.kind}</span>` },
      { h: "Name", fn: r => `<b>${esc(r.entity)}</b>${r.kind === "AMC"
          ? `<div class="sub2">${fmt(r.schemes, 0)} schemes</div>` : ""}` },
      { h: "AUM", n: 1, fn: r => cr(r.aum_cr) },
      { h: "Securities", n: 1, fn: r => fmt(r.securities, 0) },
      { h: "Top 10", n: 1, fn: r => pct(r.top_10_pct) },
      { h: "Largest", n: 1, fn: r => `${pct(r.largest_pct)}
          <div class="sub2">${esc(short(r.largest_name, 18))}</div>` },
      { h: "Eff. stocks", n: 1, fn: r => `<b>${fmt(r.effective_stocks, 1)}</b>` },
      { h: "Sectors", n: 1, fn: r => fmt(r.sectors, 0) },
      { h: "Top sector", fn: r => r.top_sector
          ? `${esc(short(r.top_sector, 18))} <span class="sub2">${pct(r.top_sector_pct)}</span>` : "—" },
      { h: "Equity", n: 1, fn: r => pct(r.equity_pct) },
      { h: "Debt", n: 1, fn: r => pct(r.debt_pct) },
      { h: "Cash", n: 1, fn: r => pct(r.cash_pct) }
    ]));
    out.appendChild(c1);

    /* ---- returns ---- */
    if (retR && retR.length) {
      const cR = el("div", "card");
      cR.appendChild(el("h2", "", "Returns"));
      cR.appendChild(el("div", "hint",
        "1Y is the plain change; 3Y and 5Y are <b>annualised</b>. A fund shows its own " +
        "NAV. A fund house has no NAV of its own, and pooling a liquid fund with a small " +
        "cap gives a number that means nothing — so an AMC shows the <b>median across its " +
        "schemes</b>, with the scheme count beside it. Read an AMC row as \"the typical " +
        "scheme here\", never as what you would have earned."));
      cR.appendChild(table(retR, [
        { h: "", fn: r => `<span class="pill ${r.kind === "AMC" ? "gold" : "blue"}">${r.kind}</span>` },
        { h: "Name", fn: r => `<b>${esc(r.entity)}</b>${r.kind === "AMC"
            ? `<div class="sub2">median of ${fmt(r.funds_covered, 0)} schemes</div>` : ""}` },
        { h: "NAV", n: 1, fn: r => r.nav == null ? "—"
            : `${fmt(r.nav, 2)}<div class="sub2">${esc(String(r.nav_date || ""))}</div>` },
        { h: "1Y",  n: 1, fn: r => `<b class="${signOf(r.ret_1y)}">${signed(r.ret_1y)}</b>` },
        { h: "3Y",  n: 1, fn: r => `<span class="${signOf(r.ret_3y)}">${signed(r.ret_3y)}</span>` },
        { h: "5Y",  n: 1, fn: r => `<span class="${signOf(r.ret_5y)}">${signed(r.ret_5y)}</span>` },
        { h: "Vol 3Y", n: 1, fn: r => pct(r.vol_3y) },
        { h: "Sharpe", n: 1, fn: r => fmt(r.sharpe_3y) }
      ]));
      // A fund younger than the window has no 3Y/5Y at all, and one with no NAV
      // history is missing from retR entirely. Say so rather than leaving a gap.
      const got  = new Set(retR.map(r => r.entity));
      const miss = names.filter(n => !got.has(n));
      if (miss.length) cR.appendChild(el("div", "hint",
        `No NAV history yet for ${miss.map(n => esc(n)).join(", ")} — ` +
        `blank cells elsewhere mean the fund is younger than that window.`));
      out.appendChild(cR);
    }

    /* ---- overlap matrix ---- */
    if (ovR.length) {
      const c2 = el("div", "card");
      c2.appendChild(el("h2", "", "Overlap"));
      c2.appendChild(el("div", "hint",
        "Sum of min(weight) across shared ISINs. Two funds above 70% are close to one " +
        "position wearing two expense ratios. Two large houses will always overlap heavily — " +
        "they own the same top of the market."));
      const map = {};
      ovR.forEach(o => {
        (map[o.entity_a] = map[o.entity_a] || {})[o.entity_b] = o;
        (map[o.entity_b] = map[o.entity_b] || {})[o.entity_a] = o;
      });
      const box = el("div", "tblwrap");
      const t = el("table");
      t.innerHTML = `<thead><tr><th></th>${names.map(n =>
        `<th class="n">${esc(short(n, 16))}</th>`).join("")}</tr></thead>`;
      const tb = el("tbody");
      names.forEach(a => {
        const tr = el("tr");
        tr.innerHTML = `<td><b>${esc(short(a, 26))}</b></td>` + names.map(b => {
          if (a === b) return `<td class="n" style="color:var(--border)">—</td>`;
          const o = (map[a] || {})[b];
          const val = o ? Number(o.overlap_pct) : null;
          const col = val == null ? "" : val > 70 ? "down" : val > 40 ? "" : "up";
          return `<td class="n ${col}">${val == null ? "—" : pct(val)}</td>`;
        }).join("");
        tb.appendChild(tr);
      });
      t.appendChild(tb); box.appendChild(t); c2.appendChild(box);
      out.appendChild(c2);
    }

    /* ---- sector grid ---- */
    if (secR.length) {
      const c3 = el("div", "card");
      c3.appendChild(el("h2", "", "Sector exposure"));
      c3.appendChild(el("div", "hint",
        "Weight in each entity's own book. Blank means the entity holds nothing in that sector."));
      const piv = {};
      secR.forEach(r => { (piv[r.sector] = piv[r.sector] || {})[r.entity] = Number(r.weight); });
      const rows = Object.entries(piv)
        .map(([sector, byEnt]) => ({ sector, byEnt,
          peak: Math.max(...Object.values(byEnt)) }))
        .sort((a, b) => b.peak - a.peak);
      const box = el("div", "tblwrap");
      const t = el("table");
      t.innerHTML = `<thead><tr><th>Sector</th>${names.map(n =>
        `<th class="n">${esc(short(n, 16))}</th>`).join("")}</tr></thead>`;
      const tb = el("tbody");
      rows.forEach(r => {
        const tr = el("tr");
        const best = Math.max(...names.map(n => r.byEnt[n] || 0));
        tr.innerHTML = `<td><span class="lnk">${esc(r.sector)}</span></td>` + names.map(n => {
          const v = r.byEnt[n];
          if (v == null) return `<td class="n" style="color:var(--border)">—</td>`;
          return `<td class="n"${v === best ? ' style="font-weight:700"' : ""}>${pct(v)}</td>`;
        }).join("");
        tr.onclick = () => go("#/sector/" + encodeURIComponent(r.sector));
        tb.appendChild(tr);
      });
      t.appendChild(tb); box.appendChild(t); c3.appendChild(box);
      out.appendChild(c3);
    }

    /* ---- holdings grid ---- */
    if (hldR.length) {
      const c4 = el("div", "card");
      c4.appendChild(el("h2", "", "Holdings"));
      c4.appendChild(el("div", "hint",
        "Ranked by the highest weight any one entity gives the name, so a heavy single-fund " +
        "position is not buried under names everyone holds lightly."));
      const piv = {};
      hldR.forEach(r => {
        const k = r.isin;
        piv[k] = piv[k] || { isin: r.isin, instrument: r.instrument, sector: r.sector,
                             held_by: r.held_by, byEnt: {} };
        piv[k].byEnt[r.entity] = Number(r.weight);
      });
      const rows = Object.values(piv)
        .sort((a, b) => Math.max(...Object.values(b.byEnt)) - Math.max(...Object.values(a.byEnt)));
      const box = el("div", "tblwrap");
      const t = el("table");
      t.innerHTML = `<thead><tr><th>Instrument</th><th class="n">Held by</th>${names.map(n =>
        `<th class="n">${esc(short(n, 14))}</th>`).join("")}</tr></thead>`;
      const tb = el("tbody");
      rows.forEach(r => {
        const tr = el("tr");
        const best = Math.max(...names.map(n => r.byEnt[n] || 0));
        tr.innerHTML = `<td><span class="lnk">${esc(r.instrument)}</span>
            <div class="sub2">${esc(short(r.sector, 22))}</div></td>
          <td class="n">${r.held_by}/${names.length}</td>` + names.map(n => {
          const v = r.byEnt[n];
          if (v == null) return `<td class="n" style="color:var(--border)">—</td>`;
          return `<td class="n"${v === best ? ' style="font-weight:700"' : ""}>${pct(v)}</td>`;
        }).join("");
        tr.onclick = () => go("#/stock/" + r.isin);
        tb.appendChild(tr);
      });
      t.appendChild(tb); box.appendChild(t); c4.appendChild(box);
      out.appendChild(c4);
    }
  } catch (e) { out.innerHTML = errCard(e); }
}


/* ==========================================================================
   Compare report -- a self-contained HTML document the customer can save,
   open offline and print to PDF. No libraries: everything is inlined.
   ========================================================================== */
function buildReportHTML(d) {
  const { names, sumR, retR, ovR, secR, hldR } = d;
  const today = new Date().toLocaleDateString("en-IN",
    { day: "2-digit", month: "short", year: "numeric" });
  const esc2 = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const sign = n => n == null || !isFinite(n) ? "—" : (n > 0 ? "+" : "") + Number(n).toFixed(2) + "%";
  const cls = n => n == null || !isFinite(n) ? "" : n > 0 ? "up" : n < 0 ? "dn" : "";

  const th = a => `<th${a ? ' class="n"' : ""}>`;
  const td = (v, a) => `<td${a ? ' class="n"' : ""}>${v == null ? "—" : v}</td>`;

  // summary
  const sumRows = sumR.map(r => `<tr>
    <td><span class="tag ${r.kind === "AMC" ? "g" : "b"}">${r.kind}</span></td>
    <td><b>${esc2(r.entity)}</b>${r.kind === "AMC" ? `<div class="s2">${fmt(r.schemes, 0)} schemes</div>` : ""}</td>
    ${td(cr(r.aum_cr), 1)}${td(fmt(r.securities, 0), 1)}${td(pct(r.top_10_pct), 1)}
    ${td(pct(r.largest_pct) + `<div class="s2">${esc2(short(r.largest_name || "", 20))}</div>`, 1)}
    ${td("<b>" + fmt(r.effective_stocks, 1) + "</b>", 1)}${td(fmt(r.sectors, 0), 1)}
    ${td(r.top_sector ? esc2(short(r.top_sector, 18)) + ` <span class="s2">${pct(r.top_sector_pct)}</span>` : "—")}
    ${td(pct(r.equity_pct), 1)}${td(pct(r.debt_pct), 1)}${td(pct(r.cash_pct), 1)}</tr>`).join("");

  // returns
  const retBlock = (retR && retR.length) ? `
    <h2>Returns</h2>
    <table><thead><tr>${th()}Kind</th>${th()}Name</th>${th(1)}NAV</th>${th(1)}1Y</th>
      ${th(1)}3Y</th>${th(1)}5Y</th>${th(1)}Vol 3Y</th>${th(1)}Sharpe</th></tr></thead><tbody>
    ${retR.map(r => `<tr><td><span class="tag ${r.kind === "AMC" ? "g" : "b"}">${r.kind}</span></td>
      <td><b>${esc2(r.entity)}</b>${r.kind === "AMC" ? `<div class="s2">median of ${fmt(r.funds_covered, 0)}</div>` : ""}</td>
      ${td(r.nav == null ? "—" : fmt(r.nav, 2), 1)}
      ${td(`<span class="${cls(r.ret_1y)}">${sign(r.ret_1y)}</span>`, 1)}
      ${td(`<span class="${cls(r.ret_3y)}">${sign(r.ret_3y)}</span>`, 1)}
      ${td(`<span class="${cls(r.ret_5y)}">${sign(r.ret_5y)}</span>`, 1)}
      ${td(pct(r.vol_3y), 1)}${td(fmt(r.sharpe_3y), 1)}</tr>`).join("")}
    </tbody></table>
    <p class="note">1Y is the plain change; 3Y and 5Y are annualised. An AMC row is the median across its schemes.</p>` : "";

  // overlap
  let ovBlock = "";
  if (ovR && ovR.length) {
    const map = {};
    ovR.forEach(o => { (map[o.entity_a] = map[o.entity_a] || {})[o.entity_b] = o;
      (map[o.entity_b] = map[o.entity_b] || {})[o.entity_a] = o; });
    ovBlock = `<h2>Overlap</h2><table><thead><tr><th></th>${names.map(n =>
      `${th(1)}${esc2(short(n, 16))}</th>`).join("")}</tr></thead><tbody>${names.map(a =>
      `<tr><td><b>${esc2(short(a, 24))}</b></td>${names.map(b => {
        if (a === b) return `<td class="n dim">—</td>`;
        const o = (map[a] || {})[b];
        return `<td class="n">${o ? pct(o.overlap_pct) : "—"}</td>`; }).join("")}</tr>`).join("")}
      </tbody></table><p class="note">Sum of the smaller weight across shared holdings — how much two books are the same position.</p>`;
  }

  // sectors pivot
  let secBlock = "";
  if (secR && secR.length) {
    const piv = {}; secR.forEach(r => { (piv[r.sector] = piv[r.sector] || {})[r.entity] = Number(r.weight); });
    const rows = Object.entries(piv).map(([s, by]) => ({ s, by, pk: Math.max(...Object.values(by)) }))
      .sort((a, b) => b.pk - a.pk).slice(0, 18);
    secBlock = `<h2>Sector exposure</h2><table><thead><tr><th>Sector</th>${names.map(n =>
      `${th(1)}${esc2(short(n, 16))}</th>`).join("")}</tr></thead><tbody>${rows.map(r =>
      `<tr><td>${esc2(r.s)}</td>${names.map(n => `<td class="n">${r.by[n] == null ? "—" : pct(r.by[n])}</td>`).join("")}</tr>`
      ).join("")}</tbody></table>`;
  }

  // holdings pivot
  let hldBlock = "";
  if (hldR && hldR.length) {
    const piv = {}; hldR.forEach(r => { const k = r.isin;
      piv[k] = piv[k] || { instrument: r.instrument, sector: r.sector, by: {} };
      piv[k].by[r.entity] = Number(r.weight); });
    const rows = Object.values(piv).sort((a, b) =>
      Math.max(...Object.values(b.by)) - Math.max(...Object.values(a.by))).slice(0, 30);
    hldBlock = `<h2>Top holdings</h2><table><thead><tr><th>Instrument</th>${names.map(n =>
      `${th(1)}${esc2(short(n, 14))}</th>`).join("")}</tr></thead><tbody>${rows.map(r =>
      `<tr><td>${esc2(r.instrument)}<div class="s2">${esc2(short(r.sector || "", 26))}</div></td>${names.map(n =>
        `<td class="n">${r.by[n] == null ? "—" : pct(r.by[n])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }

  return `<!doctype html><html><head><meta charset="utf-8">
<title>Fund Comparison Report — InvestVerdict</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#0F172A;margin:0;
    padding:36px;background:#fff;font-size:13px;line-height:1.5}
  .head{display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid #C9A961;padding-bottom:16px;margin-bottom:22px}
  .brand{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .brand span{color:#C9A961}
  .meta{text-align:right;font-size:12px;color:#64748B}
  h1{font-size:19px;margin:0 0 4px}
  h2{font-size:15px;margin:26px 0 8px;color:#0B1F3A;border-left:3px solid #C9A961;padding-left:9px}
  .ent{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
  .ent span{background:#F1F5F9;border:1px solid #E2E8F0;border-radius:99px;padding:5px 12px;font-weight:600;font-size:12px}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
  th,td{padding:7px 9px;text-align:left;border-bottom:1px solid #EEF2F7;vertical-align:top}
  th{background:#0B1F3A;color:#fff;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
  th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:nth-child(even){background:#FafBfC}
  .s2{font-size:10.5px;color:#94A3B8;font-weight:400}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;color:#fff}
  .tag.g{background:#C9A961}.tag.b{background:#2563EB}
  .up{color:#059669;font-weight:700}.dn{color:#DC2626;font-weight:700}
  .dim{color:#CBD5E1}
  .note{font-size:11px;color:#64748B;margin:6px 0 0}
  .foot{margin-top:34px;padding-top:14px;border-top:1px solid #E2E8F0;font-size:10.5px;color:#94A3B8}
  @media print{body{padding:0}h2{page-break-after:avoid}table{page-break-inside:auto}tr{page-break-inside:avoid}}
</style></head><body>
  <div class="head">
    <div><div class="brand">Invest<span>Verdict</span></div>
      <div style="font-size:12px;color:#64748B;margin-top:2px">Fund analytics engine</div></div>
    <div class="meta">Comparison report<br>Generated ${esc2(today)}</div>
  </div>
  <h1>Comparing ${names.length} ${names.length === 1 ? "entity" : "entities"}</h1>
  <div class="ent">${names.map(n => `<span>${esc2(n)}</span>`).join("")}</div>

  <h2>Side by side</h2>
  <table><thead><tr>${th()}Kind</th>${th()}Name</th>${th(1)}AUM</th>${th(1)}Securities</th>
    ${th(1)}Top 10</th>${th(1)}Largest</th>${th(1)}Eff. stocks</th>${th(1)}Sectors</th>
    ${th()}Top sector</th>${th(1)}Equity</th>${th(1)}Debt</th>${th(1)}Cash</th></tr></thead>
    <tbody>${sumRows}</tbody></table>
  <p class="note">Effective stocks = 10,000 / HHI — how many equal positions the book really behaves like.</p>

  ${retBlock}${ovBlock}${secBlock}${hldBlock}

  <div class="foot">
    InvestVerdict — figures derived from AMCs' own monthly SEBI portfolio disclosures; each entity shown at its
    latest disclosed date. AUM is the sum of disclosed holding values, not an official figure. An AMC is pooled
    into one book (holdings summed by ISIN, re-expressed as a share of the whole house). For information only,
    not investment advice.
  </div>
</body></html>`;
}

function reportFilename(names) {
  const slug = names.map(n => String(n).replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, ""))
    .join("_vs_").slice(0, 80) || "comparison";
  const d = new Date().toISOString().slice(0, 10);
  return `InvestVerdict_${slug}_${d}.html`;
}

function downloadCompareReport(d) {
  const blob = new Blob([buildReportHTML(d)], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = reportFilename(d.names);
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function printCompareReport(d) {
  const w = window.open("", "_blank");
  if (!w) { downloadCompareReport(d); return; }   // popup blocked -> just download
  w.document.write(buildReportHTML(d));
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 350);
}


/* ==========================================================================
   Compare workbook -- one Excel sheet with EVERY section stacked.
   No library: Excel opens an HTML table saved as .xls. A single table (not
   several) is what actually survives across Excel versions -- multiple tables
   silently collapsed to one sheet or came through empty. Numbers are plain cell
   text so Excel auto-detects them as numbers; nothing forces a text format.
   ========================================================================== */
function buildReportXLS(d) {
  const { names, sumR, retR, ovR, secR, hldR } = d;
  const esc2 = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const n2 = v => (v == null || !isFinite(v)) ? "" : Math.round(Number(v) * 100) / 100;

  const rows = [];
  const R = cells => rows.push("<tr>" + cells + "</tr>");
  const tx = (v, span) => `<td${span ? ` colspan="${span}"` : ""}>${v == null ? "" : esc2(v)}</td>`;
  const nm = v => { const x = n2(v); return `<td class="n">${x}</td>`; };   // number cell
  const blank = () => R(`<td></td>`);
  const section = t => R(`<td class="sec" colspan="16">${esc2(t)}</td>`);
  const heads = arr => R(arr.map((h, i) => `<td class="h${i ? " n" : ""}">${esc2(h)}</td>`).join(""));

  // title
  const today = new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
  R(`<td class="title" colspan="16">InvestVerdict — Fund comparison — ${esc2(today)}</td>`);
  R(`<td class="subt" colspan="16">${esc2(names.join("  ·  "))}</td>`);
  blank();

  // 1. side by side
  section("SIDE BY SIDE");
  heads(["Kind", "Name", "Schemes", "AUM (Cr)", "Securities", "Top 10 %", "Largest %",
    "Largest name", "Eff. stocks", "Sectors", "Top sector", "Top sector %", "Equity %", "Debt %", "Cash %"]);
  sumR.forEach(r => R(tx(r.kind) + tx(r.entity) + nm(r.kind === "AMC" ? r.schemes : 1) +
    nm(r.aum_cr) + nm(r.securities) + nm(r.top_10_pct) + nm(r.largest_pct) + tx(r.largest_name) +
    nm(r.effective_stocks) + nm(r.sectors) + tx(r.top_sector) + nm(r.top_sector_pct) +
    nm(r.equity_pct) + nm(r.debt_pct) + nm(r.cash_pct)));
  blank();

  // 2. returns
  if (retR && retR.length) {
    section("RETURNS  (1Y plain · 3Y/5Y annualised · AMC = median of its schemes)");
    heads(["Kind", "Name", "NAV", "1Y %", "3Y %", "5Y %", "Vol 3Y %", "Sharpe", "Funds covered", "Basis"]);
    retR.forEach(r => R(tx(r.kind) + tx(r.entity) + nm(r.nav) + nm(r.ret_1y) + nm(r.ret_3y) +
      nm(r.ret_5y) + nm(r.vol_3y) + nm(r.sharpe_3y) + nm(r.funds_covered) + tx(r.basis)));
    blank();
  }

  // 3. overlap
  if (ovR && ovR.length) {
    const omap = {};
    ovR.forEach(o => { (omap[o.entity_a] = omap[o.entity_a] || {})[o.entity_b] = o.overlap_pct;
      (omap[o.entity_b] = omap[o.entity_b] || {})[o.entity_a] = o.overlap_pct; });
    section("OVERLAP %  (shared weight between each pair)");
    heads(["Entity", ...names]);
    names.forEach(a => R(tx(a) + names.map(b => a === b ? `<td class="n">—</td>` : nm((omap[a] || {})[b])).join("")));
    blank();
  }

  // 4. sectors
  if (secR && secR.length) {
    const piv = {}; secR.forEach(r => { (piv[r.sector] = piv[r.sector] || {})[r.entity] = r.weight; });
    section("SECTOR EXPOSURE %");
    heads(["Sector", ...names]);
    Object.keys(piv).forEach(s => R(tx(s) + names.map(n => nm(piv[s][n])).join("")));
    blank();
  }

  // 5. holdings
  if (hldR && hldR.length) {
    const piv = {}; hldR.forEach(r => { const k = r.isin;
      piv[k] = piv[k] || { instrument: r.instrument, sector: r.sector, by: {} };
      piv[k].by[r.entity] = r.weight; });
    section("TOP HOLDINGS %");
    heads(["Instrument", "ISIN", "Sector", ...names]);
    Object.entries(piv).forEach(([isin, h]) =>
      R(tx(h.instrument) + tx(isin) + tx(h.sector) + names.map(n => nm(h.by[n])).join("")));
    blank();
  }

  R(`<td class="foot" colspan="16">Figures from AMCs' own monthly SEBI portfolio disclosures; each entity at its latest disclosed date. AUM = sum of disclosed holding values. An AMC is pooled into one book. For information only, not investment advice.</td>`);

  return `<html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8">
    <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
      <x:Name>Comparison</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
      </x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
    <style>
      table{border-collapse:collapse;font-family:Calibri,Arial,sans-serif;font-size:11pt}
      td{border:1px solid #D9D9D9;padding:4px 9px;vertical-align:top}
      td.n{text-align:right}
      .title{font-size:15pt;font-weight:bold;border:0;color:#0B1F3A}
      .subt{border:0;color:#555}
      .sec{background:#0B1F3A;color:#fff;font-weight:bold;letter-spacing:.5px}
      .h{background:#E7ECF3;font-weight:bold;color:#0B1F3A}
      .foot{border:0;color:#888;font-size:9pt}
    </style></head><body><table>${rows.join("")}</table></body></html>`;
}

function downloadCompareExcel(d) {
  // leading BOM keeps non-ASCII fund names intact when Excel reads the file
  const blob = new Blob(["﻿" + buildReportXLS(d)],
    { type: "application/vnd.ms-excel;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = reportFilename(d.names).replace(/\.html$/, ".xls");
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
